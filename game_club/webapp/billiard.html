<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>Game Club · بیلیارد</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/billiard.css">
</head>
<body class="billiard">
<!-- چیدمان صفحهٔ بازی روی قاب مرجع ۶۰۰×۱۲۸۰ (واحد --u)؛ میز، توپ ها، چوب و خط ها روی بوم کشیده می شوند -->
<div id="wrap"><div id="frame">
  <canvas id="table" aria-label="میز بیلیارد"></canvas>

  <!-- هدر: برگشت، بازیکن ها و VS، تایمر، منو -->
  <button class="abs round" id="exit" aria-label="خروج از بازی"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
  <div class="abs" id="timer" aria-hidden="true"><i></i><div id="timerTrack"><div id="timerBar"></div></div></div>
  <div id="players" aria-live="polite"></div>
  <span class="abs" id="vs">VS</span>
  <button class="abs round" id="menuBtn" aria-label="منو"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button>

  <!-- پیام بالای میز -->
  <div class="abs show" id="msg">در حال وصل شدن…</div>

  <!-- چپ: آیتم ها و نوار قدرت -->
  <span class="abs" id="itemsLbl">ITEMS</span>
  <button class="abs round" id="items" aria-label="پیام سریع"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc928" stroke="#e09a0a" stroke-width=".8" stroke-linejoin="round"/></svg></button>
  <div class="abs" id="power" role="slider" aria-label="قدرت ضربه؛ به پایین بکش و رها کن" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><canvas id="powerCv" width="74" height="784"></canvas></div>

  <!-- راست: خط راهنما، پیچ، تنظیم دقیق -->
  <button class="abs round" id="eye" aria-label="خط راهنما" aria-pressed="true"><i></i></button>
  <canvas class="abs" id="english" width="124" height="124" aria-label="پیچ توپ"></canvas>
  <span class="abs" id="fineLbl">FINE AIM</span>
  <button class="abs fine" id="fineUp" aria-label="تنظیم دقیق به یک سمت"><i></i></button>
  <button class="abs fine" id="fineDown" aria-label="تنظیم دقیق به سمت دیگر"><i></i></button>

  <!-- نوار پیام -->
  <div class="abs" id="chatbar"></div>

  <!-- پنل پیچ: توپ بزرگ، PRESET، CLOSE -->
  <div class="abs" id="spinPop">
    <canvas id="spinBig" width="600" height="600"></canvas>
    <span id="presetLbl">PRESET</span>
    <canvas class="preset" data-sx="-1" data-sy="0" width="140" height="140" style="left:calc(122 * var(--u))"></canvas>
    <canvas class="preset" data-sx="0" data-sy="1" width="140" height="140" style="left:calc(196 * var(--u))"></canvas>
    <canvas class="preset" data-sx="0" data-sy="0" width="140" height="140" style="left:calc(270 * var(--u))"></canvas>
    <canvas class="preset" data-sx="0" data-sy="-1" width="140" height="140" style="left:calc(344 * var(--u))"></canvas>
    <canvas class="preset" data-sx="1" data-sy="0" width="140" height="140" style="left:calc(418 * var(--u))"></canvas>
    <button id="spinClose">CLOSE</button>
  </div>

  <!-- منوی ⋮ -->
  <div class="abs" id="menuPop">
    <button id="mSound"></button>
    <a href="help.html#hBilliard" id="mHelp">راهنمای بیلیارد</a>
    <button id="mExit">خروج از بازی</button>
  </div>
</div></div>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/billiard-engine.js"></script>
<script src="static/demo-billiard.js"></script>
<script src="static/tchat.js"></script>
<script src="static/billiard.js"></script>
</body>
</html>

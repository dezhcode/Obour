<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · میز بیلیارد</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* لابی بیلیارد: دو نفره یا چهار نفره یاری، آزاد یا با امتیاز. صف و دعوت در برگه */
.seatline{display:flex;justify-content:center;gap:var(--space-3);flex-wrap:wrap}
.seatw{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:800}
.seatw .avatar{--size:56px}
.wait{width:56px;height:56px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--ink-muted);font-weight:900;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vs{align-self:center;font-size:16px;font-weight:900}
.linkbox{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:left;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.resume{display:grid;gap:4px;justify-items:start}
.resume b{font-size:18px;font-weight:900}
.count{font-size:44px;line-height:52px;font-weight:900;text-align:center;color:var(--acc-deep)}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>میز بیلیارد</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>بیلیارد</h1></div>
    <a class="pill" href="shop.html#wallet" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>…</span></a>
  </div>
</header>
<main class="page no-nav">
  <div class="gp" id="gp"></div>
  <a class="card card-link resume" id="resume" href="billiard.html" hidden><span class="tag tag-live">بازی نیمه‌تمام</span><b>برگرد سر میز</b><span class="muted">بازی‌ات هنوز ادامه دارد؛ بقیه منتظر تواند.</span></a>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/billiard-engine.js"></script>
<script src="static/demo-billiard.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script src="static/gamepage.js"></script>
<script>
(() => {
  const { fa, FD, store, face, icon, sheet, sheetHead, toast, sfx, haptic, sleep, errText } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  let token = null, gp = null;
  const render = () => { if (gp) gp.refresh(); };

  // دو نفره: تو مقابل حریف؛ چهار نفره: تو و یارت مقابل دو حریف
  const one = (p, lab, me) => p ? `<div class="seatw">${face(p, me ? '#F5C451' : 'var(--sky)')}${p.name}<small class="muted" style="font-size:11.5px">${lab}</small></div>` : `<div class="seatw"><span class="wait">؟</span>${lab}</div>`;
  const seatsHtml = (list, n) => n === 4
    ? `<div class="seatline">${one(list[0], 'تو', true)}${one(list[1], 'یار', true)}<b class="vs">مقابل</b>${one(list[2], 'حریف')}${one(list[3], 'حریف')}</div>`
    : `<div class="seatline">${one(list[0], 'تو', true)}<b class="vs">مقابل</b>${one(list[1], 'حریف')}</div>`;
  async function go(mid) {
    token = null; store.set('bmid', mid);
    for (let n = 3; n >= 1; n--) {
      sheet(`<h2 style="text-align:center;font-size:22px;font-weight:900">میز آماده است!</h2><div class="count">${FD(n)}</div><p class="hint">بازی شروع می‌شود…</p>`, { center: true, dismiss: false });
      sfx.tick(); haptic('light'); await sleep(650);
    }
    location.href = 'billiard.html';
  }

  /* ---------- صف ناشناس ---------- */
  async function queueLoop(first) {
    const t = token = {};
    let st = first, shown = '';
    while (token === t) {
      if (st.state === 'matched') { sfx.turn(); haptic('success'); return go(st.match); }
      if (st.state !== 'waiting') { GC.close(); return; }
      const c = st.cfg, n = c.players === 4 ? 4 : 2;
      const list = [{ name: 'شما', av: 7 }, ...[...Array(n - 1)].map((_, i) => i + 1 < st.found ? { name: 'بازیکن', av: 4 + i } : null)];
      const line = `${FD(st.found)} از ${FD(st.need)} نفر · ${FD(st.waited)} ثانیه`;
      if (shown === String(st.found)) { const el = document.getElementById('ql'); if (el) el.textContent = line; }
      else {
        shown = String(st.found);
        const prize = c.mode === 'stake' ? (n === 4 ? `هر نفر از تیم برنده ${fa(c.entry * 2)}` : `برنده ${fa(c.entry * 2)}`) : '';
        const sh = sheet(`${sheetHead(n === 4 ? 'پیدا کردن یار و حریف' : 'پیدا کردن حریف')}${seatsHtml(list, n)}
          <div class="wait-line"><span class="spinner"></span><span id="ql">${line}</span></div>
          <p class="hint">${c.mode === 'stake' ? `ورودی ${fa(c.entry)} · ${prize} امتیاز · فقط با بازیکن واقعی` : st.bots_in != null && st.bots_in > 0 ? `اگر تا ${FD(st.bots_in)} ثانیهٔ دیگر کسی نیاید، جای خالی را ربات پر می‌کند` : 'بازی وقتی شروع می‌شود که میز کامل شود'} · ناشناس می‌مانی</p>
          ${st.can_bots ? '<button class="btn btn-block" id="qb">منتظر نمی‌مانم؛ جای خالی را ربات پر کند</button>' : ''}
          <button class="btn btn-light btn-block" id="qc">انصراف${c.mode === 'stake' ? ' و برگشت ورودی' : ''}</button>`, { dismiss: false });
        const qb = sh.querySelector('#qb');
        if (qb) qb.onclick = async () => { qb.disabled = true; try { const r = await GC.billiard.queueBots(); if (r.state === 'matched') { token = null; sfx.turn(); haptic('success'); return go(r.match); } } catch (e) { toast(errText(e)); } qb.disabled = false; };
        sh.querySelector('#qc').onclick = async () => { token = null; try { await GC.billiard.queueLeave(); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      }
      await sleep(1500); if (token !== t) return;
      try { st = await GC.billiard.queueStatus(); } catch (e) { toast(errText(e)); }
    }
  }

  /* ---------- میز دعوت (اولین مهمان میز چهار نفره یار سازنده می شود) ---------- */
  async function lobbyLoop(mid) {
    const t = token = {};
    let shown = '';
    while (token === t) {
      let v;
      try { v = await GC.billiard.match(mid, 0); } catch (e) { toast(errText(e)); GC.close(); return; }
      if (v.status === 'playing') return go(mid);
      if (v.status === 'cancelled') { GC.close(); toast('سازنده میز را بست؛ ورودی‌ات برگشت'); await GC.refreshMe(); render(); return; }
      const L = v.lobby, c = v.cfg, n = c.players === 4 ? 4 : 2, full = L.seats.length === n, link = L.link;
      const sig = L.seats.map(s => s.color + s.name).join('|');
      if (sig === shown) { await sleep(1500); continue; }
      shown = sig; if (L.seats.length > 1) { sfx.turn(); haptic('light'); }
      const mine = L.seats.find(s => s.me), myTeam = mine ? (+mine.color) % 2 : 0;
      const mate = L.seats.find(s => !s.me && (+s.color) % 2 === myTeam), opp = L.seats.filter(s => (+s.color) % 2 !== myTeam);
      const list = n === 4 ? [Object.assign({}, mine || {}, { name: 'شما' }), mate || null, opp[0] || null, opp[1] || null] : [Object.assign({}, mine || {}, { name: 'شما' }), opp[0] || null];
      const msg = c.mode === 'stake' ? `بیا بیلیارد بازی کنیم! ورودی ${c.entry} امتیاز.` : n === 4 ? 'بیا یار من شو، بیلیارد بازی کنیم!' : 'بیا یه دست بیلیارد بزنیم!';
      const share = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(msg);
      const sh = sheet(`${sheetHead(L.host ? (n === 4 ? 'بازی با یار' : 'بازی با دوست') : 'سر میز دوستت')}
        ${L.host ? `<p>این لینک را بفرست.${n === 4 ? ' اولین کسی که بازش کند یار تو می‌شود و دو نفر بعدی حریف.' : ' تا دوستت بازش کند بازی شروع می‌شود.'}${c.mode === 'stake' ? ' ' + fa(c.entry) + ' امتیاز ورودی از کیف هر نفر کم می‌شود.' : ''}</p>
        <div class="linkbox"><code>${link || 'لینک دعوت فقط داخل تلگرام ساخته می‌شود'}</code><button class="btn btn-sm" id="cp">${icon('copy')}کپی</button></div>
        <button class="btn btn-block" id="shr">${icon('send')}ارسال در تلگرام</button>` : '<p>منتظر بقیه و شروع بازی…</p>'}
        ${seatsHtml(list, n)}
        <div class="wait-line"><span class="spinner"></span>${full ? 'میز پر شد؛ بازی شروع می‌شود…' : `${FD(L.seats.length)} از ${FD(n)} نفر سر میزند…`}</div>
        ${L.host && c.mode === 'free' && !full ? '<button class="btn btn-light btn-block" id="solo">منتظر نمی‌مانم؛ جای خالی با ربات</button>' : ''}
        <button class="btn btn-light btn-block" id="lv">${L.host ? 'بستن میز' : 'بلند شدن از میز'}</button>`, { dismiss: false });
      const cp = sh.querySelector('#cp');
      if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(link).then(() => toast('لینک دعوت کپی شد'), () => toast('کپی نشد؛ لینک را دستی بفرست')); } catch (e) { toast('کپی نشد؛ لینک را دستی بفرست'); } };
      const shr = sh.querySelector('#shr'); if (shr) shr.onclick = () => link ? GC.openLink(share) : toast('لینک فقط داخل تلگرام ساخته می‌شود');
      const solo = sh.querySelector('#solo'); if (solo) solo.onclick = async () => { try { await GC.billiard.start(mid); } catch (e) { toast(errText(e)); } };
      sh.querySelector('#lv').onclick = async () => { token = null; try { await GC.billiard.leave(mid); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      await sleep(1500);
    }
  }

  /* ---------- صفحهٔ بازی ---------- */
  async function play(how, cfg, btn) {
    const c = Object.assign({ game: 'billiard' }, cfg);
    if (how === 'bot') { c.mode = 'free'; c.entry = 0; c.solo = true; }
    if (c.mode === 'stake' && GC.points < c.entry) { sfx.error(); haptic('error'); toast(errText({ code: 'insufficient' })); return; }
    if (btn) btn.disabled = true;
    try {
      if (how === 'invite') { const r = await GC.billiard.invite(c); await GC.refreshMe(); lobbyLoop(r.match); }
      else { const r = await GC.billiard.queueJoin(c); await GC.refreshMe(); queueLoop(r); }
    } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); }
    if (btn) btn.disabled = false; render();
  }
  gp = GCGame.build({
    game: 'billiard', title: 'بیلیارد', help: 'help.html#hBilliard',
    privateSub: 'دو نفره رو در رو، یا چهار نفره با یارت',
    privateFields: [{ key: 'players', label: 'تعداد بازیکن', opts: [[2, '۲ نفره', 'رو در رو'], [4, '۴ نفره', 'یاری · دو تیم']] }],
    privateDefaults: () => Object.assign({ players: 2 }, store.get('blPriv', {})),
    queues: s => [
      { title: 'بازی سریع', sub: 'آزاد · ۲ نفره · ۸ توپ', ic: icon('bolt'), hot: true, how: 'online', cfg: { mode: 'free', entry: 0, players: 2 } },
      { title: 'بازی یاری', sub: 'آزاد · ۴ نفره · دو تیم دونفره', ic: icon('users'), how: 'online', cfg: { mode: 'free', entry: 0, players: 4 } },
      ...(s.stake ? s.entries.map(v => ({ title: `ورودی ${fa(v)}`, sub: `با امتیاز · ۲ نفره · برنده ${fa(v * 2)} می‌برد`, ic: GC.coin(), coin: true, how: 'online', cfg: { mode: 'stake', entry: v, players: 2 } })) : []),
      { title: 'تمرین با ربات', sub: 'همیشه آزاد، بدون انتظار · ۲ نفره', ic: icon('bot'), how: 'bot', cfg: { mode: 'free', entry: 0, players: 2 } },
      { title: 'یاری با ربات‌ها', sub: 'تو و یار رباتت مقابل دو ربات', ic: icon('bot'), how: 'bot', cfg: { mode: 'free', entry: 0, players: 4 } },
    ],
    rules: [['نشانه‌گیری:', 'یک بار روی میز بزن تا نوک چوب همان‌جا را بگیرد؛ با کشیدن انگشت، چوب برعکس جهت کشیدن می‌چرخد و دقیق تنظیم می‌کنی؛ خط سفید مسیر توپ سفید و خط رنگی مسیر توپ هدف است.'],
      ['ضربه:', 'نوار قدرت کنار میز را پایین بکش و رها کن؛ هر چه بیشتر بکشی محکم‌تر می‌زنی.'],
      ['پیچ و تنظیم دقیق:', 'با توپ سفید کنار میز پیچ بده (بالا = جلو رفتن، پایین = برگشتن) و با دکمه‌های تنظیم دقیق، جهت را آرام جابه‌جا کن.'],
      ['بریک و گروه‌ها:', 'اولین توپی که بعد از بریک بیفتد گروه تو را مشخص می‌کند: تک‌رنگ (۱ تا ۷) یا راه‌راه (۹ تا ۱۵).'],
      ['خطا:', 'افتادن سفید، خوردن اول به توپ حریف یا نخوردن به هیچ توپی = حریف «توپ در دست» می‌گیرد و هر جا خواست سفید را می‌گذارد.'],
      ['برد:', 'گروهت را پاک کن و بعد توپ ۸ را بینداز. ۸ زودتر یا همراه خطا = باخت.'],
      ['یاری:', 'در چهار نفره یارت روبه‌رویت است و نوبت یکی در میان بین دو تیم می‌چرخد.']],
    play: (how, cfg, btn) => { if (how === 'invite') store.set('blPriv', { players: cfg.players }); play(how, cfg, btn); },
  });

  (async () => {
    try {
      const me = await GC.refreshMe();
      gp.load(me);
      const url = new URL(location.href);
      const code = (url.searchParams.get('join') || '').trim() || (GC.startParam().startsWith('billiard_') ? GC.startParam().slice(9) : '');
      const OTHER = { ludo: ['منچ', 'ludo.html'], hokm: ['حکم', 'hokm.html'], football: ['فوتبال', 'football.html'], billiard: ['بیلیارد', 'billiard.html'], divar: ['دیوار', 'divar.html'] };
      if (me.active_match && (me.active_game || 'billiard') === 'billiard' && GC.live) {
        const v = await GC.billiard.match(me.active_match, 0).catch(() => null);
        if (v && v.status === 'lobby') lobbyLoop(v.id);
        else if (v && v.status === 'playing') { store.set('bmid', v.id); if (code) { location.replace('billiard.html'); return; } $('resume').hidden = false; }
      } else if (me.active_match && GC.live) { const o = OTHER[me.active_game] || OTHER.ludo; $('resume').hidden = false; $('resume').href = o[1]; $('resume').querySelector('.muted').textContent = `یک بازی ${o[0]} نیمه‌تمام داری؛ اول آن را تمام کن.`; }
      else if (!GC.live && store.get('bmid', null)) {
        const v = await GC.billiard.match(store.get('bmid', null), 0).catch(() => null);
        if (v && v.status === 'playing') $('resume').hidden = false;
      } else if (me.queue) queueLoop(await GC.billiard.queueStatus());
      else if (code) {
        try { const r = await GC.billiard.join(code); await GC.refreshMe(); lobbyLoop(r.match); }
        catch (err) { toast(errText(err)); }
      }
    } catch (e) { toast(errText(e)); }
    render();
  })();
  render();
})();
</script>
</body>
</html>

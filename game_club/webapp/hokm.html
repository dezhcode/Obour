<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · حکم</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/hokm.css">
</head>
<body class="hokm tbl-a cards-a">
<header class="appbar" id="appbar">
  <div class="appbar-cap"><span>حکم</span></div>
  <div class="appbar-in">
    <button class="hk-ib" id="exit" aria-label="خروج از بازی"><i data-ic="exit"></i></button>
    <div class="hk-score" id="score" aria-live="polite"></div>
    <button class="hk-ib" id="snd" aria-pressed="true"></button>
  </div>
</header>
<main class="hk-page">
  <section class="hk-table felt" id="table" aria-label="میز حکم">
    <div class="hk-stack us" id="stackUs" aria-hidden="true"></div>
    <div class="hk-stack them" id="stackThem" aria-hidden="true"></div>
    <div class="hk-seat" data-rel="2"></div>
    <div class="hk-seat" data-rel="3"></div>
    <div class="hk-seat" data-rel="1"></div>
    <div class="hk-center" id="center"><div class="hk-pile" id="pile"></div></div>
    <div class="hk-me" id="meBar"></div>
    <button class="chat-btn hk-chat" id="chatBtn" aria-label="گفتگوی میز"><i data-ic="chat"></i><span class="badge" id="chatBadge" hidden></span></button>
  </section>
  <section class="hk-hand" id="hand" aria-label="برگ‌های تو"></section>
</main>
<div class="hk-fly" id="fly" aria-hidden="true"></div>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/demo-hokm.js"></script>
<script src="static/cards.js"></script>
<script src="static/hokm.js"></script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>AsoTas · دوستان</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<style>
/* دوستان: دو تب «دوستان | درخواست‌ها»؛ آنلاین ها بالا. لمس هر ردیف برگهٔ همان دوست را باز می کند */
.fl-add{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px 0 14px;border-radius:21px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:14px;font-weight:800}
.fl-add svg{width:20px;height:20px}
.fl-search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-muted)}
.fl-search svg{width:20px;height:20px;flex:none}
.fl-search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:14.5px}
.fl-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--ground-deep)}
.fl-tabs button{height:40px;border-radius:12px;color:var(--ink-muted);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.fl-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:900;box-shadow:0 1px 3px rgba(20,25,40,.15)}
.fl-k{font-weight:700;color:var(--ink-muted)}
.fl-n{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#F0465B;color:#fff;font-size:11.5px;line-height:20px;font-weight:900}
.fl-h{margin:2px 4px -4px;font-size:13px;line-height:20px;font-weight:800;color:var(--ink-muted)}
/* شمار کنار عنوان در یک قرص جدا (نقطهٔ «·» کنار رقم فارسی شبیه صفر است: «آنلاین · ۱» مثل ۱۰ خوانده می شد) */
.fl-h i{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-inline-start:2px;border-radius:10px;background:var(--surface-sunk);color:var(--ink);font-style:normal;font-size:11.5px;font-weight:800}
.fl-list{list-style:none;margin:0;padding:0;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.fl-row{display:flex;align-items:center;gap:10px;min-height:68px;padding:0 10px 0 14px;border-bottom:1px solid var(--line)}
.fl-row:last-child{border-bottom:0}
.fl-who{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:start;min-height:56px}
.fl-who .t{min-width:0;display:grid}
.fl-who b{font-size:15px;line-height:22px;font-weight:800;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-who small{font-size:12.5px;line-height:18px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-who small.on{color:var(--success)}.fl-who small.play{color:var(--acc-deep)}
.fl-ib{position:relative;width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.fl-ib svg{width:21px;height:21px}
.fl-ib.gold{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.fl-ib .u{position:absolute;top:-2px;left:-2px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#F0465B;color:#fff;font-size:11px;line-height:18px;font-weight:900;box-shadow:0 0 0 2px var(--surface)}
.fl-acc{height:42px;padding:0 16px;flex:none;border-radius:13px;background:var(--acc);color:var(--acc-ink);font-size:14px;font-weight:800}
.fl-lite{height:40px;padding:0 14px;flex:none;border-radius:13px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:13px;font-weight:800}
.fl-empty{display:grid;justify-items:center;gap:8px;padding:32px 16px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line);text-align:center}
.fl-empty .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--acc-tint);color:var(--acc)}
.fl-empty .ic svg{width:30px;height:30px}
.fl-empty b{font-size:16px;font-weight:900}
.fl-empty small{font-size:13px;line-height:21px;color:var(--ink-muted)}
.fl-empty .btn{margin-top:6px}

/* ---------- Arcade Lounge: حلقهٔ استوری آنلاین ها، پاکت درخواست با مهر موم، دکمهٔ براق دعوت و بلیت یوزرنیم ---------- */
.fl-list,.fl-empty{box-shadow:var(--depth-sm);border-radius:22px}
.fl-search,.fl-add{box-shadow:var(--depth-sm)}
.fl-ib.gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.35)}
.fl-acc{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18)}
.fl-st{display:flex;gap:14px;overflow-x:auto;margin:0 calc(var(--space-4) * -1);padding:4px var(--space-4) 2px;scrollbar-width:none}
.fl-st::-webkit-scrollbar{display:none}
.fl-st button{flex:none;width:66px;display:grid;justify-items:center;gap:6px;color:var(--ink)}
.fl-st .rg{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,#F5C451,#FF7AB6,#8E7CF8,#7CF29A,#F5C451)}
.fl-st .rg .avatar{--size:56px;--ring:var(--ground)}
.fl-st .rg .gb{position:absolute;bottom:-4px;left:-4px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--ground)}
.fl-st .rg .gb svg{width:80%;height:80%}
.fl-st b{max-width:100%;font-size:11.5px;line-height:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-env{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;text-align:start;color:#4A3200;background:linear-gradient(160deg,#FFF4D6,#F8E2AE);box-shadow:var(--depth-sm);overflow:hidden}
.fl-env::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 49.5%,rgba(160,110,20,.18) 50%,transparent 51%),linear-gradient(25deg,transparent 49.5%,rgba(160,110,20,.18) 50%,transparent 51%);background-size:100% 120%;background-position:0 100%;pointer-events:none}
.fl-env .seal{position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F06A6A,#B3242E 70%);color:#FFE3E3;box-shadow:0 0 0 4px rgba(179,36,46,.25),0 6px 10px -4px rgba(120,10,20,.6);font-family:var(--font-rokh);font-size:18px;font-weight:900}
.fl-env .t{position:relative;flex:1;min-width:0;display:grid}
.fl-env b{font-size:15px;line-height:22px;font-weight:900}
.fl-env small{font-size:12.5px;line-height:18px;opacity:.8}
.fl-env>svg{position:relative;flex:none;width:20px;height:20px}
.fl-tk{position:relative;display:flex;align-items:center;gap:12px;margin-top:6px;padding:14px 16px;border-radius:18px;background:var(--ink);color:var(--ground);
  -webkit-mask:radial-gradient(circle 9px at 0 50%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 9px at 0 50%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 97%,#000) right/51% 100% no-repeat}
.fl-tk .t{flex:1;min-width:0;display:grid;padding-inline-end:12px;border-inline-end:2px dashed color-mix(in srgb,var(--ground) 30%,transparent)}
.fl-tk small{font-size:12px;line-height:18px;opacity:.7}
.fl-tk b{font-size:18px;line-height:26px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-tk button{flex:none;height:40px;padding:0 14px;border-radius:20px;background:#F5C451;color:#3A2A00;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.16)}
.fl-tk button svg{width:16px;height:16px}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>دوستان</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>دوستان</h1></div>
    <button class="fl-add" id="flAdd"><i data-ic="userAdd"></i>افزودن</button>
  </div>
</header>
<main class="page">
  <span class="tag tag-sample" id="flSample" hidden style="justify-self:start">اینا نمونه‌ان</span>
  <label class="fl-search"><i data-ic="search"></i><span class="sr">بین رفیقات بگرد</span><input id="flQ" placeholder="بین رفیقات بگرد" autocomplete="off" autocapitalize="off"></label>
  <div class="fl-tabs" role="tablist" id="flTabs"></div>
  <div class="stack" id="flBody" style="gap:12px"><div class="gp-skel"></div><div class="gp-skel"></div><div class="gp-skel"></div></div>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/social.js"></script>
<script>
(() => {
  const { FD, icon, toast, errText, mount, sfx, haptic } = GC;
  const SO = GCSocial, esc = SO.esc;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  let tab = 'friends', data = null, q = '', me = null;

  const row = f => { const st = SO.status(f); return `<li class="fl-row">
      <button class="fl-who" data-who="${esc(f.uid)}">${SO.av(f)}<span class="t"><b class="uname">${esc(f.name)}</b><small class="${st.cls}">${st.text}</small></span></button>
      <a class="fl-ib" href="chat.html?u=${encodeURIComponent(f.uid)}" aria-label="پیام به ${esc(f.name)}">${icon('chat')}${f.unread ? `<span class="u">${FD(Math.min(f.unread, 9))}</span>` : ''}</a>
      <button class="fl-ib gold" data-inv="${esc(f.uid)}" aria-label="دعوت ${esc(f.name)} به بازی">${icon('pad')}</button></li>`; };
  const reqRow = (f, kind) => `<li class="fl-row"><button class="fl-who" data-find="${esc(f.name)}">${GC.face(f)}<span class="t"><b class="uname">${esc(f.name)}</b><small>${kind === 'in' ? 'می‌خواد رفیقت بشه' : kind === 'out' ? 'منتظر جوابه' : 'بلاکش کردی'}</small></span></button>
      ${kind === 'in' ? `<button class="fl-ib" data-drop="${esc(f.uid)}" aria-label="رد درخواست ${esc(f.name)}">${icon('close')}</button><button class="fl-acc" data-acc="${esc(f.uid)}">قبول</button>`
        : kind === 'out' ? `<button class="fl-lite" data-drop="${esc(f.uid)}">لغو</button>` : `<button class="fl-lite" data-unblock="${esc(f.uid)}">رفع بلاک</button>`}</li>`;
  const empty = (ic, t, s, btn) => `<div class="fl-empty"><span class="ic">${icon(ic)}</span><b>${t}</b><small>${s}</small>${btn || ''}</div>`;

  function render() {
    const nIn = data ? data.incoming.length : 0;
    $('flTabs').innerHTML = `<button role="tab" data-t="friends" aria-selected="${tab === 'friends'}">دوستان${data ? `<span class="fl-k">${FD(data.friends.length)}</span>` : ''}</button>
      <button role="tab" data-t="req" aria-selected="${tab === 'req'}">درخواست‌ها${nIn ? `<span class="fl-n">${FD(nIn)}</span>` : ''}</button>`;
    $('flQ').closest('.fl-search').hidden = tab !== 'friends';
    if (!data) return;
    let html = '';
    if (tab === 'friends') {
      if (nIn) html += `<button class="fl-env" data-req><span class="seal">${FD(nIn)}</span><span class="t"><b>${nIn > 1 ? `${FD(nIn)} نفر می‌خوان رفیقت بشن` : 'یکی می‌خواد رفیقت بشه'}</b><small>بازش کن و جواب بده</small></span>${icon('fwd')}</button>`;
      const list = data.friends.filter(f => !q || f.name.includes(q));
      const on = list.filter(f => f.online), off = list.filter(f => !f.online);
      if (!data.friends.length) html = empty('users', 'هنوز رفیقی نداری داش', 'رفیقاتو با یوزرنیمشون پیدا کن و با هم بازی کنید', `<button class="btn" data-add>${icon('userAdd')}افزودن دوست</button>`);
      else if (!list.length) html = empty('search', 'پیدا نشد', 'بین رفیقات کسی با این اسم نیست');
      else {
        // حلقهٔ استوری: رفیقای آنلاین، با نشان بازی ای که الان توشن
        if (on.length && !q) html += `<div class="fl-st" aria-label="آنلاین‌ها">${on.map(f => { const g = f.playing && GC.GAMES.find(x => x.id === f.playing);
          return `<button data-who="${esc(f.uid)}"><span class="rg">${GC.face(f)}${g ? `<span class="gb ${g.tint}">${GC.GAME_ART[g.id]()}</span>` : ''}</span><b class="uname">${esc(f.name)}</b></button>`; }).join('')}</div>`;
        if (on.length) html += `<h2 class="fl-h">آنلاین <i>${FD(on.length)}</i></h2><ul class="fl-list">${on.map(row).join('')}</ul>`;
        if (off.length) html += `<h2 class="fl-h">آفلاین <i>${FD(off.length)}</i></h2><ul class="fl-list">${off.map(row).join('')}</ul>`;
      }
    } else {
      if (data.incoming.length) html += `<h2 class="fl-h">درخواست‌های تازه <i>${FD(data.incoming.length)}</i></h2><ul class="fl-list">${data.incoming.map(f => reqRow(f, 'in')).join('')}</ul>`;
      if (data.outgoing.length) html += `<h2 class="fl-h">فرستادی</h2><ul class="fl-list">${data.outgoing.map(f => reqRow(f, 'out')).join('')}</ul>`;
      if (data.blocked.length) html += `<h2 class="fl-h">بلاک شده‌ها</h2><ul class="fl-list">${data.blocked.map(f => reqRow(f, 'blk')).join('')}</ul>`;
      if (!html) html = empty('userAdd', 'درخواستی نداری', 'هر کی بخواد رفیقت بشه اینجا می‌بینیش');
    }
    if (tab === 'friends' && me) html += `<div class="fl-tk"><span class="t"><small>یوزرنیم تو، بده رفیقات اضافه‌ت کنن</small><b class="uname">${esc(me.player.name || '')}</b></span><button data-copy>${icon('copy')}کپی</button></div>`;
    $('flBody').innerHTML = html;
    mount($('flBody'));
  }
  async function load() {
    try {
      const [m, d] = await Promise.all([GC.refreshMe(), GC.data.friends()]);
      me = m; data = d; $('flSample').hidden = !d.sample;
      GC.setNavBadge({ requests: d.incoming.length, unread: d.friends.reduce((a, f) => a + (f.unread || 0), 0) });
    } catch (e) { toast(errText(e)); data = data || { friends: [], incoming: [], outgoing: [], blocked: [] }; }
    render();
  }
  const find = uid => data && [...data.friends, ...data.incoming, ...data.outgoing, ...data.blocked].find(f => f.uid === uid);
  $('flTabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b && b.dataset.t !== tab) { tab = b.dataset.t; sfx.tap(); render(); } };
  $('flQ').oninput = () => { q = GC.normName($('flQ').value); render(); };
  const add = () => SO.addSheet(me && me.player.name, load);
  $('flAdd').onclick = add;
  $('flBody').onclick = async e => {
    if (e.target.closest('[data-add]')) { add(); return; }
    if (e.target.closest('[data-req]')) { tab = 'req'; sfx.tap(); render(); return; }
    if (e.target.closest('[data-copy]')) { try { await navigator.clipboard.writeText(me.player.name); toast('یوزرنیمت کپی شد'); } catch (err) { toast(me.player.name); } return; }
    const w = e.target.closest('[data-who]'); if (w) { const f = find(w.dataset.who); if (f) SO.friendSheet(f, load); return; }
    const inv = e.target.closest('[data-inv]'); if (inv) { const f = find(inv.dataset.inv); if (f) SO.invite(f, load); return; }
    const fnd = e.target.closest('[data-find]'); if (fnd) { SO.addSheet(me && me.player.name, load); return; }
    const b = e.target.closest('[data-acc],[data-drop],[data-unblock]'); if (!b) return;
    b.disabled = true;
    try {
      if (b.dataset.acc) { await GC.data.friendAccept(b.dataset.acc); sfx.turn(); haptic('success'); toast('دمت گرم حالا رفیقید 🤝'); }
      else if (b.dataset.drop) await GC.data.friendDrop(b.dataset.drop);
      else await GC.data.friendBlock(b.dataset.unblock, false);
      await load();
    } catch (err) { toast(errText(err)); b.disabled = false; }
  };
  render();
  GC.page(load);
  GC.nav('friends'); mount();
})();
</script>
</body>
</html>

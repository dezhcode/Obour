<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>AsoTas · میز فوتبال</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* لابی فوتبال: نوع بازی، ورودی، طول بازی، خلاصه و سه راه شروع. صف و دعوت در برگه */
.seatline{display:flex;justify-content:center;gap:var(--space-4)}
.seatw{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:800}
.seatw .avatar{--size:60px}
.wait{width:60px;height:60px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--ink-muted);font-weight:900;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbox{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:left;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.resume{display:grid;gap:4px;justify-items:start}
.resume b{font-size:18px;font-weight:900}
.count{font-size:44px;line-height:52px;font-weight:900;text-align:center;color:var(--acc-deep)}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>میز فوتبال</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>فوتبال</h1></div>
    <a class="pill" href="shop.html#daily" aria-label="کیف سکه"><span data-coin></span><span class="num" data-bal>…</span></a>
  </div>
</header>
<main class="page no-nav">
  <div class="gp" id="gp"></div>
  <a class="card card-link resume" id="resume" href="football.html" hidden><span class="tag tag-live">بازی نیمه‌کاره</span><b>برگرد به زمین</b><span class="muted">بازیت هنوز تموم نشده و حریفت منتظرته</span></a>

</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/football-physics.js"></script>
<script src="static/demo-football.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script src="static/gamepage.js"></script>
<script>
(() => {
  const { S, save, fa, FD, store, amount, face, icon, sheet, sheetHead, toast, sfx, haptic, sleep, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  let token = null, gp = null;
  const render = () => { if (gp) gp.refresh(); };

  // دو صندلی: تو و حریف
  const seatsHtml = list => `<div class="seatline">${list.map((p, i) => p ? `<div class="seatw">${face(p, i === 0 ? '#F5C451' : 'var(--sky)')}${GC.uname(p.name)}<small class="muted" style="font-size:11.5px">${i === 0 ? 'تو' : 'حریف'}</small></div>` : `<div class="seatw"><span class="wait">؟</span>حریف</div>`).join('<b style="align-self:center;font-size:18px">مقابل</b>')}</div>`;
  async function go(mid) {
    token = null; store.set('fmid', mid);
    for (let n = 3; n >= 1; n--) {
      sheet(`<h2 style="text-align:center;font-size:22px;font-weight:900">میز حاضره!</h2><div class="count">${FD(n)}</div><p class="hint">الان بازی شروع می‌شه…</p>`, { center: true, dismiss: false });
      sfx.tick(); haptic('light'); await sleep(650);
    }
    location.href = 'football.html';
  }

  /* ---------- صف ناشناس ---------- */
  async function queueLoop(first) {
    const t = token = {};
    let st = first, shown = '';
    while (token === t) {
      if (st.state === 'matched') { sfx.turn(); haptic('success'); return go(st.match); }
      if (st.state !== 'waiting') { GC.close(); return; }
      const c = st.cfg, list = [{ name: 'خودت', av: 7 }, st.found > 1 ? { name: 'بازیکن', av: 4 } : null];
      const line = `${FD(st.found)} از ${FD(st.need)} نفر · ${FD(st.waited)} ثانیه`;
      if (shown === String(st.found)) { const el = document.getElementById('ql'); if (el) el.textContent = line; }
      else {
      shown = String(st.found);
      const sh = sheet(`${sheetHead('پیدا کردن حریف')}${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span><span id="ql">${line}</span></div>
        <p class="hint">${c.mode !== 'free' ? 'رتبه‌ای 🏆 · فقط با بازیکن واقعی · برد یعنی جام و سکه' : st.bots_in != null && st.bots_in > 0 ? `اگه تا ${FD(st.bots_in)} ثانیهٔ دیگه کسی نیاد ربات جای خالیو پر می‌کنه` : 'میز که پر شه بازی شروع می‌شه'} · ناشناس می‌مونی</p>
        ${st.can_bots ? '<button class="btn btn-block" id="qb">منتظر نمی‌مونم بذار ربات جای خالیو پر کنه</button>' : ''}
        <button class="btn btn-light btn-block" id="qc">بی‌خیال</button>`, { dismiss: false });
      const qb = sh.querySelector('#qb');
      if (qb) qb.onclick = async () => { qb.disabled = true; try { const r = await GC.football.queueBots(); if (r.state === 'matched') { token = null; sfx.turn(); haptic('success'); return go(r.match); } } catch (e) { toast(errText(e)); } qb.disabled = false; };
      sh.querySelector('#qc').onclick = async () => { token = null; try { await GC.football.queueLeave(); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      }
      await sleep(1500); if (token !== t) return;
      try { st = await GC.football.queueStatus(); } catch (e) { toast(errText(e)); }
    }
  }

  /* ---------- میز دعوت ---------- */
  async function lobbyLoop(mid) {
    const t = token = {};
    let shown = '';
    while (token === t) {
      let v;
      try { v = await GC.football.match(mid, 0); } catch (e) { toast(errText(e)); GC.close(); return; }
      if (v.status === 'playing') return go(mid);
      if (v.status === 'cancelled') { GC.close(); toast('سازنده میزو بست و ورودیت برگشت'); await GC.refreshMe(); render(); return; }
      const L = v.lobby, c = v.cfg, full = L.seats.length === 2, link = L.link;
      const sig = L.seats.map(s => s.color + s.name).join('|');
      if (sig === shown) { await sleep(1500); continue; }
      shown = sig; if (L.seats.length > 1) { sfx.turn(); haptic('light'); }
      const me0 = L.seats.find(s => s.me), other = L.seats.find(s => !s.me);
      const list = [Object.assign({}, me0 || {}, { name: 'خودت' }), other || null];
      const share = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('بیا یه دست فوتبال بزنیم!');
      const sh = sheet(`${sheetHead(L.host ? 'بازی با رفیقت' : 'سر میز رفیقت')}
        ${L.host ? `<p>این لینکو واسه رفیقت بفرست تا بازش کنه بازی شروع می‌شه</p>
        <div class="linkbox"><code>${link || 'لینک دعوت فقط تو تلگرام ساخته می‌شه'}</code><button class="btn btn-sm" id="cp">${icon('copy')}کپی</button></div>
        <button class="btn btn-block" id="shr">${icon('send')}بفرست تو تلگرام</button>` : '<p>منتظر بقیه‌ایم تا سازندهٔ میز بازیو شروع کنه…</p>'}
        ${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span>${L.seats.length > 1 ? 'رفیقت اومد الان بازی شروع می‌شه…' : 'منتظر رفیقتیم…'}</div>
        ${L.host && c.mode === 'free' && !full ? '<button class="btn btn-light btn-block" id="solo">منتظر نمی‌مونم با ربات بازی می‌کنم</button>' : ''}
        <button class="btn btn-light btn-block" id="lv">${L.host ? 'بستن میز' : 'بلند شدن از میز'}</button>`, { dismiss: false });
      const cp = sh.querySelector('#cp');
      if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(link).then(() => toast('لینک دعوت کپی شد'), () => toast('کپی نشد لینکو دستی بفرست')); } catch (e) { toast('کپی نشد لینکو دستی بفرست'); } };
      const shr = sh.querySelector('#shr'); if (shr) shr.onclick = () => link ? GC.openLink(share) : toast('لینک فقط تو تلگرام ساخته می‌شه');
      const solo = sh.querySelector('#solo'); if (solo) solo.onclick = async () => { try { await GC.football.start(mid); } catch (e) { toast(errText(e)); } };
      sh.querySelector('#lv').onclick = async () => { token = null; try { await GC.football.leave(mid); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      await sleep(1500);
    }
  }

  /* ---------- صفحهٔ بازی: صف های آماده، میز خصوصی، رده بندی و آموزش ---------- */
  async function play(how, cfg, btn) {
    const c = Object.assign({ game: 'football' }, cfg);
    if (how === 'bot') { c.mode = 'free'; c.entry = 0; c.solo = true; }
    if (btn) btn.disabled = true;
    try {
      if (how === 'invite') { const r = await GC.football.invite(c); await GC.refreshMe(); lobbyLoop(r.match); }
      else { const r = await GC.football.queueJoin(c); await GC.refreshMe(); queueLoop(r); }
    } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); }
    if (btn) btn.disabled = false; render();
  }
  gp = GCGame.build({
    game: 'football', title: 'فوتبال', help: 'help.html#hFootball',
    privateSub: 'لینک بفرست و رو در رو بازی کنین',
    modes: [
      { v: 'f3', label: 'تا ۳ گل', ic: icon('bolt'), desc: 'رو در رو و هر کی زودتر ۳ گل بزنه برده', short: '۲ نفره · سریع', cfg: { target: 3, passes: 0 } },
      { v: 'f5', label: 'تا ۵ گل', ic: icon('ball'), desc: 'بازی کامل رو در رو تا ۵ گل', short: '۲ نفره · کامل', cfg: { target: 5, passes: 0 } },
      { v: 'f2', label: 'تا ۲ گل', ic: icon('clock'), desc: 'خیلی سریع و دو گل بزنی بردی', short: '۲ نفره · خیلی سریع', cfg: { target: 2, passes: 0 } },
    ],
    extras: [{ key: 'passes', label: 'پاس‌ها', opts: [[0, 'بدون محدودیت', 'مثل پلاتو'], [3, '۳ پاس', 'پشت سر هم'], [6, '۶ پاس', 'پشت سر هم']] }],
    rules: [['اول بازی', 'تیمتو انتخاب کن و یه چیدمان برای حمله و یکی برای دفاع بچین و دروازهٔ خودت همیشه پایین صفحه‌ست'],
      ['بکش عقب و ول کن', 'مهره رو بگیر و انگشتتو خلاف جهت هدف بکش عقب<br>فلش جهت شوتو نشون می‌ده و هر چی بیشتر بکشی (تا ۲۵۰ واحد) محکم‌تر می‌زنی<br>اگه رو خود مهره ول کنی شوت کنسل می‌شه'],
      ['هر نوبت یه شوت', 'فقط یه مهره رو می‌زنی و مهره‌ها و توپ به هم و به دیواره می‌خورن و وزن هر مهره فرق داره (دروازه‌بان سنگین‌تره)'],
      ['پاس', 'اگه یکی از مهره‌هات توپو بزنه و توپ برسه به یه مهرهٔ دیگه‌ت و تا ۲۳۶ واحد کنارش بمونه پاس کامله<br>توپ می‌چسبه به گیرنده و گیرنده پشت توپ رو به دروازه وایمیسه و دوباره نوبت خودته<br>با هر پاس ۳ ثانیه از وقت نوبت کم می‌شه (تا ۸ ثانیه)'],
      ['بی پاس', 'توپو از دست می‌دی و نوبت حریفه<br>گل مستقیم از ضربهٔ شروع خطاست و حساب نمی‌شه'],
      ['اولین کسی', 'که به ۲ یا ۳ یا ۵ گل برسه برده']],
    play,
  });

  (async () => {
    try {
      const me = await GC.refreshMe();
      gp.load(me);
      const url = new URL(location.href);
      const code = (url.searchParams.get('join') || '').trim() || (GC.startParam().startsWith('football_') ? GC.startParam().slice(9) : '');
      const OTHER = { ludo: ['منچ', 'ludo.html'], hokm: ['حکم', 'hokm.html'], football: ['فوتبال', 'football.html'], billiard: ['بیلیارد', 'billiard.html'], divar: ['دیوار', 'divar.html'], snakes: ['مار و پله', 'snakes.html'] };
      if (me.active_match && (me.active_game || 'football') === 'football' && GC.live) {
        const v = await GC.football.match(me.active_match, 0).catch(() => null);
        if (v && v.status === 'lobby') lobbyLoop(v.id);
        else if (v && v.status === 'playing') { store.set('fmid', v.id); if (code) { location.replace('football.html'); return; } $('resume').hidden = false; }
      } else if (me.active_match && GC.live) { const o = OTHER[me.active_game] || OTHER.ludo; $('resume').hidden = false; $('resume').href = o[1]; $('resume').querySelector('.muted').textContent = `یه بازی ${o[0]} نیمه‌کاره داری اول اونو تموم کن`; }
      else if (!GC.live && store.get('fmid', null)) {
        const v = await GC.football.match(store.get('fmid', null), 0).catch(() => null);
        if (v && v.status === 'playing') $('resume').hidden = false;
      } else if (me.queue) queueLoop(await GC.football.queueStatus());
      else if (code) {
        try { const r = await GC.football.join(code); await GC.refreshMe(); lobbyLoop(r.match); }
        catch (err) { toast(errText(err)); }
      }
    } catch (e) { toast(errText(e)); }
    render();
  })();
  render();
})();
</script>
</body>
</html>

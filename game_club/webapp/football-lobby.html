<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · میز فوتبال</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<style>
/* لابی فوتبال: نوع بازی، ورودی، طول بازی، خلاصه و سه راه شروع. صف و دعوت در برگه */
.q{display:grid;gap:var(--space-2)}
.q-h{display:flex;align-items:center;gap:var(--space-2);font-weight:900}
.q-h i{width:24px;height:24px;border-radius:50%;background:var(--sky);color:var(--on-fill);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.sum{background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3)}
.sum span{display:block;font-size:12px;color:var(--ink-muted)}
.sum b{font-weight:900}
.go{display:grid;gap:var(--space-2)}
.go small{display:block;font-size:12px;line-height:16px;font-weight:600;opacity:.85}
.go .btn{flex-direction:row;justify-content:flex-start;text-align:start;min-height:64px}
.go .btn>span{display:grid}
.seatline{display:flex;justify-content:center;gap:var(--space-4)}
.seatw{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:800}
.seatw .avatar{--size:60px}
.wait{width:60px;height:60px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--ink-muted);font-weight:900;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbox{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:left;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.resume{display:grid;gap:4px;justify-items:start}
.resume b{font-size:18px;font-weight:900}
.count{font-size:44px;line-height:52px;font-weight:900;text-align:center;color:var(--sky-deep)}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>میز فوتبال</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>فوتبال</h1></div>
    <div class="top-l">
      <a class="icon-btn" href="help.html#football" aria-label="راهنمای فوتبال"><i data-ic="help"></i></a>
      <a class="pill" href="wallet.html" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>…</span></a>
    </div>
  </div>
</header>
<main class="page no-nav">
  <a class="card card-link resume" id="resume" href="football.html" hidden><span class="tag tag-live">بازی نیمه‌تمام</span><b>برگرد به زمین</b><span class="muted">بازی‌ات هنوز ادامه دارد؛ حریفت منتظر توست.</span></a>

  <section class="card stack" aria-label="تنظیم بازی">
    <div class="q"><div class="q-h"><i>۱</i>نوع بازی</div>
      <div class="choice-row" id="mode">
        <button class="choice" data-v="free"><b>آزاد</b><span>بدون امتیاز و جایزه</span></button>
        <button class="choice" data-v="stake"><b>با امتیاز</b><span>برنده همهٔ ورودی‌ها را می‌برد</span></button>
      </div></div>
    <div class="q" id="entryQ"><div class="q-h"><i>۲</i>ورودی هر نفر</div><div class="chips" id="entry"></div></div>
    <div class="q"><div class="q-h"><i id="nP">۳</i>طول بازی</div>
      <div class="seg" id="target"><button data-v="3">۳ گل<small>سریع · حدود ۵ دقیقه</small></button><button data-v="5">۵ گل<small>کامل · حدود ۱۰ دقیقه</small></button></div></div>
    <p class="hint" style="text-align:start">دو نفره، هر کدام شش مهره. نوبتی مهره‌ات را بکش و رها کن تا شوت بزنی؛ اولین کسی که به تعداد گل برسد می‌برد.</p>
  </section>

  <section class="card stack" aria-label="شروع">
    <div class="summary" id="summary"></div>
    <div class="go">
      <button class="btn" data-how="online"><i data-ic="users"></i><span>بازی با ناشناس<small>یک حریف واقعی پیدا می‌کنیم</small></span></button>
      <button class="btn btn-gold" data-how="invite"><i data-ic="link"></i><span>بازی با دوست<small>لینک بفرست، رو در رو بازی کنید</small></span></button>
      <button class="btn btn-light" data-how="bot"><i data-ic="bot"></i><span>تمرین با ربات<small>همیشه آزاد و بدون امتیاز</small></span></button>
    </div>
    <p class="hint" id="bal"></p>
  </section>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/football-physics.js"></script>
<script src="static/demo-football.js"></script>
<script>
(() => {
  const { S, save, fa, FD, store, amount, face, icon, sheet, sheetHead, toast, sfx, haptic, sleep, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  const cfg = Object.assign({ entry: 100, target: 3 }, store.get('fbCfg', {}));
  let settings = { stake: true, entries: [50, 100, 250, 500] }, token = null;

  function render() {
    if (!settings.stake) S.mode = 'free';
    const stake = S.mode === 'stake';
    if (!settings.entries.includes(cfg.entry)) cfg.entry = settings.entries[0];
    $('mode').querySelectorAll('[data-v]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.v === S.mode)); if (b.dataset.v === 'stake') b.disabled = !settings.stake; });
    $('entryQ').hidden = !stake;
    $('nP').textContent = stake ? '۳' : '۲';
    $('entry').innerHTML = settings.entries.map(v => `<button class="chip" data-v="${v}" aria-pressed="${cfg.entry === v}"${GC.points < v ? ' disabled' : ''}>${GC.coin()}${fa(v)}</button>`).join('');
    $('target').querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === cfg.target)));
    $('summary').innerHTML = stake
      ? `<div class="sum"><span>ورودی تو</span>${amount(cfg.entry)}</div><div class="sum" style="background:var(--coin-tint)"><span>جایزهٔ برنده</span>${amount(cfg.entry * 2)}</div>`
      : `<div class="sum"><span>نوع</span><b>آزاد، بدون جایزه</b></div><div class="sum"><span>بازی</span><b>دو نفره، تا ${FD(cfg.target)} گل</b></div>`;
    $('bal').textContent = 'موجودی تو: ' + fa(GC.points) + ' امتیاز';
    store.set('fbCfg', cfg); save(); mount();
  }
  $('mode').onclick = e => { const b = e.target.closest('[data-v]'); if (b && !b.disabled) { S.mode = b.dataset.v; render(); } };
  $('entry').onclick = e => { const b = e.target.closest('[data-v]'); if (b && !b.disabled) { cfg.entry = +b.dataset.v; render(); } };
  $('target').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { cfg.target = +b.dataset.v; render(); } };

  // دو صندلی: تو و حریف
  const seatsHtml = list => `<div class="seatline">${list.map((p, i) => p ? `<div class="seatw">${face(p, i === 0 ? '#F5C451' : 'var(--sky)')}${p.name}<small class="muted" style="font-size:11px">${i === 0 ? 'تو' : 'حریف'}</small></div>` : `<div class="seatw"><span class="wait">؟</span>حریف</div>`).join('<b style="align-self:center;font-size:18px">مقابل</b>')}</div>`;
  const reqCfg = () => ({ game: 'football', mode: S.mode, entry: S.mode === 'stake' ? cfg.entry : 0, target: cfg.target });
  async function go(mid) {
    token = null; store.set('fmid', mid);
    for (let n = 3; n >= 1; n--) {
      sheet(`<h2 style="text-align:center;font-size:22px;font-weight:900">میز آماده است!</h2><div class="count">${FD(n)}</div><p class="hint">بازی شروع می‌شود…</p>`, { center: true, dismiss: false });
      sfx.tick(); haptic('light'); await sleep(650);
    }
    location.href = 'football.html';
  }

  /* ---------- صف ناشناس ---------- */
  async function queueLoop(first) {
    const t = token = {};
    let st = first, shown = '';
    while (token === t) {
      if (st.state === 'matched') { sfx.turn(); haptic('success'); return go(st.match); }
      if (st.state !== 'waiting') { GC.close(); return; }
      const c = st.cfg, list = [{ name: 'شما', av: 7 }, st.found > 1 ? { name: 'بازیکن', av: 4 } : null];
      const line = `${FD(st.found)} از ${FD(st.need)} نفر · ${FD(st.waited)} ثانیه`;
      if (shown === String(st.found)) { const el = document.getElementById('ql'); if (el) el.textContent = line; }
      else {
      shown = String(st.found);
      const sh = sheet(`${sheetHead('پیدا کردن حریف')}${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span><span id="ql">${line}</span></div>
        <p class="hint">${c.mode === 'stake' ? `ورودی ${fa(c.entry)} · جایزهٔ برنده ${fa(c.entry * 2)} امتیاز · فقط با بازیکن واقعی` : st.bots_in != null && st.bots_in > 0 ? `اگر تا ${FD(st.bots_in)} ثانیهٔ دیگر کسی نیاید، جای خالی را ربات پر می‌کند` : 'بازی وقتی شروع می‌شود که میز کامل شود'} · ناشناس می‌مانی</p>
        ${st.can_bots ? '<button class="btn btn-block" id="qb">منتظر نمی‌مانم؛ جای خالی را ربات پر کند</button>' : ''}
        <button class="btn btn-light btn-block" id="qc">انصراف${c.mode === 'stake' ? ' و برگشت ورودی' : ''}</button>`, { dismiss: false });
      const qb = sh.querySelector('#qb');
      if (qb) qb.onclick = async () => { qb.disabled = true; try { const r = await GC.football.queueBots(); if (r.state === 'matched') { token = null; sfx.turn(); haptic('success'); return go(r.match); } } catch (e) { toast(errText(e)); } qb.disabled = false; };
      sh.querySelector('#qc').onclick = async () => { token = null; try { await GC.football.queueLeave(); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      }
      await sleep(1500); if (token !== t) return;
      try { st = await GC.football.queueStatus(); } catch (e) { toast(errText(e)); }
    }
  }

  /* ---------- میز دعوت ---------- */
  async function lobbyLoop(mid) {
    const t = token = {};
    let shown = '';
    while (token === t) {
      let v;
      try { v = await GC.football.match(mid, 0); } catch (e) { toast(errText(e)); GC.close(); return; }
      if (v.status === 'playing') return go(mid);
      if (v.status === 'cancelled') { GC.close(); toast('سازنده میز را بست؛ ورودی‌ات برگشت'); await GC.refreshMe(); render(); return; }
      const L = v.lobby, c = v.cfg, full = L.seats.length === 2, link = L.link;
      const sig = L.seats.map(s => s.color + s.name).join('|');
      if (sig === shown) { await sleep(1500); continue; }
      shown = sig; if (L.seats.length > 1) { sfx.turn(); haptic('light'); }
      const me0 = L.seats.find(s => s.me), other = L.seats.find(s => !s.me);
      const list = [Object.assign({}, me0 || {}, { name: 'شما' }), other || null];
      const share = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(c.mode === 'stake' ? `بیا فوتبال بازی کنیم! ورودی ${c.entry} امتیاز، برنده همه را می‌برد.` : 'بیا یک دست فوتبال بازی کنیم!');
      const sh = sheet(`${sheetHead(L.host ? 'بازی با دوست' : 'سر میز دوستت')}
        ${L.host ? `<p>این لینک را برای دوستت بفرست. تا بازش کند بازی شروع می‌شود${c.mode === 'stake' ? ' و ' + fa(c.entry) + ' امتیاز ورودی از کیف خودش کم می‌شود' : ''}.</p>
        <div class="linkbox"><code>${link || 'لینک دعوت فقط داخل تلگرام ساخته می‌شود'}</code><button class="btn btn-sm" id="cp">${icon('copy')}کپی</button></div>
        <button class="btn btn-block" id="shr">${icon('send')}ارسال در تلگرام</button>` : '<p>منتظر بقیه و شروع بازی توسط سازندهٔ میز…</p>'}
        ${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span>${L.seats.length > 1 ? 'دوستت آمد؛ بازی شروع می‌شود…' : 'منتظر دوستت…'}</div>
        ${L.host && c.mode === 'free' && !full ? '<button class="btn btn-light btn-block" id="solo">منتظر نمی‌مانم؛ با ربات بازی کنم</button>' : ''}
        <button class="btn btn-light btn-block" id="lv">${L.host ? 'بستن میز' : 'بلند شدن از میز'}</button>`, { dismiss: false });
      const cp = sh.querySelector('#cp');
      if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(link).then(() => toast('لینک دعوت کپی شد'), () => toast('کپی نشد؛ لینک را دستی بفرست')); } catch (e) { toast('کپی نشد؛ لینک را دستی بفرست'); } };
      const shr = sh.querySelector('#shr'); if (shr) shr.onclick = () => link ? GC.openLink(share) : toast('لینک فقط داخل تلگرام ساخته می‌شود');
      const solo = sh.querySelector('#solo'); if (solo) solo.onclick = async () => { try { await GC.football.start(mid); } catch (e) { toast(errText(e)); } };
      sh.querySelector('#lv').onclick = async () => { token = null; try { await GC.football.leave(mid); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      await sleep(1500);
    }
  }

  document.querySelector('.go').addEventListener('click', async e => {
    const b = e.target.closest('[data-how]'); if (!b || b.disabled) return;
    const how = b.dataset.how, c = reqCfg();
    if (how === 'bot') { c.mode = 'free'; c.entry = 0; c.solo = true; }
    if (c.mode === 'stake' && GC.points < c.entry) { sfx.error(); haptic('error'); toast(errText({ code: 'insufficient' })); return; }
    b.disabled = true;
    try {
      if (how === 'invite') { const r = await GC.football.invite(c); await GC.refreshMe(); lobbyLoop(r.match); }
      else { const r = await GC.football.queueJoin(c); await GC.refreshMe(); queueLoop(r); }
    } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); }
    b.disabled = false; render();
  });

  (async () => {
    try {
      const me = await GC.refreshMe();
      settings = me.settings;
      const url = new URL(location.href);
      const code = (url.searchParams.get('join') || '').trim() || (GC.startParam().startsWith('football_') ? GC.startParam().slice(9) : '');
      const OTHER = { ludo: ['منچ', 'ludo.html'], hokm: ['حکم', 'hokm.html'], football: ['فوتبال', 'football.html'] };
      if (me.active_match && (me.active_game || 'football') === 'football' && GC.live) {
        const v = await GC.football.match(me.active_match, 0).catch(() => null);
        if (v && v.status === 'lobby') lobbyLoop(v.id);
        else if (v && v.status === 'playing') { store.set('fmid', v.id); $('resume').hidden = false; }
      } else if (me.active_match && GC.live) { const o = OTHER[me.active_game] || OTHER.ludo; $('resume').hidden = false; $('resume').href = o[1]; $('resume').querySelector('.muted').textContent = `یک بازی ${o[0]} نیمه‌تمام داری؛ اول آن را تمام کن.`; }
      else if (!GC.live && store.get('fmid', null)) {
        const v = await GC.football.match(store.get('fmid', null), 0).catch(() => null);
        if (v && v.status === 'playing') $('resume').hidden = false;
      } else if (me.queue) queueLoop(await GC.football.queueStatus());
      else if (code) {
        try { const r = await GC.football.join(code); await GC.refreshMe(); lobbyLoop(r.match); }
        catch (err) { toast(errText(err)); }
      }
    } catch (e) { toast(errText(e)); }
    render();
  })();
  render();
})();
</script>
</body>
</html>

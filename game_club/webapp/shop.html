<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · خدمات عبور</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<style>
/* خدمات عبور: دسته، فهرست، تأیید پیش از خرید، رسید */
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-3);align-items:start}
.item .ic-box{width:52px;height:52px;background:var(--obour-night);color:var(--obour-aqua);border-radius:var(--radius-md)}
.item h3{font-size:16px;line-height:24px;font-weight:900}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-2)}
.item-foot small{display:block;font-size:12px;color:var(--ink-muted)}
.need{font-size:12px;font-weight:700;color:var(--danger)}
.receipt{display:grid;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-3)}
.receipt div{display:flex;justify-content:space-between;gap:var(--space-3)}
.receipt span{color:var(--ink-muted)}
.ok-badge{width:64px;height:64px;border-radius:50%;background:var(--success);color:var(--on-fill);display:grid;place-items:center;justify-self:center;box-shadow:var(--press)}
.ok-badge svg{width:34px;height:34px}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>خدمات عبور</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>خدمات عبور</h1></div>
    <a class="pill" href="wallet.html" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>…</span><span class="plus"><i data-ic="plus"></i></span></a>
  </div>
</header>
<main class="page">
  <div class="obour"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#151B42"/><path d="M10 22.5l7-11.5 7 11.5" fill="none" stroke="#3BF0CF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="22.5" r="2" fill="#B36BFF"/></svg>
    <span>هر خرید مستقیم روی <b>حساب عبورت</b> ثبت می‌شود و کانفیگ در ربات عبور تحویل داده می‌شود.</span></div>
  <section class="stack" id="items" aria-label="پلن‌ها"><p class="hint" style="color:var(--ink)">در حال بارگذاری…</p></section>
  <section class="card item" aria-label="انتقال">
    <span class="ic-box"><i data-ic="wallet"></i></span>
    <div><h3>انتقال به کیف پول عبور</h3><p class="muted">امتیاز را به تومان در کیف عبور ببر و هر خدمتی خواستی بخر، مثل اشتراک هوش مصنوعی.</p>
      <div class="item-foot"><span class="muted" id="trRate"></span><button class="btn btn-sm" id="transfer">انتقال</button></div></div>
  </section>
  <p class="hint" style="color:var(--ink)" id="sampleNote" hidden>پیش‌نمایش است؛ قیمت‌ها نمونه‌اند.</p>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script>
(() => {
  const { fa, FD, amount, icon, sheet, sheetHead, toast, sfx, haptic, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  let shop = null;
  async function load() {
    try { shop = await GC.data.shop(); } catch (e) { $('items').innerHTML = `<p class="hint">${errText(e)}</p>`; return; }
    $('sampleNote').hidden = !shop.sample;
    $('trRate').textContent = 'هر امتیاز ' + fa(shop.rate) + ' تومان';
    const bal = GC.points;
    $('items').innerHTML = shop.plans.length ? shop.plans.map(p => {
      const short = bal < p.points;
      return `<article class="card item"><span class="ic-box">${icon('globe')}</span><div><h3>${p.title}</h3><p class="muted">${p.gb ? FD(p.gb) + ' گیگ' : ''}${p.days ? ' · ' + FD(p.days) + ' روز' : ''} · تحویل فوری در ربات عبور</p>
        <div class="item-foot"><div>${amount(p.points, 'lg')}<small>${fa(p.price)} تومان</small></div>
        ${short ? `<span class="need">${fa(p.points - bal)} امتیاز کم داری</span>` : `<button class="btn btn-sm btn-success" data-buy="${p.id}">دریافت</button>`}</div></div></article>`;
    }).join('') : '<p class="hint" style="color:var(--ink)">فعلا پلنی برای فروش نیست.</p>';
    mount();
  }
  function done(title, sub) {
    sheet(`<span class="ok-badge">${icon('check', 3)}</span><h2 style="text-align:center;font-size:22px;font-weight:900">${title}</h2><p class="hint">${sub}</p><button class="btn btn-block" data-close>باشه</button>`, { center: true });
  }
  $('items').addEventListener('click', e => {
    const b = e.target.closest('[data-buy]'); if (!b) return;
    const p = shop.plans.find(x => x.id === +b.dataset.buy);
    const sh = sheet(`${sheetHead('تأیید خرید')}
      <div class="receipt"><div><span>پلن</span><b>${p.title}</b></div><div><span>هزینه</span>${amount(p.points)}</div><div><span>موجودی بعد از خرید</span>${amount(GC.points - p.points, 'ink')}</div><div><span>تحویل</span><b>ربات عبور</b></div></div>
      <button class="btn btn-success btn-block" id="ok">${icon('check')}پرداخت با امتیاز</button>
      <button class="btn btn-light btn-block" data-close>انصراف</button>`);
    sh.querySelector('#ok').onclick = async ev => {
      ev.target.disabled = true;
      try {
        const r = await GC.data.buy(p.id);
        await GC.refreshMe();
        if (r.ok) { sfx.coin(); haptic('success'); done('خرید انجام شد', 'کانفیگ همین حالا در ربات عبور برایت فرستاده شد.'); }
        else { haptic('warning'); done('مبلغ به کیف عبور رفت', `ساخت سرویس الان ممکن نشد؛ ${fa(r.credited)} تومان در کیف پول عبورت است و می‌توانی همان‌جا بخری.`); }
        load();
      } catch (err) { ev.target.disabled = false; sfx.error(); haptic('error'); toast(errText(err)); }
    };
  });
  $('transfer').onclick = () => {
    const opts = [100, 250, 500, 1000].filter(v => v <= GC.points);
    if (!opts.length) { toast('برای انتقال حداقل ۱۰۰ امتیاز لازم است'); return; }
    const sh = sheet(`${sheetHead('انتقال به کیف پول عبور')}<div class="chips" id="tv">${opts.map(v => `<button class="chip" data-v="${v}">${GC.coin()}${fa(v)}</button>`).join('')}</div><p class="hint">هر امتیاز ${fa(shop ? shop.rate : GC.RATE)} تومان. انتقال برگشت ندارد.</p>`);
    sh.querySelector('#tv').onclick = async e => {
      const c = e.target.closest('[data-v]'); if (!c) return;
      try { const r = await GC.data.transfer(+c.dataset.v); await GC.refreshMe(); sfx.coin(); haptic('success'); done('انتقال انجام شد', `${fa(r.toman)} تومان به کیف پول عبورت اضافه شد.`); load(); }
      catch (err) { sfx.error(); toast(errText(err)); }
    };
  };
  (async () => { try { await GC.refreshMe(); } catch (e) {} load(); })();
  GC.nav('shop'); mount();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Club · خدمات عبور</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<style>
/* خدمات عبور: دسته، فهرست، تأیید پیش از خرید، رسید */
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-3);align-items:start}
.item .ic-box{width:52px;height:52px;background:var(--obour-night);color:var(--obour-aqua);border-radius:var(--radius-md)}
.item h3{font-size:16px;line-height:24px;font-weight:900}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-2)}
.item-foot small{display:block;font-size:12px;color:var(--ink-muted)}
.need{font-size:12px;font-weight:700;color:var(--danger)}
.receipt{display:grid;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-3)}
.receipt div{display:flex;justify-content:space-between;gap:var(--space-3)}
.receipt span{color:var(--ink-muted)}
.ok-badge{width:64px;height:64px;border-radius:50%;background:var(--success);color:var(--on-fill);display:grid;place-items:center;justify-self:center;box-shadow:var(--press)}
.ok-badge svg{width:34px;height:34px}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <h1 class="on-ground">خدمات عبور</h1>
    <a class="pill" href="wallet.html" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>۰</span><span class="plus"><i data-ic="plus"></i></span></a>
  </header>

  <div class="obour"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#151B42"/><path d="M10 22.5l7-11.5 7 11.5" fill="none" stroke="#3BF0CF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="22.5" r="2" fill="#B36BFF"/></svg>
    <span>هر خرید اینجا مستقیم روی <b>حساب عبورت</b> ثبت می‌شود و کانفیگ یا اشتراک در ربات عبور تحویل داده می‌شود.</span></div>

  <section aria-label="دسته‌ها" class="chips" id="cats">
    <button class="chip sm" data-v="all">همه</button>
    <button class="chip sm" data-v="net">اینترنت آزاد</button>
    <button class="chip sm" data-v="extra">حجم و تمدید</button>
    <button class="chip sm" data-v="ai">هوش مصنوعی</button>
  </section>

  <section class="stack" id="items" aria-label="خدمات"></section>
  <p class="hint" style="color:var(--ink)">قیمت‌ها نمونه‌اند و در نسخهٔ واقعی از پنل عبور خوانده می‌شوند.</p>
</main>
<script src="static/gc.js"></script>
<script>
(() => {
  const { S, save, fa, amount, icon, sheet, sheetHead, toast, sfx, ledger, SHOP, RATE, mount } = GC;
  const $ = id => document.getElementById(id);
  let cat = 'all';
  function render() {
    $('cats').querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cat)));
    $('items').innerHTML = SHOP.filter(s => cat === 'all' || s.cat === cat).map(s => {
      const short = S.bal < s.p;
      return `<article class="card item"><span class="ic-box">${icon(s.ic)}</span><div><h3>${s.t}</h3><p class="muted">${s.s}</p>
        <div class="item-foot"><div>${amount(s.p, 'lg')}<small>≈ ${fa(s.p * RATE)} تومان</small></div>
        ${short ? `<span class="need">${fa(s.p - S.bal)} امتیاز کم داری</span>` : `<button class="btn btn-sm btn-success" data-buy="${s.id}">دریافت</button>`}</div></div></article>`;
    }).join('');
    mount();
  }
  $('cats').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { cat = b.dataset.v; render(); } };
  $('items').addEventListener('click', e => {
    const b = e.target.closest('[data-buy]'); if (!b) return;
    const s = SHOP.find(x => x.id === b.dataset.buy);
    const sh = sheet(`${sheetHead('تأیید خرید')}
      <div class="receipt"><div><span>خدمت</span><b>${s.t}</b></div><div><span>هزینه</span>${amount(s.p)}</div><div><span>موجودی بعد از خرید</span>${amount(S.bal - s.p, 'ink')}</div><div><span>تحویل</span><b>ربات عبور</b></div></div>
      <button class="btn btn-success btn-block" id="ok">${icon('check')}پرداخت با امتیاز</button>
      <button class="btn btn-light btn-block" data-close>انصراف</button>`);
    sh.querySelector('#ok').onclick = () => {
      if (S.bal < s.p) { sfx.error(); toast('امتیازت کافی نیست'); return; }
      S.bal -= s.p; S.spent += s.p; ledger('خرید: ' + s.t, -s.p, 'shop'); save(); sfx.coin();
      const code = 'GC-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      sheet(`<span class="ok-badge">${icon('check', 3)}</span><h2 style="text-align:center;font-size:22px;font-weight:900">سفارش ثبت شد</h2>
        <div class="receipt"><div><span>خدمت</span><b>${s.t}</b></div><div><span>کد پیگیری</span><b dir="ltr">${code}</b></div></div>
        <p class="hint">در نسخهٔ واقعی، ربات عبور همین حالا کانفیگ یا اشتراک را برایت می‌فرستد.</p>
        <button class="btn btn-block" data-close>باشه</button>`, { center: true });
      render();
    };
  });
  render(); GC.nav('shop');
})();
</script>
</body>
</html>

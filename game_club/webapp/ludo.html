<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · منچ</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<style>
/* صفحه بازی: نوار نوبت، دو صندلی بالا، صفحه، دو صندلی پایین، رویدادها، داک تاس */
.ludo{gap:var(--space-3);padding-block-end:var(--space-4)}
.ludo .top h1{font-size:22px;line-height:30px}
.mode-tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;background:var(--surface);border-radius:var(--radius-pill);padding:2px 10px;box-shadow:var(--depth-sm)}
.mode-tag .amount{font-size:12.5px}
.seat .die.sm{margin-inline:2px}
.seat .who-tag{font-size:10.5px;line-height:14px;font-weight:800;color:var(--ink-muted)}
.home-mark{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.home-mark svg{width:70%;height:70%;color:var(--coin-deep)}
.result{display:grid;gap:var(--space-3);justify-items:center;text-align:center}
.result .crown-pawn{width:104px;height:132px;animation:bob 2s ease-in-out infinite}
.result .crown-pawn svg{width:100%;height:100%;overflow:visible}
.result h2{font-size:30px;line-height:38px;font-weight:900}
.result .prize{font-size:30px}
.result .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);width:100%}
.result .facts div{background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-2)}
.result .facts b{display:block;font-size:18px;font-weight:900}
.result .facts span{font-size:12px;color:var(--ink-muted)}
.coach{display:grid;gap:var(--space-3);text-align:center;justify-items:center}
.coach .pic{width:120px;height:120px;border-radius:var(--radius-lg);background:var(--surface-sunk);display:grid;place-items:center;overflow:hidden}
.coach .pic svg{width:100px;height:100px}
.coach h2{font-size:22px;line-height:30px;font-weight:900}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sky);width:22px;border-radius:8px}
.rules-mini{display:grid;gap:var(--space-2);margin:0;padding:0;list-style:none}
.rules-mini li{background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:13.5px;line-height:22px}
@keyframes bob{50%{transform:translateY(-6px)}}
</style>
</head>
<body>
<main class="page no-nav ludo">
  <header class="top">
    <div class="top-l">
      <button class="icon-btn" id="exit" aria-label="خروج از بازی"><i data-ic="back"></i></button>
      <div><h1 class="on-ground">منچ</h1></div>
      <span class="mode-tag" id="modeTag"></span>
    </div>
    <div class="top-l">
      <button class="icon-btn" id="snd" aria-label="صدا"></button>
      <button class="icon-btn" id="rules" aria-label="قوانین بازی"><i data-ic="help"></i></button>
    </div>
  </header>

  <div class="turnbar" id="turnbar" role="status" aria-live="polite"><span class="dot"></span><span class="txt" id="turnTxt">در حال آماده شدن…</span><span class="time" aria-hidden="true"><i id="timeBar"></i></span></div>

  <div class="seats" dir="ltr">
    <div class="seat c-blue" data-seat="blue"></div>
    <div class="seat c-red right" data-seat="red"></div>
  </div>
  <div class="board-frame" dir="ltr"><div class="board" id="board" aria-label="صفحهٔ منچ"></div></div>
  <div class="seats" dir="ltr">
    <div class="seat c-yellow" data-seat="yellow"></div>
    <div class="seat c-green right" data-seat="green"></div>
  </div>

  <div class="feed" id="feed" aria-live="polite"></div>

  <div class="dock">
    <button class="dock-btn" id="roll" aria-label="ریختن تاس" aria-disabled="true"><span class="die c-yellow" id="myDie"></span></button>
    <div class="dock-txt"><b id="dockT">صبر کن…</b><span id="dockS"></span></div>
  </div>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/ludo.js"></script>
</body>
</html>

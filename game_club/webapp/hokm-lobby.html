<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>آس و تاس · میز حکم</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* صفحهٔ حکم: چیدمان در static/gamepage.js؛ اینجا فقط صف، دعوت و انتخاب میز و ورق پیش از شروع */
.seatline{display:flex;justify-content:center;gap:var(--space-4)}
.seatw{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:800}
.seatw .avatar{--size:60px}
.wait{width:60px;height:60px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--ink-muted);font-weight:900;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbox{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:left;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.resume{display:grid;gap:4px;justify-items:start}
.resume b{font-size:18px;font-weight:900}
.count{font-size:44px;line-height:52px;font-weight:900;text-align:center;color:var(--acc-deep)}
/* پیش از شروع: انتخاب میز و ورق (مثل انتخاب تیم فوتبال)؛ قفل ها با قیمت، خرید همین جا.
   به سبک تازهٔ اپ (رنگ های اپ روشن یا تیره و سبز حکم)؛ ماهوت و ورق ها همان طرح خود بازی اند */
.hs-layer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:12px;overflow-y:auto;color:var(--ink);background:var(--ground);
  padding:calc(10px + var(--sa-t,0px) + var(--csa-t,0px)) 16px calc(16px + max(var(--sa-env-b),var(--sa-b,0px)));animation:hs-in .25s ease-out}
@keyframes hs-in{from{opacity:0}}
.hs-layer .top{display:flex;align-items:center;justify-content:space-between}
.hs-ib{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.hs-ib svg{width:20px;height:20px}
.hs-bal{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:800;font-size:14px}
.hs-bal .coin svg{width:18px;height:18px}
.hs-layer h1{margin:0;font-family:var(--font-rokh);font-size:26px;line-height:34px;font-weight:900}
.hs-layer .sub{margin:2px 0 0;font-size:13px;line-height:21px;color:var(--ink-muted)}
.hs-pv{position:relative;flex:none;height:200px;border-radius:24px;overflow:hidden;box-shadow:var(--rim,none),inset 0 0 30px rgba(0,0,0,.4),0 16px 28px -20px rgba(0,0,0,.6)}
.hs-pv .hk-card,.hs-pv .hk-back{font-size:58px;transition:transform .3s}
.hs-sec{border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.hs-sec .h{display:flex;align-items:baseline;gap:8px;padding-inline:4px}
.hs-sec .h b{font-family:var(--font-rokh);font-size:17px;font-weight:900}
.hs-sec .h span{font-size:12px;color:var(--ink-muted)}
.hs-row{display:grid;gap:8px}
.hs-row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hs-row.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hs-t{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-muted);font-size:12.5px;font-weight:800;min-width:0}
.hs-t .sw{position:relative;width:100%;height:62px;border-radius:14px;overflow:hidden;box-sizing:border-box;border:2px solid var(--surface);box-shadow:var(--rim,none),0 0 0 1px var(--line);transition:box-shadow .15s}
.hs-t .sw.cs{height:76px;background:#0F201B}
.hs-t .sw .hk-card,.hs-t .sw .hk-back{font-size:34px}
.hs-t small{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--coin-text);min-height:16px}
.hs-t small.own{color:var(--ink-muted);font-weight:600}
.hs-t small .coin svg{width:13px;height:13px}
.hs-t[aria-pressed="true"]{color:var(--ink)}
.hs-t[aria-pressed="true"] .sw{box-shadow:var(--rim,none),0 0 0 2.5px var(--acc)}
.hs-foot{position:sticky;bottom:0;z-index:2;display:grid;gap:8px;padding-top:10px;margin-top:auto;background:linear-gradient(color-mix(in srgb,var(--ground) 0%,transparent),var(--ground) 26px)}
.hs-go{flex:none;width:100%;min-height:54px;border-radius:27px;background:var(--acc);color:var(--acc-ink);font-size:16px;font-weight:900;padding:0 18px}
.hs-go:active{transform:translateY(3px)}
.hs-go.buy{background:var(--gold);color:var(--gold-ink)}
.hs-go:disabled{background:var(--surface-sunk);color:var(--ink-muted);box-shadow:none}
.hs-note{font-size:12.5px;line-height:20px;text-align:center;color:var(--ink-muted);margin:0}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>میز حکم</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>حکم</h1></div>
    <a class="pill" href="shop.html#daily" aria-label="کیف سکه"><span data-coin></span><span class="num" data-bal>…</span></a>
  </div>
</header>
<main class="page no-nav">
  <div class="gp" id="gp"></div>
  <a class="card card-link resume" id="resume" href="hokm.html" hidden><span class="tag tag-live">بازی نیمه‌کاره</span><b>برگرد سر میز</b><span class="muted">بازیت هنوز تموم نشده و یارت منتظرته</span></a>

</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/demo-hokm.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script src="static/gamepage.js"></script>
<script>
(() => {
  const { S, save, fa, FD, store, amount, face, icon, sheet, sheetHead, toast, sfx, haptic, sleep, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  let token = null, gp = null;
  const render = () => { if (gp) gp.refresh(); };

  // صندلی ها به ترتیب: تو، یارت، دو حریف
  const seatsHtml = list => `<div class="seatline">${list.map((p, i) => p ? `<div class="seatw">${face(p, i < 2 ? '#F5C451' : 'var(--sky)')}${GC.uname(p.name)}<small class="muted" style="font-size:11.5px">${i === 0 ? 'تو' : i === 1 ? 'یار' : 'حریف'}</small></div>` : `<div class="seatw"><span class="wait">؟</span>${i === 1 ? 'یار' : 'حریف'}</div>`).join('')}</div>`;
  async function go(mid) {
    token = null; store.set('hmid', mid);
    for (let n = 3; n >= 1; n--) {
      sheet(`<h2 style="text-align:center;font-size:22px;font-weight:900">میز حاضره!</h2><div class="count">${FD(n)}</div><p class="hint">الان بازی شروع می‌شه…</p>`, { center: true, dismiss: false });
      sfx.tick(); haptic('light'); await sleep(650);
    }
    location.href = 'hokm.html';
  }

  /* ---------- صف ناشناس ---------- */
  async function queueLoop(first) {
    const t = token = {};
    let st = first, shown = '';
    while (token === t) {
      if (st.state === 'matched') { sfx.turn(); haptic('success'); return go(st.match); }
      if (st.state !== 'waiting') { GC.close(); return; }
      const c = st.cfg, list = [{ name: 'خودت', av: 7 }];
      for (let i = 1; i < 4; i++) list.push(i < st.found ? { name: 'بازیکن', av: 3 + i } : null);
      const line = `${FD(st.found)} از ${FD(st.need)} نفر · ${FD(st.waited)} ثانیه`;
      if (shown === String(st.found)) { const el = document.getElementById('ql'); if (el) el.textContent = line; }
      else {
      shown = String(st.found);
      const sh = sheet(`${sheetHead('پیدا کردن حریف')}${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span><span id="ql">${line}</span></div>
        <p class="hint">${c.mode !== 'free' ? 'رتبه‌ای 🏆 · فقط با بازیکن واقعی · برد یعنی جام و سکه' : st.bots_in != null && st.bots_in > 0 ? `اگه تا ${FD(st.bots_in)} ثانیهٔ دیگه کسی نیاد ربات جای خالیو پر می‌کنه` : 'میز که پر شه بازی شروع می‌شه'} · ناشناس می‌مونی</p>
        ${st.can_bots ? '<button class="btn btn-block" id="qb">منتظر نمی‌مونم بذار ربات جای خالیو پر کنه</button>' : ''}
        <button class="btn btn-light btn-block" id="qc">بی‌خیال</button>`, { dismiss: false });
      const qb = sh.querySelector('#qb');
      if (qb) qb.onclick = async () => { qb.disabled = true; try { const r = await GC.hokm.queueBots(); if (r.state === 'matched') { token = null; sfx.turn(); haptic('success'); return go(r.match); } } catch (e) { toast(errText(e)); } qb.disabled = false; };
      sh.querySelector('#qc').onclick = async () => { token = null; try { await GC.hokm.queueLeave(); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      }
      await sleep(1500); if (token !== t) return;
      try { st = await GC.hokm.queueStatus(); } catch (e) { toast(errText(e)); }
    }
  }

  /* ---------- میز دعوت ---------- */
  async function lobbyLoop(mid) {
    const t = token = {};
    let shown = '';
    while (token === t) {
      let v;
      try { v = await GC.hokm.match(mid, 0); } catch (e) { toast(errText(e)); GC.close(); return; }
      if (v.status === 'playing') return go(mid);
      if (v.status === 'cancelled') { GC.close(); toast('سازنده میزو بست و ورودیت برگشت'); await GC.refreshMe(); render(); return; }
      const L = v.lobby, c = v.cfg, full = L.seats.length === 4, link = L.link;
      const sig = L.seats.map(s => s.color + s.name).join('|');
      if (sig === shown) { await sleep(1500); continue; }
      shown = sig; if (L.seats.length > 1) { sfx.turn(); haptic('light'); }
      // صندلی ۰ سازنده، ۲ یار او، ۱ و ۳ حریف ها؛ از دید خودم: من، یار، دو حریف
      const mine = (L.seats.find(s => s.me) || { color: '0' }).color, at = k => L.seats.find(s => s.color === String((+mine + k) % 4));
      const list = [0, 2, 1, 3].map(k => { const s = at(k); return s ? Object.assign({}, s, { name: s.me ? 'خودت' : s.name }) : null; });
      const share = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('بیا یار من شو حکم بزنیم!');
      const sh = sheet(`${sheetHead(L.host ? 'بازی با یار' : 'سر میز رفیقت')}
        ${L.host ? `<p>این لینکو بفرست و اولین کسی که بازش کنه یارت می‌شه و بعدیا حریف</p>
        <div class="linkbox"><code>${link || 'لینک دعوت فقط تو تلگرام ساخته می‌شه'}</code><button class="btn btn-sm" id="cp">${icon('copy')}کپی</button></div>
        <button class="btn btn-block" id="shr">${icon('send')}بفرست تو تلگرام</button>` : '<p>منتظر بقیه‌ایم تا سازندهٔ میز بازیو شروع کنه…</p>'}
        ${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span>${FD(L.seats.length)} از ۴ نفر نشستن</div>
        ${L.host && c.mode === 'free' && !full ? '<button class="btn btn-light btn-block" id="solo">ربات جای خالیو پر کنه و شروع کن</button>' : ''}
        <button class="btn btn-light btn-block" id="lv">${L.host ? 'بستن میز' : 'بلند شدن از میز'}</button>`, { dismiss: false });
      const cp = sh.querySelector('#cp');
      if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(link).then(() => toast('لینک دعوت کپی شد'), () => toast('کپی نشد لینکو دستی بفرست')); } catch (e) { toast('کپی نشد لینکو دستی بفرست'); } };
      const shr = sh.querySelector('#shr'); if (shr) shr.onclick = () => link ? GC.openLink(share) : toast('لینک فقط تو تلگرام ساخته می‌شه');
      const solo = sh.querySelector('#solo'); if (solo) solo.onclick = async () => { try { await GC.hokm.start(mid); } catch (e) { toast(errText(e)); } };
      sh.querySelector('#lv').onclick = async () => { token = null; try { await GC.hokm.leave(mid); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      await sleep(1500);
    }
  }

  /* ---------- پیش از شروع: میز و ورق خودت (مثل انتخاب تیم در فوتبال) ---------- */
  const C = GCCards;
  const GO = { online: 'پیدا کردن حریف', invite: 'ساختن میز و دعوت یار', bot: 'شروع تمرین', join: 'نشستن سر میز' };
  // یک دست وسط میز با دسته ورق کنار آن؛ با هر انتخاب همین صحنه با میز و ورق تازه دیده می شود
  const scene = () => C.back('', 'left:7%;top:30%;transform:rotate(-8deg)') + C.back('', 'left:8%;top:28%;transform:rotate(-4deg)')
    + C.face(48, '', 'left:33%;top:12%;transform:rotate(-16deg)') + C.face(36, '', 'left:47%;top:30%;transform:rotate(11deg)')
    + C.face(24, '', 'left:61%;top:10%;transform:rotate(-5deg)') + C.face(12, '', 'left:72%;top:28%;transform:rotate(18deg)');
  async function setup(how, run) {
    let sty;
    try { sty = await GC.data.style(); } catch (e) { return run(); }
    const pick = { table: sty.table, cards: sty.cards };
    const find = (k, look) => sty.items.find(i => i.kind === k && i.look === look);
    const el = document.createElement('div'); el.className = 'hs-layer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'انتخاب میز و ورق');
    document.body.appendChild(el);
    const tile = (i, k) => `<button class="hs-t" data-k="${k}" data-look="${i.look}" aria-pressed="${pick[k] === i.look}">
      ${k === 'table' ? `<span class="sw felt tbl-${i.look}"></span>` : `<span class="sw cs cards-${i.look}">${C.back('', 'left:12%;top:16%;transform:rotate(-10deg)')}${C.face(12, '', 'left:44%;top:10%;transform:rotate(7deg)')}</span>`}
      ${i.name.replace(/^(میز|ورق) /, '')}${i.owned ? `<small class="own">${i.price ? 'خریدی' : 'مجانی'}</small>` : `<small>${GC.coin()}${fa(i.price)}</small>`}</button>`;
    function draw() {
      const need = ['table', 'cards'].map(k => find(k, pick[k])).filter(i => i && !i.owned);
      const cost = need.reduce((a, i) => a + i.price, 0), short = cost > GC.points;
      el.innerHTML = `<div class="top"><button class="hs-ib" id="hsX" aria-label="برگشت">${icon('back')}</button><span class="hs-bal">${GC.coin()}${fa(GC.points)}</span></div>
        <div><h1>میز و ورقتو انتخاب کن</h1><p class="sub">سر میز هر کی همون میز و ورقی رو می‌بینه که خودش انتخاب کرده</p></div>
        <div class="hs-pv felt tbl-${pick.table} cards-${pick.cards}">${scene()}</div>
        <section class="hs-sec"><div class="h"><b>میز</b><span>${find('table', pick.table).name}</span></div>
          <div class="hs-row r3">${sty.items.filter(i => i.kind === 'table').map(i => tile(i, 'table')).join('')}</div></section>
        <section class="hs-sec"><div class="h"><b>ورق</b><span>${find('cards', pick.cards).name}</span></div>
          <div class="hs-row r4">${sty.items.filter(i => i.kind === 'cards').map(i => tile(i, 'cards')).join('')}</div></section>
        <div class="hs-foot">${cost ? `<p class="hs-note">${need.map(i => i.name).join(' و ')} رو نداری ولی یه بار بخری تا همیشه مال خودته</p>` : ''}
        <button class="hs-go${cost && !short ? ' buy' : ''}" id="hsGo"${short ? ' disabled' : ''}>${!cost ? 'همین · ' + GO[how] : short ? fa(cost - GC.points) + ' سکه کم داری' : `خرید با ${fa(cost)} سکه و ${GO[how]}`}</button></div>`;
      el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { pick[b.dataset.k] = b.dataset.look; sfx.tap(); haptic('select'); draw(); });
      el.querySelector('#hsX').onclick = () => { el.remove(); };
      el.querySelector('#hsGo').onclick = async ev => {
        ev.currentTarget.disabled = true;
        try {
          for (const k of ['table', 'cards']) {
            const i = find(k, pick[k]);
            if (!i.owned) { await GC.data.styleBuy(i.id); sfx.coin(); haptic('success'); }
            else if (pick[k] !== sty[k]) await GC.data.styleUse(i.id);
          }
          if (cost) await GC.refreshMe();
        } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); try { sty = await GC.data.style(); } catch (e) {} draw(); return; }
        el.remove(); render(); run();
      };
      mount(el);
    }
    draw();
  }

  /* ---------- صفحهٔ بازی: صف های آماده، میز خصوصی، رده بندی و آموزش ---------- */
  function play(how, cfg, btn) {
    const c = Object.assign({ game: 'hokm' }, cfg);
    if (how === 'bot') { c.mode = 'free'; c.entry = 0; c.solo = true; }
    setup(how, async () => {
      if (btn) btn.disabled = true;
      try {
        if (how === 'invite') { const r = await GC.hokm.invite(c); await GC.refreshMe(); lobbyLoop(r.match); }
        else { const r = await GC.hokm.queueJoin(c); await GC.refreshMe(); queueLoop(r); }
      } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); }
      if (btn) btn.disabled = false; render();
    });
  }
  gp = GCGame.build({
    game: 'hokm', title: 'حکم', shop: true, help: 'help.html#hokm',
    privateSub: 'یارتو خودت دعوت کن و نفرای بعدی حریف می‌شن',
    modes: [
      { v: 'h3', label: '۳ دست', ic: icon('bolt'), team: true, desc: 'چهار نفره و دو تیم دونفره · هر تیمی زودتر ۳ دست ببره برده · حدود ۱۰ دقیقه', short: '۴ نفره · دو تیم · حدود ۱۰ دقیقه', cfg: { target: 3 } },
      { v: 'h7', label: '۷ دست', ic: icon('cards'), team: true, desc: 'بازی کامل چهار نفره با دو تیم دونفره تا ۷ دست · حدود ۲۵ دقیقه', short: '۴ نفره · دو تیم · حدود ۲۵ دقیقه', cfg: { target: 7 } },
    ],
    rules: [['دو تیم دونفره', 'یارت روبه‌روت می‌شینه و با هم امتیاز می‌گیرین'],
      ['حاکم', 'با دیدن پنج برگ اول خال حکمو انتخاب می‌کنه'],
      ['هم‌خال بازی کن', 'اگه از خال شروع‌شده نداری می‌تونی حکم بزنی یا یه برگ دیگه بندازی'],
      ['هر دست', 'رو بالاترین برگِ خال شروع یا بالاترین حکم می‌بره'],
      ['هر تیم', 'که ۷ دست ببره اون دورو برده و بازی تا ۳ یا ۷ دور ادامه داره']],
    play,
  });

  (async () => {
    try {
      const me = await GC.refreshMe();
      gp.load(me);
      const url = new URL(location.href);
      const code = (url.searchParams.get('join') || '').trim() || (GC.startParam().startsWith('hokm_') ? GC.startParam().slice(5) : '');
      if (me.active_match && (me.active_game || 'hokm') === 'hokm' && GC.live) {
        const v = await GC.hokm.match(me.active_match, 0).catch(() => null);
        if (v && v.status === 'lobby') lobbyLoop(v.id);
        else if (v && v.status === 'playing') { store.set('hmid', v.id); if (code) { location.replace('hokm.html'); return; } $('resume').hidden = false; }
      } else if (me.active_match && GC.live) { const o = { ludo: ['منچ', 'ludo.html'], football: ['فوتبال', 'football.html'], billiard: ['بیلیارد', 'billiard.html'], divar: ['دیوار', 'divar.html'], esmfamil: ['اسم‌فامیل', 'esmfamil.html'], lashgar: ['لشگر کاغذی', 'lashgar.html'], snakes: ['مار و پله', 'snakes.html'] }[me.active_game] || ['منچ', 'ludo.html']; $('resume').hidden = false; $('resume').href = o[1]; $('resume').querySelector('.muted').textContent = `یه بازی ${o[0]} نیمه‌کاره داری اول اونو تموم کن`; }
      else if (!GC.live && store.get('hmid', null)) {
        const v = await GC.hokm.match(store.get('hmid', null), 0).catch(() => null);
        if (v && v.status === 'playing') $('resume').hidden = false;
      } else if (me.queue) queueLoop(await GC.hokm.queueStatus());
      else if (code) {
        setup('join', async () => {
          try { const r = await GC.hokm.join(code); await GC.refreshMe(); lobbyLoop(r.match); }
          catch (err) { toast(errText(err)); }
        });
      }
    } catch (e) { toast(errText(e)); }
    render();
  })();
  render();
})();
</script>
</body>
</html>

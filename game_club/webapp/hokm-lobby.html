<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · میز حکم</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<style>
/* لابی حکم: نوع بازی، ورودی، طول بازی، خلاصه و سه راه شروع. صف و دعوت در برگه */
.q{display:grid;gap:var(--space-2)}
.q-h{display:flex;align-items:center;gap:var(--space-2);font-weight:900}
.q-h i{width:24px;height:24px;border-radius:50%;background:var(--sky);color:var(--on-fill);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.sum{background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3)}
.sum span{display:block;font-size:12px;color:var(--ink-muted)}
.sum b{font-weight:900}
.go{display:grid;gap:var(--space-2)}
.go small{display:block;font-size:12px;line-height:16px;font-weight:600;opacity:.85}
.go .btn{flex-direction:row;justify-content:flex-start;text-align:start;min-height:64px}
.go .btn>span{display:grid}
.seatline{display:flex;justify-content:center;gap:var(--space-4)}
.seatw{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:800}
.seatw .avatar{--size:60px}
.wait{width:60px;height:60px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--ink-muted);font-weight:900;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbox{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:left;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.resume{display:grid;gap:4px;justify-items:start}
.resume b{font-size:18px;font-weight:900}
.count{font-size:44px;line-height:52px;font-weight:900;text-align:center;color:var(--sky-deep)}
/* پیش از شروع: انتخاب میز و ورق (مثل انتخاب تیم فوتبال)؛ قفل ها با قیمت، خرید همین جا */
.hs-layer{--gold:#F5C451;--gold-ink:#3A2A00;position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:12px;overflow-y:auto;color:#fff;
  background:radial-gradient(120% 60% at 50% 0%,#1F4A37 0%,#10261E 55%,#0B1714 100%);
  padding:calc(10px + var(--sa-t,0px) + var(--csa-t,0px)) 16px calc(16px + max(env(safe-area-inset-bottom,0px),var(--sa-b,0px)));animation:hs-in .25s ease-out}
@keyframes hs-in{from{opacity:0}}
.hs-layer .top{display:flex;align-items:center;justify-content:space-between}
.hs-ib{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.3)}
.hs-ib svg{width:20px;height:20px}
.hs-bal{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.25);font-weight:800;font-size:14px}
.hs-bal .coin svg{width:18px;height:18px}
.hs-layer h1{margin:0;font-size:24px;font-weight:800}
.hs-layer .sub{margin:2px 0 0;font-size:13px;line-height:21px;color:rgba(255,255,255,.72)}
.hs-pv{position:relative;flex:none;height:200px;border-radius:24px;overflow:hidden;box-shadow:var(--rim,none),inset 0 0 30px rgba(0,0,0,.4)}
.hs-pv .hk-card,.hs-pv .hk-back{font-size:58px;transition:transform .3s}
.hs-sec{border-radius:22px;background:#17302A;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.hs-sec .h{display:flex;align-items:baseline;gap:8px;padding-inline:4px}
.hs-sec .h b{font-size:16px;font-weight:800}
.hs-sec .h span{font-size:12px;color:rgba(255,255,255,.6)}
.hs-row{display:grid;gap:8px}
.hs-row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hs-row.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hs-t{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,.6);font-size:12.5px;font-weight:800;min-width:0}
.hs-t .sw{position:relative;width:100%;height:62px;border-radius:14px;overflow:hidden;box-sizing:border-box;border:2px solid rgba(255,255,255,.1);box-shadow:var(--rim,none);transition:border-color .15s,box-shadow .15s}
.hs-t .sw.cs{height:76px;background:#0F201B}
.hs-t .sw .hk-card,.hs-t .sw .hk-back{font-size:34px}
.hs-t small{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--gold);min-height:16px}
.hs-t small.own{color:rgba(255,255,255,.45);font-weight:600}
.hs-t small .coin svg{width:13px;height:13px}
.hs-t[aria-pressed="true"]{color:#fff}
.hs-t[aria-pressed="true"] .sw{border-color:var(--gold);box-shadow:var(--rim,none)}
.hs-foot{position:sticky;bottom:0;z-index:2;display:grid;gap:8px;padding-top:10px;margin-top:auto;background:linear-gradient(rgba(11,23,20,0),#0B1714 26px)}
.hs-go{flex:none;width:100%;min-height:54px;border-radius:27px;background:#3D7BFF;color:#fff;font-size:16px;font-weight:800;padding:0 18px}
.hs-go:active{transform:translateY(3px)}
.hs-go.buy{background:var(--gold);color:var(--gold-ink)}
.hs-go:disabled{background:#24423A;color:rgba(255,255,255,.7);box-shadow:none}
.hs-note{font-size:12.5px;line-height:20px;text-align:center;color:rgba(255,255,255,.75);margin:0}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>میز حکم</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>حکم</h1></div>
    <div class="top-l">
      <a class="icon-btn" href="help.html#hokm" aria-label="راهنمای حکم"><i data-ic="help"></i></a>
      <a class="pill" href="shop.html#wallet" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>…</span></a>
    </div>
  </div>
</header>
<main class="page no-nav">
  <a class="card card-link resume" id="resume" href="hokm.html" hidden><span class="tag tag-live">بازی نیمه‌تمام</span><b>برگرد سر میز</b><span class="muted">بازی‌ات هنوز ادامه دارد؛ یارت منتظر توست.</span></a>

  <section class="card stack" aria-label="تنظیم بازی">
    <div class="q"><div class="q-h"><i>۱</i>نوع بازی</div>
      <div class="choice-row" id="mode">
        <button class="choice" data-v="free"><b>آزاد</b><span>بدون امتیاز و جایزه</span></button>
        <button class="choice" data-v="stake"><b>با امتیاز</b><span>تیم برنده همهٔ ورودی‌ها را می‌برد</span></button>
      </div></div>
    <div class="q" id="entryQ"><div class="q-h"><i>۲</i>ورودی هر نفر</div><div class="chips" id="entry"></div></div>
    <div class="q"><div class="q-h"><i id="nP">۳</i>طول بازی</div>
      <div class="seg" id="target"><button data-v="3">۳ دست<small>سریع · حدود ۱۰ دقیقه</small></button><button data-v="7">۷ دست<small>کامل · حدود ۲۵ دقیقه</small></button></div></div>
    <p class="hint" style="text-align:start">چهار نفر، دو تیم دونفره؛ یارت روبه‌رویت می‌نشیند. حاکم از روی پنج برگ اول حکم را انتخاب می‌کند.</p>
  </section>

  <section class="card stack" aria-label="شروع">
    <div class="summary" id="summary"></div>
    <div class="go">
      <button class="btn" data-how="online"><i data-ic="users"></i><span>بازی با ناشناس<small>سه بازیکن واقعی پیدا می‌کنیم</small></span></button>
      <button class="btn btn-gold" data-how="invite"><i data-ic="link"></i><span>بازی با یار<small>دوستت را دعوت کن تا هم‌تیمی‌ات شود</small></span></button>
      <button class="btn btn-light" data-how="bot"><i data-ic="bot"></i><span>تمرین با ربات<small>همیشه آزاد و بدون امتیاز</small></span></button>
    </div>
    <p class="hint" id="bal"></p>
  </section>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/demo-hokm.js"></script>
<script src="static/cards.js"></script>
<script>
(() => {
  const { S, save, fa, FD, store, amount, face, icon, sheet, sheetHead, toast, sfx, haptic, sleep, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  const cfg = Object.assign({ entry: 100, target: 7 }, store.get('hokmCfg', {}));
  let settings = { stake: true, entries: [50, 100, 250, 500] }, token = null;

  function render() {
    if (!settings.stake) S.mode = 'free';
    const stake = S.mode === 'stake';
    if (!settings.entries.includes(cfg.entry)) cfg.entry = settings.entries[0];
    $('mode').querySelectorAll('[data-v]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.v === S.mode)); if (b.dataset.v === 'stake') b.disabled = !settings.stake; });
    $('entryQ').hidden = !stake;
    $('nP').textContent = stake ? '۳' : '۲';
    $('entry').innerHTML = settings.entries.map(v => `<button class="chip" data-v="${v}" aria-pressed="${cfg.entry === v}"${GC.points < v ? ' disabled' : ''}>${GC.coin()}${fa(v)}</button>`).join('');
    $('target').querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === cfg.target)));
    $('summary').innerHTML = stake
      ? `<div class="sum"><span>ورودی تو</span>${amount(cfg.entry)}</div><div class="sum" style="background:var(--coin-tint)"><span>جایزهٔ هر برنده</span>${amount(cfg.entry * 2)}</div>`
      : `<div class="sum"><span>نوع</span><b>آزاد، بدون جایزه</b></div><div class="sum"><span>بازی</span><b>۴ نفره، تا ${FD(cfg.target)} دست</b></div>`;
    $('bal').textContent = 'موجودی تو: ' + fa(GC.points) + ' امتیاز';
    store.set('hokmCfg', cfg); save(); mount();
  }
  $('mode').onclick = e => { const b = e.target.closest('[data-v]'); if (b && !b.disabled) { S.mode = b.dataset.v; render(); } };
  $('entry').onclick = e => { const b = e.target.closest('[data-v]'); if (b && !b.disabled) { cfg.entry = +b.dataset.v; render(); } };
  $('target').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { cfg.target = +b.dataset.v; render(); } };

  // صندلی ها به ترتیب: تو، یارت، دو حریف
  const seatsHtml = list => `<div class="seatline">${list.map((p, i) => p ? `<div class="seatw">${face(p, i < 2 ? '#F5C451' : 'var(--sky)')}${p.name}<small class="muted" style="font-size:11px">${i === 0 ? 'تو' : i === 1 ? 'یار' : 'حریف'}</small></div>` : `<div class="seatw"><span class="wait">؟</span>${i === 1 ? 'یار' : 'حریف'}</div>`).join('')}</div>`;
  const reqCfg = () => ({ game: 'hokm', mode: S.mode, entry: S.mode === 'stake' ? cfg.entry : 0, target: cfg.target });
  async function go(mid) {
    token = null; store.set('hmid', mid);
    for (let n = 3; n >= 1; n--) {
      sheet(`<h2 style="text-align:center;font-size:22px;font-weight:900">میز آماده است!</h2><div class="count">${FD(n)}</div><p class="hint">بازی شروع می‌شود…</p>`, { center: true, dismiss: false });
      sfx.tick(); haptic('light'); await sleep(650);
    }
    location.href = 'hokm.html';
  }

  /* ---------- صف ناشناس ---------- */
  async function queueLoop(first) {
    const t = token = {};
    let st = first, shown = '';
    while (token === t) {
      if (st.state === 'matched') { sfx.turn(); haptic('success'); return go(st.match); }
      if (st.state !== 'waiting') { GC.close(); return; }
      const c = st.cfg, list = [{ name: 'شما', av: 7 }];
      for (let i = 1; i < 4; i++) list.push(i < st.found ? { name: 'بازیکن', av: 3 + i } : null);
      const line = `${FD(st.found)} از ${FD(st.need)} نفر · ${FD(st.waited)} ثانیه`;
      if (shown === String(st.found)) { const el = document.getElementById('ql'); if (el) el.textContent = line; }
      else {
      shown = String(st.found);
      const sh = sheet(`${sheetHead('پیدا کردن حریف')}${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span><span id="ql">${line}</span></div>
        <p class="hint">${c.mode === 'stake' ? `ورودی ${fa(c.entry)} · جایزهٔ هر برنده ${fa(c.entry * 2)} امتیاز · فقط با بازیکن واقعی` : st.bots_in != null && st.bots_in > 0 ? `اگر تا ${FD(st.bots_in)} ثانیهٔ دیگر کسی نیاید، جای خالی را ربات پر می‌کند` : 'بازی وقتی شروع می‌شود که میز کامل شود'} · ناشناس می‌مانی</p>
        ${st.can_bots ? '<button class="btn btn-block" id="qb">منتظر نمی‌مانم؛ جای خالی را ربات پر کند</button>' : ''}
        <button class="btn btn-light btn-block" id="qc">انصراف${c.mode === 'stake' ? ' و برگشت ورودی' : ''}</button>`, { dismiss: false });
      const qb = sh.querySelector('#qb');
      if (qb) qb.onclick = async () => { qb.disabled = true; try { const r = await GC.hokm.queueBots(); if (r.state === 'matched') { token = null; sfx.turn(); haptic('success'); return go(r.match); } } catch (e) { toast(errText(e)); } qb.disabled = false; };
      sh.querySelector('#qc').onclick = async () => { token = null; try { await GC.hokm.queueLeave(); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      }
      await sleep(1500); if (token !== t) return;
      try { st = await GC.hokm.queueStatus(); } catch (e) { toast(errText(e)); }
    }
  }

  /* ---------- میز دعوت ---------- */
  async function lobbyLoop(mid) {
    const t = token = {};
    let shown = '';
    while (token === t) {
      let v;
      try { v = await GC.hokm.match(mid, 0); } catch (e) { toast(errText(e)); GC.close(); return; }
      if (v.status === 'playing') return go(mid);
      if (v.status === 'cancelled') { GC.close(); toast('سازنده میز را بست؛ ورودی‌ات برگشت'); await GC.refreshMe(); render(); return; }
      const L = v.lobby, c = v.cfg, full = L.seats.length === 4, link = L.link;
      const sig = L.seats.map(s => s.color + s.name).join('|');
      if (sig === shown) { await sleep(1500); continue; }
      shown = sig; if (L.seats.length > 1) { sfx.turn(); haptic('light'); }
      // صندلی ۰ سازنده، ۲ یار او، ۱ و ۳ حریف ها؛ از دید خودم: من، یار، دو حریف
      const mine = (L.seats.find(s => s.me) || { color: '0' }).color, at = k => L.seats.find(s => s.color === String((+mine + k) % 4));
      const list = [0, 2, 1, 3].map(k => { const s = at(k); return s ? Object.assign({}, s, { name: s.me ? 'شما' : s.name }) : null; });
      const share = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(c.mode === 'stake' ? `بیا یار من شو در حکم! ورودی ${c.entry} امتیاز.` : 'بیا یار من شو، حکم بازی کنیم!');
      const sh = sheet(`${sheetHead(L.host ? 'بازی با یار' : 'سر میز دوستت')}
        ${L.host ? `<p>این لینک را بفرست. اولین کسی که بازش کند یار تو می‌شود و بعدی‌ها حریف${c.mode === 'stake' ? ' و ' + fa(c.entry) + ' امتیاز ورودی از کیف خودش کم می‌شود' : ''}.</p>
        <div class="linkbox"><code>${link || 'لینک دعوت فقط داخل تلگرام ساخته می‌شود'}</code><button class="btn btn-sm" id="cp">${icon('copy')}کپی</button></div>
        <button class="btn btn-block" id="shr">${icon('send')}ارسال در تلگرام</button>` : '<p>منتظر بقیه و شروع بازی توسط سازندهٔ میز…</p>'}
        ${seatsHtml(list)}
        <div class="wait-line"><span class="spinner"></span>${FD(L.seats.length)} از ۴ نفر نشسته‌اند</div>
        ${L.host && c.mode === 'free' && !full ? '<button class="btn btn-light btn-block" id="solo">جای خالی را ربات پر کند و شروع کن</button>' : ''}
        <button class="btn btn-light btn-block" id="lv">${L.host ? 'بستن میز' : 'بلند شدن از میز'}</button>`, { dismiss: false });
      const cp = sh.querySelector('#cp');
      if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(link).then(() => toast('لینک دعوت کپی شد'), () => toast('کپی نشد؛ لینک را دستی بفرست')); } catch (e) { toast('کپی نشد؛ لینک را دستی بفرست'); } };
      const shr = sh.querySelector('#shr'); if (shr) shr.onclick = () => link ? GC.openLink(share) : toast('لینک فقط داخل تلگرام ساخته می‌شود');
      const solo = sh.querySelector('#solo'); if (solo) solo.onclick = async () => { try { await GC.hokm.start(mid); } catch (e) { toast(errText(e)); } };
      sh.querySelector('#lv').onclick = async () => { token = null; try { await GC.hokm.leave(mid); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      await sleep(1500);
    }
  }

  /* ---------- پیش از شروع: میز و ورق خودت (مثل انتخاب تیم در فوتبال) ---------- */
  const C = GCCards;
  const GO = { online: 'پیدا کردن حریف', invite: 'ساختن میز و دعوت یار', bot: 'شروع تمرین', join: 'نشستن سر میز' };
  // یک دست وسط میز با دسته ورق کنار آن؛ با هر انتخاب همین صحنه با میز و ورق تازه دیده می شود
  const scene = () => C.back('', 'left:7%;top:30%;transform:rotate(-8deg)') + C.back('', 'left:8%;top:28%;transform:rotate(-4deg)')
    + C.face(48, '', 'left:33%;top:12%;transform:rotate(-16deg)') + C.face(36, '', 'left:47%;top:30%;transform:rotate(11deg)')
    + C.face(24, '', 'left:61%;top:10%;transform:rotate(-5deg)') + C.face(12, '', 'left:72%;top:28%;transform:rotate(18deg)');
  async function setup(how, run) {
    let sty;
    try { sty = await GC.data.style(); } catch (e) { return run(); }
    const pick = { table: sty.table, cards: sty.cards };
    const find = (k, look) => sty.items.find(i => i.kind === k && i.look === look);
    const el = document.createElement('div'); el.className = 'hs-layer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'انتخاب میز و ورق');
    document.body.appendChild(el);
    const tile = (i, k) => `<button class="hs-t" data-k="${k}" data-look="${i.look}" aria-pressed="${pick[k] === i.look}">
      ${k === 'table' ? `<span class="sw felt tbl-${i.look}"></span>` : `<span class="sw cs cards-${i.look}">${C.back('', 'left:12%;top:16%;transform:rotate(-10deg)')}${C.face(12, '', 'left:44%;top:10%;transform:rotate(7deg)')}</span>`}
      ${i.name.replace(/^(میز|ورق) /, '')}${i.owned ? `<small class="own">${i.price ? 'خریده‌ای' : 'رایگان'}</small>` : `<small>${GC.coin()}${fa(i.price)}</small>`}</button>`;
    function draw() {
      const need = ['table', 'cards'].map(k => find(k, pick[k])).filter(i => i && !i.owned);
      const cost = need.reduce((a, i) => a + i.price, 0), short = cost > GC.points;
      el.innerHTML = `<div class="top"><button class="hs-ib" id="hsX" aria-label="برگشت">${icon('back')}</button><span class="hs-bal">${GC.coin()}${fa(GC.points)}</span></div>
        <div><h1>میز و ورقت را انتخاب کن</h1><p class="sub">سر میز هر کس همان میز و ورقی را می‌بیند که خودش انتخاب کرده.</p></div>
        <div class="hs-pv felt tbl-${pick.table} cards-${pick.cards}">${scene()}</div>
        <section class="hs-sec"><div class="h"><b>میز</b><span>${find('table', pick.table).name}</span></div>
          <div class="hs-row r3">${sty.items.filter(i => i.kind === 'table').map(i => tile(i, 'table')).join('')}</div></section>
        <section class="hs-sec"><div class="h"><b>ورق</b><span>${find('cards', pick.cards).name}</span></div>
          <div class="hs-row r4">${sty.items.filter(i => i.kind === 'cards').map(i => tile(i, 'cards')).join('')}</div></section>
        <div class="hs-foot">${cost ? `<p class="hs-note">${need.map(i => i.name).join(' و ')} را نداری؛ یک بار بخری برای همیشه مال توست.</p>` : ''}
        <button class="hs-go${cost && !short ? ' buy' : ''}" id="hsGo"${short ? ' disabled' : ''}>${!cost ? 'همین · ' + GO[how] : short ? fa(cost - GC.points) + ' امتیاز کم داری' : `خرید با ${fa(cost)} امتیاز و ${GO[how]}`}</button></div>`;
      el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { pick[b.dataset.k] = b.dataset.look; sfx.tap(); haptic('select'); draw(); });
      el.querySelector('#hsX').onclick = () => { el.remove(); };
      el.querySelector('#hsGo').onclick = async ev => {
        ev.currentTarget.disabled = true;
        try {
          for (const k of ['table', 'cards']) {
            const i = find(k, pick[k]);
            if (!i.owned) { await GC.data.styleBuy(i.id); sfx.coin(); haptic('success'); }
            else if (pick[k] !== sty[k]) await GC.data.styleUse(i.id);
          }
          if (cost) await GC.refreshMe();
        } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); try { sty = await GC.data.style(); } catch (e) {} draw(); return; }
        el.remove(); render(); run();
      };
      mount(el);
    }
    draw();
  }

  document.querySelector('.go').addEventListener('click', async e => {
    const b = e.target.closest('[data-how]'); if (!b || b.disabled) return;
    const how = b.dataset.how, c = reqCfg();
    if (how === 'bot') { c.mode = 'free'; c.entry = 0; c.solo = true; }
    if (c.mode === 'stake' && GC.points < c.entry) { sfx.error(); haptic('error'); toast(errText({ code: 'insufficient' })); return; }
    setup(how, async () => {
      b.disabled = true;
      try {
        if (how === 'invite') { const r = await GC.hokm.invite(c); await GC.refreshMe(); lobbyLoop(r.match); }
        else { const r = await GC.hokm.queueJoin(c); await GC.refreshMe(); queueLoop(r); }
      } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); }
      b.disabled = false; render();
    });
  });

  (async () => {
    try {
      const me = await GC.refreshMe();
      settings = me.settings;
      const url = new URL(location.href);
      const code = (url.searchParams.get('join') || '').trim() || (GC.startParam().startsWith('hokm_') ? GC.startParam().slice(5) : '');
      if (me.active_match && (me.active_game || 'hokm') === 'hokm' && GC.live) {
        const v = await GC.hokm.match(me.active_match, 0).catch(() => null);
        if (v && v.status === 'lobby') lobbyLoop(v.id);
        else if (v && v.status === 'playing') { store.set('hmid', v.id); $('resume').hidden = false; }
      } else if (me.active_match && GC.live) { const o = { ludo: ['منچ', 'ludo.html'], football: ['فوتبال', 'football.html'] }[me.active_game] || ['منچ', 'ludo.html']; $('resume').hidden = false; $('resume').href = o[1]; $('resume').querySelector('.muted').textContent = `یک بازی ${o[0]} نیمه‌تمام داری؛ اول آن را تمام کن.`; }
      else if (!GC.live && store.get('hmid', null)) {
        const v = await GC.hokm.match(store.get('hmid', null), 0).catch(() => null);
        if (v && v.status === 'playing') $('resume').hidden = false;
      } else if (me.queue) queueLoop(await GC.hokm.queueStatus());
      else if (code) {
        setup('join', async () => {
          try { const r = await GC.hokm.join(code); await GC.refreshMe(); lobbyLoop(r.match); }
          catch (err) { toast(errText(err)); }
        });
      }
    } catch (e) { toast(errText(e)); }
    render();
  })();
  render();
})();
</script>
</body>
</html>

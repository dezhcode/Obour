<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>AsoTas</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* خانه «کاشی‌ها»: هدر روشن (عکس، نام و سطح، زنگ، موجودی)، پرسش «چی بازی کنیم؟»، کاشی هر بازی در دنیای
   خود همان بازی (ماهوت و ورق خود بازیکن، صفحه و مهرهٔ منچ، زمین فوتبال، میز بیلیارد، نمد دیوار) که اجزایش
   از قاب بیرون زده، میزهای دیگرم، کارهای سریع و دوستان آنلاین. بازی نیمه‌تمام یک نوار شناور بالای ناوبری است. */
.page.home-page{gap:var(--space-5);padding-block-start:var(--space-2)}

/* ---------- هدر: آواتار با حلقهٔ سطح، سلام، سکهٔ براق (Arcade Lounge) ---------- */
.me-chip{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.me-ring{position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#F5C451 calc(var(--p,0)*1%),var(--ground-deep) 0)}
.me-ring .avatar{--size:40px;--ring:var(--ground)}
.me-ring b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);height:18px;padding:0 6px;border-radius:9px;background:#17161D;color:#F5C451;font-size:10.5px;line-height:18px;font-weight:800;box-shadow:0 0 0 2px var(--ground);white-space:nowrap}
.me-sub{display:block;font-size:12px;line-height:16px;color:var(--ink-muted);font-weight:600;white-space:nowrap}
.me-sub.bad{color:var(--danger)}
.me-name{display:block;font-weight:800;font-size:17px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-acts{display:flex;align-items:center;gap:var(--space-2);flex:none}
.bell{position:relative}
.bell .badge{position:absolute;top:-3px;left:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#F0465B;color:#fff;font-size:10.5px;line-height:17px;font-weight:800;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.appbar .pill.vault{background:#17161D;color:#FFE7A3;padding:4px 4px 4px 12px;font-size:15px;box-shadow:var(--depth-sm)}
.pill.vault .plus{width:32px;height:32px;background:#F5C451;color:#3A2A00;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18)}

/* ---------- بلیت میز نیمه‌کاره: لبه های بریده، خط پانچ، برگ ها یا جزء بازی از قاب بیرون ---------- */
.hm-tk{position:relative;display:block;margin-top:30px;color:#fff;-webkit-tap-highlight-color:transparent}
.hm-tk:active{transform:scale(.985)}
.tk-card{position:relative;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;box-shadow:var(--depth-md);
  -webkit-mask:radial-gradient(circle 11px at 0 66%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 66%,transparent 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 66%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 66%,transparent 97%,#000) right/51% 100% no-repeat}
.tk-card>.ra{position:absolute;inset:0}
.tk-card::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.6px);background-size:12px 12px;opacity:.5}
.tk-card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.42),rgba(0,0,0,0) 70%)}
.tk-top{position:relative;z-index:1;padding:60px 18px 14px;display:grid;gap:2px}
.tk-live{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:rgba(255,255,255,.88)}
.tk-live i{width:8px;height:8px;border-radius:50%;background:#7CF29A;box-shadow:0 0 0 4px rgba(124,242,154,.25)}
.tk-live .spinner{width:12px;height:12px;border-width:2px}
.tk-top b{font-family:var(--font-rokh);font-size:28px;line-height:36px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.tk-top small{font-size:13px;line-height:20px;color:rgba(255,255,255,.86)}
.tk-cut{position:relative;z-index:1;margin:0 22px;border-top:2px dashed rgba(255,255,255,.3)}
.tk-foot{position:relative;z-index:1;padding:12px 18px 14px;display:flex;align-items:center;gap:10px}
.home-q{font-family:var(--font-rokh);font-size:22px;line-height:30px;font-weight:900;margin:0}
.tk-foot .tk-tag{flex:1;font-size:13px;font-weight:800;color:#FFE7A3}
.tk-go{height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#17161D;display:flex;align-items:center;gap:6px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.tk-go svg{width:15px;height:15px}
.hm-tk.turn .tk-go{background:#F5C451;color:#3A2A00}
.tk-out{position:absolute;z-index:2;top:-34px;left:26px;width:150px;height:96px;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.tk-out .hk-card{font-size:52px}
.tk-out .g-art{position:absolute;top:6px;left:24px;width:78px;height:78px;border-radius:22px;display:grid;place-items:center;overflow:hidden;transform:rotate(-8deg);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.tk-out .g-art svg{display:block;width:78%;height:78%}
@media (prefers-reduced-motion:reduce){.hm-tk:active{transform:none}}

/* ---------- رفقا: حباب گفتگو ---------- */
.hm-fr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px 22px 22px 6px;background:var(--surface);box-shadow:var(--depth-sm)}
.hm-fr>a.t{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.hm-fr .faces{display:flex;flex:none}
.hm-fr .faces .avatar{--size:38px;--ring:var(--surface);margin-inline-start:-10px}
.hm-fr .faces .avatar:first-child{margin-inline-start:0}
.hm-fr .tx{flex:1;min-width:0;display:grid}
.hm-fr .tx b{font-size:14px;line-height:21px;font-weight:800}
.hm-fr .tx small{font-size:12px;line-height:18px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-fr .room{flex:none;height:40px;padding:0 14px;border-radius:20px;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;font-size:13px;font-weight:800}

/* ---------- کاشی بازی ها ---------- */
.hm-bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.hm-tl{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;min-height:112px;padding:12px 14px;border-radius:24px;color:#fff;
  box-shadow:0 14px 22px -16px var(--sh,rgba(15,63,29,.75));transition:transform .25s cubic-bezier(.3,.7,.3,1);-webkit-tap-highlight-color:transparent}
.hm-tl.hm-w2{grid-column:span 2}
.hm-tl.hm-t2{grid-row:span 2}
.hm-tl>.bg{position:absolute;inset:0;z-index:-1;border-radius:inherit;overflow:hidden}
.hm-tl>.bg>.pv,.hm-tl>.bg>.ra{position:absolute;inset:0}
.hm-tl>.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.58),rgba(0,0,0,0) 64%);pointer-events:none}
.hm-tl>b{position:relative;font-family:var(--font-rokh);font-size:22px;line-height:28px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.hm-tl>small{position:relative;font-size:11.5px;line-height:17px;font-weight:600;opacity:.92}
.hm-tl.hm-w2.hm-big>b{font-size:30px;line-height:38px}
.hm-tl:active{transform:scale(.98)}
.hm-tl .hm-bdg{position:absolute;top:10px;right:10px;z-index:4;height:22px;padding:0 8px;border-radius:8px;font-size:11px;line-height:22px;font-weight:800}
.hm-bdg.hot{background:var(--gold);color:var(--gold-ink)}
.hm-bdg.new{background:rgba(255,255,255,.94);color:#161922}
.hm-bdg.open{background:#3DDC84;color:#08331B}
/* اجزای بازی که از قاب بیرون زده اند */
.hm-tl .hm-out{position:absolute;z-index:3;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));transition:transform .3s cubic-bezier(.3,.7,.3,1)}
.hm-tl .hm-out img,.hm-tl .hm-out svg{display:block;width:100%;height:auto;overflow:visible}
@media (hover:hover){.hm-tl:hover{transform:translateY(-3px)}.hm-tl:hover .hm-out{transform:translateY(-5px) rotate(-3deg)}}
.hm-tl .hm-fan{position:absolute;inset:0;z-index:3;pointer-events:none}
.hm-tl .hm-fan .hk-card{font-size:46px;filter:drop-shadow(0 6px 7px rgba(0,0,0,.28))}
.hm-tl .hm-ludo{position:absolute;left:-14px;bottom:62px;width:112px;transform:rotate(-10deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.hm-tl .hm-ludo svg{display:block;width:100%;height:auto;border-radius:12px}
/* تکهٔ دیوار و مهرهٔ دیوار (همان رنگ و نور خود بازی) */
.hm-dvw{display:block;width:108px;height:9px;border-radius:99px;background:linear-gradient(180deg,#C9DCFF,#4C8DFF 42%,#2B57A8);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.hm-dvp{display:block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.95),rgba(255,255,255,0) 42%),conic-gradient(from 200deg,#8e98a1,#f1f4f7,#848e96,#e2e7ec,#8e98a1);position:relative}
.hm-dvp::after{content:"";position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 36% 26%,rgba(255,255,255,.75) 0 10%,rgba(255,255,255,0) 34%),radial-gradient(circle at 50% 62%,#FF8A96,#FF5A6A 45%,#C93447)}
.hm-tl.hm-soon{grid-column:span 2;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;color:var(--ink);background:none;box-shadow:none;border:1.5px dashed color-mix(in srgb,var(--ink-muted) 40%,transparent);padding:10px 12px}
.hm-tl.hm-soon:active{transform:none}
.hm-tl.hm-soon .hm-lt{display:flex;gap:3px}
.hm-tl.hm-soon .hm-lt span{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-rokh);font-size:13px;font-weight:900}
.hm-tl.hm-soon .t{flex:1;display:grid;min-width:0}
.hm-tl.hm-soon .t b{font-family:var(--font-rokh);font-size:16px;font-weight:900}
.hm-tl.hm-soon .t small{font-size:11.5px;color:var(--ink-muted)}
.hm-notify{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding-inline:12px;position:relative;border-radius:var(--radius-pill);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:12px;font-weight:800;white-space:nowrap}
.hm-notify::after{content:"";position:absolute;inset:-4px -2px}
.hm-notify svg{width:14px;height:14px}
.hm-notify.on{background:var(--success-tint);color:var(--success);box-shadow:none}

/* ---------- میزهای دیگرم ---------- */
.tables{display:grid;gap:var(--space-2)}
.tbl{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-2);padding-inline-end:var(--space-3);
  border-radius:18px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden;animation:tblIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.tbl:active{transform:scale(.985)}
.tbl.turn{box-shadow:0 0 0 2px var(--acc)}
.tbl .g-art{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.tbl .g-art svg{display:block;width:76%;height:76%}
.tbl-txt{display:grid;gap:2px;min-width:0}
.tbl-txt b{display:flex;align-items:center;gap:6px;font-family:var(--font-rokh);font-size:15px;line-height:22px;font-weight:900}
.tbl-tag{font-family:var(--font-peyda);font-size:11px;line-height:16px;font-weight:800;padding:0 7px;border-radius:var(--radius-pill);background:var(--surface-sunk);color:var(--ink-muted)}
.tbl-st{display:flex;align-items:center;gap:6px;font-size:12px;line-height:18px;color:var(--ink-muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-st .live{width:7px;height:7px;border-radius:50%;background:#2FC584;flex:none}
.tbl-st .spinner{width:12px;height:12px;border-width:2px}
.tbl-st .myturn{color:var(--acc);font-weight:900}
.tbl-go{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding-inline:12px;border-radius:12px;background:var(--surface-sunk);color:var(--ink);font-size:13px;font-weight:800}
.tbl.turn .tbl-go{background:var(--acc);color:var(--acc-ink)}
.tbl-go svg{width:15px;height:15px}
@keyframes tblIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@media (prefers-reduced-motion:reduce){.tbl{animation:none}.hm-tl,.hm-tl .hm-out{transition:none}}

.sec-head h2{display:flex;align-items:center;gap:8px}
.note-bar{display:flex;align-items:center;gap:var(--space-2);background:var(--acc-tint);color:var(--acc-deep);border-radius:var(--radius-lg);padding:var(--space-3);font-weight:800;font-size:13.5px;line-height:22px}
.note-bar svg{width:20px;height:20px;flex:none}
.note-bar.bad{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.adm-link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-3)}
.adm-link .ic-box{background:var(--obour-night);color:var(--obour-aqua);font-size:20px}
.adm-link b{display:block;font-weight:900}
.adm-link small{display:block;font-size:12px;color:var(--ink-muted)}
/* برگهٔ اعلان ها */
.ntf{display:grid;gap:var(--space-2)}
.ntf a,.ntf div{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:10px 12px;border-radius:var(--radius-lg);background:var(--surface-sunk)}
.ntf .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.ntf .ic svg{width:21px;height:21px}
.ntf b{display:block;font-weight:800;font-size:14px;line-height:21px}
.ntf small{display:block;font-size:12px;line-height:18px;color:var(--ink-muted)}
.name-hint{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;padding:14px;border-radius:var(--radius-lg);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nh-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acc-tint);color:var(--acc)}
.nh-ic svg{width:22px;height:22px}
.nh-tx{display:grid;min-width:0}
.nh-tx small{font-size:12.5px;line-height:18px;color:var(--ink-muted)}
.nh-tx b{font-size:18px;line-height:26px;font-weight:900;justify-self:start;overflow:hidden;text-overflow:ellipsis}
.nh-acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nh-acts .btn{min-height:44px}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span lang="en" dir="ltr">AsoTas</span></div>
  <div class="appbar-in">
    <a class="me-chip" href="profile.html" aria-label="پروفایل من">
      <span class="me-ring" id="meRing" style="--p:0"><span id="meAv"></span><b id="meLv">…</b></span>
      <span style="min-width:0"><span class="me-sub" id="meSub">سلام</span><span class="me-name" id="meName">سلام داش!</span></span>
    </a>
    <div class="hd-acts">
      <button class="icon-btn bell" id="bell" aria-label="اعلان‌ها"><i data-ic="bell"></i><span class="badge" id="bellN" hidden></span></button>
      <a class="pill vault" href="shop.html" aria-label="کیف سکه"><span data-coin></span><span class="num" data-bal>…</span><span class="plus"><i data-ic="plus"></i></span></a>
    </div>
  </div>
</header>
<main class="page home-page" id="homePage">
  <div class="note-bar" id="noteBar" hidden><span id="noteIc"></span><span id="noteTx"></span></div>
  <a class="card card-link adm-link" id="admLink" href="admin.html" hidden><span class="ic-box">⚙︎</span><span><b>پنل مدیریت</b><small>کاربران، میزها، پیام همگانی و تنظیمات</small></span><span aria-hidden="true">‹</span></a>

  <section class="name-hint" id="nameHint" aria-label="یوزرنیم تو" hidden>
    <span class="nh-ic"><i data-ic="user"></i></span>
    <span class="nh-tx"><small>اسمت تو بازی اینه</small><b class="uname" id="nhName"></b></span>
    <span class="nh-acts"><button class="btn btn-light btn-sm" id="nhOk">همین خوبه</button><button class="btn btn-sm" id="nhEdit">عوضش کن</button></span>
  </section>

  <div id="hero" hidden></div>

  <section class="hm-daily" id="daily" aria-label="جایزهٔ روزانه" hidden></section>

  <section aria-labelledby="hGames">
    <div class="sec-head" style="margin:0"><h1 class="home-q" id="hGames">امشب چی بازی کنیم؟</h1><a href="games.html">همهٔ بازی‌ها</a></div>
    <div class="hm-bento" id="games"></div>
  </section>

  <section id="tablesSec" aria-labelledby="hTables" hidden>
    <div class="sec-head"><h2 id="hTables">میزای دیگه‌ت</h2></div>
    <div class="tables" id="tables"></div>
  </section>

  <div class="hm-fr" id="rankCard">
    <a class="t" href="friends.html" aria-label="دوستان"><span class="faces" id="rankFaces"></span><span class="tx"><b id="rankT">دوستان</b><small id="rankS">یه لحظه…</small></span></a>
    <a class="room" href="room.html" id="invite">اتاق</a>
  </div>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script>
(() => {
  const { fa, FD, toast, face, icon, errText, store, sheet, sheetHead, GAME_ART } = GC;
  const C = window.GCCards;
  const $ = id => document.getElementById(id);
  GC.back(null);
  // آمده از لینک میز گروه تلگرام (t.me/<bot>?startapp=hokm_CODE): مستقیم سر همان میز، فقط یک بار در هر نشست
  const sp = GC.startParam(), spm = sp.match(/^(hokm|ludo|football|billiard|divar|esmfamil|lashgar|snakes)_([A-Za-z0-9]{4,12})$/);
  let spSeen = false; try { spSeen = sessionStorage.getItem('gc_sp') === sp; sessionStorage.setItem('gc_sp', sp); } catch (e) {}
  if (spm && !spSeen) { location.replace(`${spm[1]}-lobby.html?join=${spm[2]}`); return; }
  // لینک اتاق در تلگرام: startapp=room_CODE
  const spr = sp.match(/^room_([A-Za-z0-9]{4,12})$/);
  if (spr && !spSeen) { location.replace(`room.html?join=${spr[1]}`); return; }
  // دکمهٔ «دیدن بازی» کارت گروه: startapp=w_hokm_MATCHID ← صفحهٔ بازی در حالت تماشا (اگر خودش بازیکن باشد، بازی خودش)
  const spw = sp.match(/^w_(hokm|ludo|football|billiard|divar|esmfamil|lashgar|snakes)_([A-Za-z0-9]{6,16})$/);
  if (spw && !spSeen) { location.replace(`${spw[1]}.html?watch=${spw[2]}`); return; }
  let me = null, style = { table: 'a', cards: 'a' }, notify = [], tables = [];

  /* ---------- کاشی هر بازی: دنیای همان بازی و اجزایی که از قاب بیرون زده ---------- */
  const PV = 'static/previews/';
  const TILE = {
    // ماهوت و طرح ورقی که خود بازیکن انتخاب کرده؛ سه برگ از بالای کاشی بیرون زده اند
    hokm: () => ({ cls: `hm-w2 hm-big cards-${style.cards}`, sh: 'rgba(15,63,29,.75)', bg: `<span class="ra felt tbl-${style.table}"></span>`,
      out: `<span class="hm-fan" aria-hidden="true">${C.face(10 + 13 * 2, '', 'left:16px;top:-30px;transform:rotate(-14deg)')}${C.face(11 + 13, '', 'left:58px;top:-40px;transform:rotate(-1deg)')}${C.face(12, '', 'left:100px;top:-30px;transform:rotate(13deg)')}</span>` }),
    // صفحهٔ خود منچ روی سبز شب؛ مهرهٔ آبی و زرد روی لبهٔ کاشی ایستاده اند
    ludo: () => ({ cls: 'hm-t2', sh: 'rgba(11,36,28,.8)', bg: `<span class="ra" style="background:radial-gradient(90% 90% at 50% 35%,#1F4A37,#0F2A22)"><span class="hm-ludo">${GC.boardArt()}</span></span>`,
      out: `<span class="hm-out" style="right:18px;top:-30px;width:40px">${GC.pawn('blue')}</span><span class="hm-out" style="right:58px;top:-15px;width:29px">${GC.pawn('yellow')}</span>` }),
    // زمین، مهره ها و توپ واقعی فوتبال؛ مهرهٔ عقاب ها از گوشه بیرون زده
    football: () => ({ cls: '', sh: 'rgba(29,90,37,.8)', bg: GCPreview.html('football'), out: `<span class="hm-out" style="left:-12px;top:-14px;width:46px"><img src="${PV}fb-disc-eagles.webp" alt=""></span>` }),
    billiard: () => ({ cls: '', sh: 'rgba(74,42,24,.8)', bg: GCPreview.html('billiard'), out: `<span class="hm-out" style="left:-9px;bottom:-11px;width:30px"><img src="${PV}bl-ball-8.webp" alt=""></span>` }),
    divar: () => ({ cls: 'hm-w2', sh: 'rgba(10,42,28,.8)', bg: GCPreview.html('divar'), out: '<span class="hm-out" style="left:44px;top:-6px"><i class="hm-dvw"></i></span><span class="hm-out" style="left:-12px;top:-16px"><i class="hm-dvp"></i></span>' }),
    // برگ دفتر اسم‌فامیل؛ خودکار قرمز داور از لبهٔ کاشی بیرون زده
    esmfamil: () => ({ cls: 'hm-w2', sh: 'rgba(62,41,18,.8)', bg: GCPreview.html('esmfamil'), out: '<span class="hm-out" style="left:-14px;top:-12px;width:118px;transform:rotate(-14deg)"><svg viewBox="0 0 120 20"><rect x="14" y="5" width="92" height="10" rx="5" fill="#C8323C"/><rect x="84" y="5" width="22" height="10" rx="4" fill="#8E1B26"/><path d="M14 5L1 10l13 5z" fill="#F2D8B0"/><path d="M5 8.4L1 10l4 1.6z" fill="#2A2F3A"/><rect x="40" y="3" width="3" height="14" rx="1.5" fill="#E8C76A"/></svg></span>' }),
    // برگهٔ جنگ کاغذی روی میز مدرسه؛ مداد آبی از پایین کاشی بیرون زده
    lashgar: () => ({ cls: 'hm-w2', sh: 'rgba(78,48,22,.8)', bg: GCPreview.html('lashgar'), out: '<span class="hm-out" style="left:-10px;bottom:-12px;width:112px;transform:rotate(12deg)"><svg viewBox="0 0 120 20"><path d="M2 10L22 3.5V16.5Z" fill="#E9C9A0"/><path d="M2 10L8.6 7.9V12.1Z" fill="#1A4FB0"/><rect x="22" y="3.5" width="88" height="13" fill="#1F5FC8"/><rect x="22" y="5.5" width="88" height="3" fill="#fff" opacity=".24"/><rect x="104" y="3.5" width="12" height="13" rx="2" fill="#E8B4B8"/><rect x="100" y="3.5" width="4" height="13" fill="#C9A15A"/></svg></span>' }),
    // صفحهٔ شب جنگل؛ مهرهٔ زرد از گوشهٔ کاشی بیرون زده
    snakes: () => ({ cls: 'hm-w2', sh: 'rgba(7,13,28,.8)', bg: GCPreview.html('snakes'), out: '<span class="hm-out" style="left:42%;top:-20px;width:34px"><svg viewBox="0 0 40 40"><ellipse cx="20" cy="36" rx="13" ry="4" fill="rgba(0,0,0,.4)"/><path d="M8 34Q8 20 20 20T32 34Z" fill="#E0A800"/><path d="M10 33Q10 22 20 22T30 33Z" fill="#FFC531"/><circle cx="20" cy="13" r="9" fill="#FFC531" stroke="#fff" stroke-width="1.6"/><circle cx="17" cy="10" r="3.2" fill="#fff" opacity=".75"/></svg></span>' }),
  };
  const ESM = '<span class="hm-lt" aria-hidden="true"><span style="background:#FFA552;color:#3A2000;transform:rotate(-8deg)">ب</span><span style="background:#FF7A85;color:#3A0A10;transform:rotate(6deg)">م</span><span style="background:#8E7CF8;color:#fff;transform:rotate(-3deg)">الف</span></span>';

  /* ---------- یوزرنیم تازه: یک بار نشان داده می شود تا کاربر ببیند یا عوضش کند ---------- */
  function renderNameHint() {
    const p = me.player;
    $('nameHint').hidden = !p.name_hint;
    $('nhName').textContent = p.name || '';
  }
  async function hideHint() { $('nameHint').hidden = true; me.player.name_hint = false; try { await GC.data.nameSeen(); } catch (e) {} }
  $('nhOk').onclick = hideHint;
  $('nhEdit').onclick = () => GC.editName(me.player, r => { Object.assign(me.player, r); renderHeader(); hideHint(); });

  /* ---------- هدر ---------- */
  function renderHeader() {
    const p = me.player, L = GC.level(p);
    $('meAv').innerHTML = face(p, 'var(--surface)');
    const nm = document.createElement('bdi'); nm.className = 'uname'; nm.textContent = p.name || '';
    $('meName').replaceChildren(nm);
    const h = new Date().getHours();
    $('meSub').textContent = h < 5 ? 'شب بخیر' : h < 12 ? 'صبح بخیر' : h < 17 ? 'روز بخیر' : h < 20 ? 'عصر بخیر' : 'شب بخیر';
    const r = $('meRing'); r.style.setProperty('--p', Math.round(L.frac * 100)); r.title = `${FD(L.left)} تجربه تا سطح ${FD(L.lv + 1)}`;
    $('meLv').textContent = `سطح ${FD(L.lv)}`;
  }
  // اعلان ها: میزی که نوبت توست، میزی که منتظر توست و پیام مدیریت
  function alerts() {
    const out = [];
    for (const t of tables) {
      const g = GC.GAMES.find(x => x.id === t.game) || GC.GAMES[2];
      if (t.kind === 'playing' && t.my_turn) out.push({ href: g.id + '.html', game: t.game, id: t.id, k: t.kind, ic: 'clock', c: 'var(--acc)', bg: 'var(--acc-tint)', t: `نوبت توئه تو ${g.name}`, s: 'برگرد سر میز تا وقتت نسوخته' });
      else if (t.kind === 'lobby') out.push({ href: g.href, ic: 'users', c: '#1F6B3B', bg: '#E3F1E8', t: `میز ${g.name} منتظرته`, s: `${FD(t.found)} از ${FD(t.need)} نفر نشستن` });
    }
    if (me && me.notice) out.push({ ic: 'bell', c: 'var(--ink-muted)', bg: 'var(--surface-sunk)', t: 'پیام از طرف تاسی', s: me.notice });
    return out;
  }
  function renderBell() {
    const n = alerts().filter(a => a.ic !== 'users').length, b = $('bellN');
    b.hidden = !n; b.textContent = FD(n);
    $('bell').setAttribute('aria-label', n ? `اعلان‌ها ${FD(n)} تا تازه` : 'اعلان‌ها');
  }
  $('bell').onclick = () => {
    const list = alerts();
    const sh = sheet(`${sheetHead('اعلان‌ها')}<div class="ntf">${list.length ? list.map(a => `<${a.href ? `a href="${a.href}" data-g="${a.game || ''}" data-id="${a.id || ''}" data-k="${a.k || ''}"` : 'div'}><span class="ic" style="background:${a.bg};color:${a.c}">${icon(a.ic)}</span><span><b>${a.t}</b><small>${a.s}</small></span><span>${a.href ? icon('fwd') : ''}</span></${a.href ? 'a' : 'div'}>`).join('')
      : '<p class="hint">فعلاً خبری نیست داش هر وقت نوبتت شد یا یه میز منتظرت بود اینجا می‌بینی</p>'}</div>`);
    sh.querySelectorAll('a[data-id]').forEach(a => a.addEventListener('click', () => { const g = GC.GAMES.find(x => x.id === a.dataset.g); if (a.dataset.k === 'playing' && a.dataset.id && g) store.set(KEY[g.id], a.dataset.id); }));
  };

  /* ---------- کارت بزرگ بالا: ادامهٔ بازی یا حکم ---------- */
  const KEY = { hokm: 'hmid', football: 'fmid', ludo: 'mid', billiard: 'bmid', divar: 'dmid', esmfamil: 'emid', lashgar: 'lgmid', snakes: 'snmid' };
  function heroTable() {
    const playing = tables.filter(t => t.kind === 'playing');
    return playing.find(t => t.my_turn) || playing[0] || tables[0] || null;
  }
  function stateLine(t) {
    if (t.kind === 'queue') return { k: 'دنبال حریف', h: 'تو صف بازی', p: `${FD(t.found)} از ${FD(t.need)} نفر پیدا شد` };
    if (t.kind === 'lobby') return { k: 'میز دوستانه', h: t.host ? 'منتظر رفیقاتی' : 'منتظر بقیه', p: `${FD(t.found)} از ${FD(t.need)} نفر نشستن` };
    const sc = t.score ? `ما ${FD(t.score[0])} – ${FD(t.score[1])} اونا · تا ${FD(t.target)}` : t.left != null ? `تا مقصد ${FD(t.left)} قدم مونده` : t.pos != null ? `خانهٔ ${FD(t.pos)} از ۱۰۰`
      : t.alive ? `${FD(t.alive[0])} نیروی سالم داری و حریف ${FD(t.alive[1])}` : t.phase === 'draw' ? 'دارید ارتشتون رو می‌چینید' : 'بازی داره پیش می‌ره';
    return { k: 'بازی نصفه‌کاره', h: t.my_turn ? 'نوبت توئه!' : 'بازی داره پیش می‌ره', p: sc };
  }
  // بلیت بالای خانه: میزی که نوبت توست، یا بازی در جریان، یا صف و میز دوستانه
  function renderHero() {
    const c = $('hero'), t = heroTable();
    if (!t) { c.hidden = true; c.innerHTML = ''; return; }
    const g = GC.GAMES.find(x => x.id === t.game) || GC.GAMES[2], st = stateLine(t);
    const href = t.kind === 'playing' ? g.id + '.html' : g.href, c2 = t.cfg || {};
    const bg = g.id === 'hokm' ? `<span class="ra felt tbl-${style.table}"></span>` : `<span class="ra ${g.tint}"></span>`;
    const out = g.id === 'hokm'
      ? `<span class="tk-out cards-${style.cards}">${C.face(10 + 13 * 2, '', 'left:8px;top:6px;transform:rotate(-14deg)')}${C.face(11 + 13, '', 'left:46px;top:-4px;transform:rotate(-1deg)')}${C.face(12, '', 'left:84px;top:6px;transform:rotate(13deg)')}</span>`
      : `<span class="tk-out"><span class="g-art ${g.tint}">${GAME_ART[g.id]()}</span></span>`;
    c.hidden = false;
    c.innerHTML = `<a class="hm-tk${t.my_turn ? ' turn' : ''}" href="${href}" data-k="${t.kind}" data-g="${g.id}" data-id="${t.id || ''}">
      ${out}<span class="tk-card">${bg}
        <span class="tk-top"><span class="tk-live">${t.kind === 'playing' ? '<i></i>' : '<span class="spinner"></span>'}${t.my_turn ? 'زنده، نوبت توئه' : st.k}</span><b>${g.name}</b><small>${st.p}</small></span>
        <span class="tk-cut"></span>
        <span class="tk-foot"><span class="tk-tag">${c2.mode === 'stake' ? `ورودی ${fa(c2.entry)} سکه` : 'میز آزاد'}</span><span class="tk-go">${t.my_turn ? 'بزن بریم' : 'برگرد سر میز'}${icon('fwd')}</span></span>
      </span></a>`;
    c.firstElementChild.addEventListener('click', e => { const a = e.currentTarget; if (a.dataset.k === 'playing' && a.dataset.id) store.set(KEY[a.dataset.g], a.dataset.id); GC.haptic('light'); });
  }

  /* ---------- میزهای دیگر ---------- */
  function tableHtml(t) {
    const g = GC.GAMES.find(x => x.id === t.game) || GC.GAMES[2], c = t.cfg || {}, st = stateLine(t);
    const tag = c.mode === 'stake' ? `ورودی ${fa(c.entry)}` : 'آزاد';
    const href = t.kind === 'playing' ? g.id + '.html' : g.href;
    return `<a class="tbl${t.my_turn ? ' turn' : ''}" href="${href}" data-g="${g.id}" data-id="${t.id || ''}" data-k="${t.kind}">
      <span class="g-art ${g.tint}">${GAME_ART[g.id]()}</span>
      <span class="tbl-txt"><b>${g.name}<span class="tbl-tag">${tag}</span></b><span class="tbl-st">${t.kind === 'playing' ? '<span class="live"></span>' : '<span class="spinner"></span>'}${t.my_turn ? `<span class="myturn">${st.h}</span>` : ''}${st.p}</span></span>
      <span class="tbl-go">${t.my_turn ? 'بازی کن' : 'برگرد'}<i data-ic="fwd"></i></span></a>`;
  }
  $('tables').addEventListener('click', e => {
    const a = e.target.closest('.tbl'); if (!a) return;
    if (a.dataset.k === 'playing' && a.dataset.id) store.set(KEY[a.dataset.g], a.dataset.id);
    GC.haptic('light');
  });

  /* ---------- کاشی بازی ها ---------- */
  function renderGames() {
    const open = new Set(tables.map(t => t.game));
    const badge = { hokm: '<span class="hm-bdg hot">محبوب</span>', football: '<span class="hm-bdg new">تازه</span>', billiard: '<span class="hm-bdg new">تازه</span>', divar: '<span class="hm-bdg new">تازه</span>', snakes: '<span class="hm-bdg new">تازه</span>', esmfamil: '<span class="hm-bdg new">تازه</span>', lashgar: '<span class="hm-bdg new">تازه</span>' };
    // خانه فقط چهار بازی پرطرفدار را نشان می‌دهد؛ بقیه در صفحهٔ بازی‌ها
    const HOME = ['hokm', 'ludo', 'football', 'billiard'];
    $('games').innerHTML = GC.GAMES.filter(g => HOME.includes(g.id)).map(g => {
      if (g.soon) return `<div class="hm-tl hm-soon">${ESM}<span class="t"><b>${g.name}</b><small>به‌زودی میاد</small></span><button class="hm-notify" data-notify="${g.id}"></button></div>`;
      const T = (TILE[g.id] || TILE.divar)(), b = open.has(g.id) ? '<span class="hm-bdg open">میز باز داری</span>' : (badge[g.id] || '');
      return `<a class="hm-tl ${T.cls}" href="${g.href}" style="--sh:${T.sh}"><span class="bg" aria-hidden="true">${T.bg}</span>${T.out}${b}<b>${g.name}</b><small>${g.sub}</small></a>`;
    }).join('');
    document.querySelectorAll('[data-notify]').forEach(b => {
      const sync = () => { const on = notify.includes(b.dataset.notify); b.classList.toggle('on', on); b.innerHTML = on ? icon('check', 3) + 'خبرت می‌کنیم' : icon('bell', 2.6) + 'خبرم کن'; };
      sync();
      b.onclick = async () => {
        try { const r = await GC.data.notify(b.dataset.notify); notify = r.on ? [...notify, b.dataset.notify] : notify.filter(x => x !== b.dataset.notify); sync(); if (r.on) toast('آماده که شد ربات خبرت می‌کنه'); }
        catch (e) { toast(errText(e)); }
      };
    });
  }

  function renderAll() {
    renderHero();
    const rest = tables.filter(t => t !== heroTable());
    $('tablesSec').hidden = !rest.length;
    $('tables').innerHTML = rest.map(tableHtml).join('');
    renderGames(); renderBell(); GC.mount(); GCPreview.watch($('games'));
  }
  let sig = '';
  function setTables(list) { const s = JSON.stringify(list); if (s === sig) return; sig = s; tables = list; renderAll(); }

  renderAll();
  let polling = false;
  async function load() {
    try {
      me = await GC.refreshMe();
      style = Object.assign({ table: 'a', cards: 'a' }, me.style || {});
      notify = me.notify || [];
      renderHeader(); renderNameHint();
      // برنامهٔ اندروید: بار اول ورود با تلگرام یا ایمیل (یا فعلاً مهمون)
      if (GC.app && me.account && !GC.store.get('welcome', false)) {
        GC.store.set('welcome', true);
        if (me.account.kind === 'guest') GC.login({ welcome: true, guestGames: me.player.games });
      }
      sig = ''; setTables(me.tables || []);
      // جایزهٔ روزانه فقط تا وقتی امروز گرفته نشده رو خونه دیده می شه (بعدش تو فروشگاه)
      if (me.daily && !me.daily.claimed) { $('daily').hidden = false; GC.dailyMount($('daily'), me.daily); } else $('daily').hidden = true;
      const note = me.banned ? 'شرمنده داش حسابت تو AsoTas بسته شده اگه پیگیری می‌خوای به پشتیبانی عبور پیام بده'
        : me.maintenance ? 'داریم آپدیت می‌کنیم و تا چند دقیقه میز تازه ساخته نمی‌شه' : (me.notice || '');
      if (note) { $('noteTx').textContent = note; $('noteIc').innerHTML = icon(me.banned ? 'shield' : me.maintenance ? 'clock' : 'bell'); $('noteBar').hidden = false; $('noteBar').classList.toggle('bad', !!me.banned); }
      $('admLink').hidden = !me.is_admin;
      if (!polling) { polling = true; setInterval(async () => { if (document.hidden || !GC.isActive('home')) return; try { const m = await GC.data.me(); me = Object.assign(me, m); setTables(m.tables || []); } catch (e) {} }, 5000); }
    } catch (e) { toast(errText(e)); }
    // دوستان آنلاین (رده بندی حالا در صفحهٔ هر بازی است)
    try {
      const fr = await GC.data.friends(), on = fr.friends.filter(f => f.online);
      $('rankFaces').innerHTML = (on.length ? on : fr.friends).slice(0, 3).map(f => face(f)).join('');
      $('rankT').textContent = on.length ? 'رفیقای آنلاین' : 'دوستان';
      $('rankS').textContent = on.length ? `${FD(on.length)} نفر الان آنلاینن` : fr.friends.length ? `${FD(fr.friends.length)} رفیق داری، الان کسی آنلاین نیست` : 'رفیقاتو با یوزرنیمشون اضافه کن';
    } catch (e) { $('rankS').textContent = errText(e); }
    GC.mount();
  }
  GC.page(load);
  GC.nav('home'); GC.mount();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<style>
/* خانه «سالن شب»: هدر با حلقهٔ سطح، کارت بزرگ بالا (ادامهٔ بازی نیمه‌تمام یا حکم)، کارهای سریع،
   کاشی بازی ها با اجزای واقعی هر بازی (ورق و میز خود بازیکن، مهرهٔ فلزی و توپ، صفحه و مهرهٔ منچ)
   و جایگاه بازیکن در رده‌بندی هفته. */
.page.home-page{gap:var(--space-5);padding-block-start:var(--space-3)}

/* ---------- هدر: عکس با حلقهٔ سطح، سلام و پیشرفت، زنگ اعلان، موجودی ---------- */
.me-chip{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.lv{position:relative;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(255,255,255,.12) 0)}
.lv .avatar{--size:46px;--ring:#0E1E19}
.lv b{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);min-width:20px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--gold);color:var(--gold-ink);font-size:11px;line-height:18px;font-weight:900;text-align:center;box-shadow:0 0 0 2px #0E1E19}
.me-name{display:block;font-weight:900;font-size:16.5px;line-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{display:flex;align-items:center;gap:6px;font-size:11.5px;line-height:17px;color:var(--ink-muted);white-space:nowrap}
.me-sub .bar{width:56px;height:5px;flex:none;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.me-sub .bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.me-sub.bad{color:var(--danger)}
.hd-acts{display:flex;align-items:center;gap:var(--space-2);flex:none}
.bell{position:relative;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bell .badge{position:absolute;top:2px;left:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#F0505F;color:#fff;font-size:10.5px;line-height:17px;font-weight:800;text-align:center;box-shadow:0 0 0 2px #0F201B}
.appbar .pill{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:4px 6px 4px 12px;font-size:15px}
.appbar .pill .plus{background:var(--gold);color:var(--gold-ink)}

/* ---------- کارت بزرگ بالا ---------- */
.hero{position:relative;min-height:178px;border-radius:26px;overflow:hidden;padding:var(--space-4);display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-3);
  box-shadow:inset 0 0 0 1px rgba(245,196,81,.35),0 14px 30px rgba(0,0,0,.4)}
.hero.felt{box-shadow:var(--rim,none),inset 0 0 0 1px rgba(245,196,81,.35),inset 0 0 30px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.4)}
.hero .txt{position:relative;z-index:2;display:grid;gap:3px;max-width:58%}
.hero .kick{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:rgba(0,0,0,.3);font-size:11.5px;font-weight:700}
.hero .kick i{width:7px;height:7px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.2)}
.hero h1{font-size:24px;line-height:34px;font-weight:900}
.hero p{font-size:12.5px;line-height:20px;color:rgba(255,255,255,.85)}
.hero .acts{position:relative;z-index:2;display:flex;gap:var(--space-2)}
.hero .go{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;background:var(--gold);color:var(--gold-ink);font-size:15px;font-weight:900;box-shadow:0 5px 0 #B9821A}
.hero .go:active{transform:translateY(2px);box-shadow:0 3px 0 #B9821A}
.hero .go svg{width:18px;height:18px}
.hero .glass{display:inline-flex;align-items:center;height:46px;padding:0 16px;border-radius:23px;background:rgba(0,0,0,.25);color:#fff;font-size:14px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hero .art{position:absolute;inset-inline-end:8px;top:10px;width:150px;height:130px;z-index:1;pointer-events:none}
.hero .art .ra{position:absolute;inset:0}

/* ---------- کارهای سریع ---------- */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.qa{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);text-align:center}
.qa:active{transform:scale(.97)}
.qa .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.qa .ic svg{width:22px;height:22px}
.qa b{font-size:12.5px;line-height:18px;font-weight:800}
.qa small{font-size:10.5px;line-height:15px;color:var(--ink-muted)}

/* ---------- کاشی بازی ها با اجزای واقعی ---------- */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gt{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:156px;padding:12px;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 20px -10px rgba(0,0,0,.6)}
a.gt:active{transform:scale(.98)}
.gt>b{position:relative;z-index:2;font-family:var(--font-rokh);font-size:17px;line-height:24px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.gt>small{position:relative;z-index:2;font-size:11px;line-height:16px;color:rgba(255,255,255,.85)}
.gt::after{content:"";position:absolute;inset:auto 0 0;height:62%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45));z-index:1;pointer-events:none}
.gt .bdg{position:absolute;top:10px;right:10px;z-index:3;height:20px;padding:0 8px;border-radius:10px;font-size:10.5px;line-height:20px;font-weight:800}
.bdg.hot{background:var(--gold);color:var(--gold-ink)}
.bdg.new{background:#4D8DFF;color:#fff}
.bdg.open{background:#3DDC84;color:#08331B}
.bdg.soon{background:rgba(255,255,255,.14);color:#E6EEEA}
.gt .ra{position:absolute;inset:0;z-index:0}
.gt.soon{background:var(--surface)}
.gt .notify{position:absolute;left:10px;top:10px;z-index:3}
.notify{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding-inline:10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.12);color:var(--ink);font-size:11.5px;font-weight:800;white-space:nowrap}
.notify svg{width:14px;height:14px}
.notify.on{background:var(--success-tint);color:var(--success)}
/* حکم: ماهوت و ورق خود بازیکن */
.ra-hokm .hk-card{font-size:34px}
/* فوتبال: زمین چمن، مهره های فلزی و توپ */
.ra-fb{background:repeating-linear-gradient(90deg,#2F8E40 0 20px,#2A7F39 20px 40px)}
.ra-fb::before{content:"";position:absolute;left:50%;top:22px;width:62px;height:62px;margin-left:-31px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.ra-fb::after{content:"";position:absolute;left:0;right:0;top:52px;border-top:2px solid rgba(255,255,255,.55)}
.ra-fb .fd{position:absolute;border-radius:50%;box-sizing:border-box;padding:calc(var(--d)*.11);z-index:2;
  background:radial-gradient(circle,transparent 61%,rgba(0,0,0,.22) 64%,transparent 68%),conic-gradient(from 215deg,#fff,#aab2bb 55deg,#eef1f4 115deg,#7a848f 190deg,#d9dee3 250deg,#9aa3ad 310deg,#fff);
  box-shadow:inset 0 calc(var(--d)*.045) calc(var(--d)*.03) rgba(255,255,255,.95),inset 0 calc(var(--d)*-.05) calc(var(--d)*.05) rgba(0,0,0,.4),0 calc(var(--d)*.025) 0 #a2aab3,0 calc(var(--d)*.05) 0 #7c858e,0 calc(var(--d)*.07) 0 #59626b,calc(var(--d)*.03) calc(var(--d)*.12) calc(var(--d)*.12) rgba(0,0,0,.45)}
.ra-fb .fd .in{position:relative;display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(30,36,44,.6)}
.ra-fb .fd .in svg{display:block;width:100%;height:100%}
.ra-fb .fd .in::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 60% 45% at 34% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%)}
.ra-fb .ball{position:absolute;z-index:3;filter:drop-shadow(2px 4px 3px rgba(0,0,0,.45))}
/* منچ: صفحهٔ واقعی با پرسپکتیو و مهره ها */
.ra-ludo{background:linear-gradient(160deg,#3A2F78,#231C4D)}
.ra-ludo .bd{position:absolute;left:50%;top:10px;width:92px;margin-left:-46px;transform:perspective(420px) rotateX(28deg) rotateZ(-8deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.ra-ludo .bd svg{display:block;width:100%;border-radius:10px}
.ra-ludo .pw{position:absolute;z-index:2;width:26px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.ra-ludo .pw svg{display:block;width:100%}
/* اسم فامیل */
.ra-esm{display:flex;justify-content:flex-start;gap:6px;padding:48px 12px 0}
.ra-esm span{width:38px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-rokh);font-size:22px;font-weight:900;box-shadow:0 6px 12px rgba(0,0,0,.3)}

/* ---------- رده‌بندی هفته ---------- */
.rank-card{display:flex;align-items:center;gap:var(--space-3);padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.rank-card:active{transform:scale(.985)}
.rank-card .pos{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(245,196,81,.16);color:var(--gold);font-family:var(--font-rokh);font-size:16px;font-weight:900}
.rank-card .t{flex:1;min-width:0;display:grid}
.rank-card .t b{font-size:14px;line-height:21px;font-weight:800}
.rank-card .t small{font-size:11.5px;line-height:17px;color:var(--ink-muted)}
.rank-card .faces{display:flex;flex:none}
.rank-card .faces .avatar{--size:28px;--ring:var(--surface);margin-inline-start:-8px}
.rank-card .chev{color:var(--ink-muted);display:grid}
.rank-card .chev svg{width:18px;height:18px}

/* ---------- میزهای دیگرم ---------- */
.tables{display:grid;gap:var(--space-2)}
.tbl{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-2);padding-inline-end:var(--space-3);
  border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);overflow:hidden;animation:tblIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.tbl:active{transform:scale(.985)}
.tbl.turn{box-shadow:inset 0 0 0 2px var(--gold)}
.tbl .g-art{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;overflow:hidden}
.tbl .g-art svg{display:block;width:76%;height:76%}
.tbl-txt{display:grid;gap:2px;min-width:0}
.tbl-txt b{display:flex;align-items:center;gap:6px;font-family:var(--font-rokh);font-size:15px;line-height:22px;font-weight:900}
.tbl-tag{font-family:var(--font-peyda);font-size:10.5px;line-height:16px;font-weight:800;padding:0 7px;border-radius:var(--radius-pill);background:var(--surface-sunk);color:var(--ink-muted)}
.tbl-st{display:flex;align-items:center;gap:6px;font-size:12px;line-height:18px;color:var(--ink-muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-st .live{width:7px;height:7px;border-radius:50%;background:#3DDC84;flex:none}
.tbl-st .spinner{width:12px;height:12px;border-width:2px}
.tbl-st .myturn{color:var(--gold);font-weight:900}
.tbl-go{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding-inline:12px;border-radius:var(--radius-pill);background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:900}
.tbl-go svg{width:15px;height:15px}
@keyframes tblIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@media (prefers-reduced-motion:reduce){.tbl{animation:none}}

.sec-head h2{display:flex;align-items:center;gap:8px}
.note-bar{display:flex;align-items:center;gap:var(--space-2);background:var(--coin-tint);color:var(--coin-text);border-radius:var(--radius-lg);padding:var(--space-3);font-weight:800;font-size:13.5px;line-height:22px}
.note-bar svg{width:20px;height:20px;flex:none}
.note-bar.bad{background:rgba(255,107,122,.16);color:var(--danger)}
.adm-link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-3)}
.adm-link .ic-box{background:var(--obour-night);color:var(--obour-aqua);font-size:20px}
.adm-link b{display:block;font-weight:900}
.adm-link small{display:block;font-size:12px;color:var(--ink-muted)}
/* برگهٔ اعلان ها */
.ntf{display:grid;gap:var(--space-2)}
.ntf a,.ntf div{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:10px 12px;border-radius:var(--radius-lg);background:var(--surface-sunk)}
.ntf .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.ntf .ic svg{width:21px;height:21px}
.ntf b{display:block;font-weight:800;font-size:14px;line-height:21px}
.ntf small{display:block;font-size:12px;line-height:18px;color:var(--ink-muted)}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span lang="en" dir="ltr">Game Club</span></div>
  <div class="appbar-in">
    <div class="me-chip">
      <span class="lv" id="lv" style="--p:0"><span id="meAv"></span><b id="lvNum">۱</b></span>
      <span style="min-width:0"><span class="me-name" id="meName">سلام!</span><span class="me-sub" id="meSub">…</span></span>
    </div>
    <div class="hd-acts">
      <button class="icon-btn bell" id="bell" aria-label="اعلان‌ها"><i data-ic="bell"></i><span class="badge" id="bellN" hidden></span></button>
      <a class="pill" href="wallet.html" aria-label="کیف امتیاز"><span class="plus"><i data-ic="plus"></i></span><span class="num" data-bal>…</span><span data-coin></span></a>
    </div>
  </div>
</header>
<main class="page home-page">
  <div class="note-bar" id="noteBar" hidden><span id="noteIc"></span><span id="noteTx"></span></div>
  <a class="card card-link adm-link" id="admLink" href="admin.html" hidden><span class="ic-box">⚙︎</span><span><b>پنل مدیریت</b><small>کاربران، میزها، پیام همگانی و تنظیمات</small></span><span aria-hidden="true">‹</span></a>

  <section class="hero" id="hero" aria-live="polite"></section>

  <section id="tablesSec" aria-labelledby="hTables" hidden>
    <div class="sec-head"><h2 id="hTables">میزهای دیگرت</h2></div>
    <div class="tables" id="tables"></div>
  </section>

  <section class="quick" aria-label="کارهای سریع">
    <button class="qa" id="invite"><span class="ic" style="background:rgba(77,141,255,.16);color:#7FAEFF"><i data-ic="userAdd"></i></span><b>دعوت دوست</b><small>با هم بازی کنیم</small></button>
    <a class="qa" href="shop.html"><span class="ic" style="background:rgba(245,196,81,.16);color:var(--gold)"><i data-ic="cards"></i></span><b>ورق و میز</b><small>ظاهر حکم</small></a>
    <a class="qa" href="help.html"><span class="ic" style="background:rgba(61,220,132,.14);color:#5FE39A"><i data-ic="help"></i></span><b>راهنما</b><small>قانون بازی‌ها</small></a>
  </section>

  <section aria-labelledby="hGames">
    <div class="sec-head"><h2 id="hGames">بازی‌ها</h2></div>
    <div class="games" id="games"></div>
  </section>

  <a class="rank-card" id="rankCard" href="leaderboard.html" aria-label="رده‌بندی هفته">
    <span class="pos" id="rankPos">…</span>
    <span class="t"><b id="rankT">رده‌بندی این هفته</b><small id="rankS">در حال بارگذاری…</small></span>
    <span class="faces" id="rankFaces"></span>
    <span class="chev"><i data-ic="fwd"></i></span>
  </a>

  <section class="shop-only" aria-labelledby="hShop">
    <div class="sec-head"><h2 id="hShop">امتیازت را در عبور خرج کن</h2><a href="shop.html">همه</a></div>
    <div class="card stack">
      <div class="obour"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#151B42"/><path d="M10 22.5l7-11.5 7 11.5" fill="none" stroke="#3BF0CF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="22.5" r="2" fill="#B36BFF"/></svg>
        <span>سفارش مستقیم روی <b>حساب عبورت</b> ثبت می‌شود؛ خرید جدا لازم نیست.</span></div>
      <ul class="list" id="shopTeaser"></ul>
    </div>
  </section>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/cards.js"></script>
<script>
(() => {
  const { fa, FD, toast, face, amount, icon, errText, store, sheet, sheetHead, GAME_ART } = GC;
  const C = window.GCCards;
  const $ = id => document.getElementById(id);
  GC.back(null);
  let me = null, style = { table: 'a', cards: 'a' }, notify = [], tables = [];

  /* ---------- اجزای واقعی هر بازی (برای کاشی ها و کارت بالا) ---------- */
  let uid = 0;
  const STAR = 'M16 7.5l2.5 5.2 5.7.8-4.1 4 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4.1-4 5.7-.8z';
  const EMBLEM = {
    eagles: () => { const id = 'he' + (++uid); return `<svg viewBox="0 0 32 32"><defs><pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="4" height="8" fill="#1E5BD8"/><rect x="4" width="4" height="8" fill="#5AA2FF"/></pattern></defs><circle cx="16" cy="16" r="16" fill="url(#${id})"/><path d="${STAR}" fill="#fff"/></svg>`; },
    lions: () => '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#D7263D"/><rect x="0" y="12" width="32" height="8" fill="#F5C451"/><path d="M9 20l7-6 7 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const BALL = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9.3" fill="#fff" stroke="#1c1f2a" stroke-width=".8"/><path d="M10 6.2l3.6 2.6-1.4 4.2H7.8L6.4 8.8z" fill="#1c1f2a"/><path d="M10 .9v2.6M18.6 7.6l-2.5.8M15.4 18l-1.5-2.1M4.6 18l1.5-2.1M1.4 7.6l2.5.8" stroke="#1c1f2a" stroke-width="1.6"/></svg>';
  const disc = (team, d, x, y) => `<span class="fd" style="--d:${d}px;width:${d}px;height:${d}px;left:${x}px;top:${y}px"><span class="in">${EMBLEM[team]()}</span></span>`;
  const REAL = {
    // ماهوت و طرح ورقی که خود بازیکن انتخاب کرده؛ آس پیک، شاه دل و بی بی خشت در دست
    hokm: (k = 1) => `<div class="ra ra-hokm felt tbl-${style.table} cards-${style.cards}" aria-hidden="true">${
      C.face(10 + 13 * 2, '', `left:calc(50% - ${46 * k}px);top:${16 * k}px;transform:rotate(-16deg);font-size:${34 * k}px`)}${
      C.face(11 + 13, '', `left:calc(50% - ${17 * k}px);top:${8 * k}px;transform:rotate(-2deg);font-size:${34 * k}px`)}${
      C.face(12, '', `left:calc(50% + ${12 * k}px);top:${14 * k}px;transform:rotate(14deg);font-size:${34 * k}px`)}</div>`,
    football: () => `<div class="ra ra-fb" aria-hidden="true">${disc('eagles', 40, 26, 48)}${disc('lions', 40, 104, 14)}<span class="ball" style="left:72px;top:42px;width:20px">${BALL}</span></div>`,
    ludo: () => `<div class="ra ra-ludo" aria-hidden="true"><span class="bd">${GC.boardArt()}</span><span class="pw" style="left:22px;top:46px">${GC.pawn('red')}</span><span class="pw" style="right:24px;top:38px">${GC.pawn('blue')}</span></div>`,
    esm: () => '<div class="ra ra-esm" aria-hidden="true"><span style="background:#FFA552;color:#3A2000;transform:rotate(-8deg)">ب</span><span style="background:#FF7A85;color:#3A0A10;transform:rotate(6deg)">م</span><span style="background:#8E7CF8;color:#fff;transform:rotate(-3deg)">الف</span></div>',
  };

  /* ---------- هدر ---------- */
  function renderHeader() {
    const p = me.player, L = GC.level(p);
    $('meAv').innerHTML = face(p, '#0E1E19');
    $('lv').style.setProperty('--p', Math.round(L.frac * 100));
    $('lvNum').textContent = FD(L.lv);
    $('lv').setAttribute('aria-label', `سطح ${FD(L.lv)}`);
    $('meName').textContent = 'سلام، ' + (p.name || 'بازیکن');
    const sub = $('meSub');
    if (!me.obour.linked) { sub.className = 'me-sub bad'; sub.textContent = 'هنوز در ربات عبور نیستی'; }
    else { sub.className = 'me-sub'; sub.innerHTML = `<span class="bar"><i style="width:${Math.round(L.frac * 100)}%"></i></span>${FD(L.left)} تا سطح ${FD(L.lv + 1)}`; }
  }
  // اعلان ها: میزی که نوبت توست، میزی که منتظر توست و پیام مدیریت
  function alerts() {
    const out = [];
    for (const t of tables) {
      const g = GC.GAMES.find(x => x.id === t.game) || GC.GAMES[2];
      if (t.kind === 'playing' && t.my_turn) out.push({ href: g.id + '.html', game: t.game, id: t.id, k: t.kind, ic: 'clock', c: 'var(--gold)', bg: 'rgba(245,196,81,.16)', t: `نوبت شماست در ${g.name}`, s: 'سر میز برگرد تا وقتت نسوزد' });
      else if (t.kind === 'lobby') out.push({ href: g.href, ic: 'users', c: '#7FAEFF', bg: 'rgba(77,141,255,.16)', t: `میز ${g.name} منتظر است`, s: `${FD(t.found)} از ${FD(t.need)} نفر نشسته‌اند` });
    }
    if (me && me.notice) out.push({ ic: 'bell', c: '#5FE39A', bg: 'rgba(61,220,132,.14)', t: 'پیام Game Club', s: me.notice });
    return out;
  }
  function renderBell() {
    const n = alerts().filter(a => a.ic !== 'users').length, b = $('bellN');
    b.hidden = !n; b.textContent = FD(n);
    $('bell').setAttribute('aria-label', n ? `اعلان‌ها، ${FD(n)} تازه` : 'اعلان‌ها');
  }
  $('bell').onclick = () => {
    const list = alerts();
    const sh = sheet(`${sheetHead('اعلان‌ها')}<div class="ntf">${list.length ? list.map(a => `<${a.href ? `a href="${a.href}" data-g="${a.game || ''}" data-id="${a.id || ''}" data-k="${a.k || ''}"` : 'div'}><span class="ic" style="background:${a.bg};color:${a.c}">${icon(a.ic)}</span><span><b>${a.t}</b><small>${a.s}</small></span><span>${a.href ? icon('fwd') : ''}</span></${a.href ? 'a' : 'div'}>`).join('')
      : '<p class="hint">اعلان تازه‌ای نداری. وقتی نوبتت شد یا میزی منتظرت بود، اینجا می‌بینی.</p>'}</div>`);
    sh.querySelectorAll('a[data-id]').forEach(a => a.addEventListener('click', () => { const g = GC.GAMES.find(x => x.id === a.dataset.g); if (a.dataset.k === 'playing' && a.dataset.id && g) store.set({ hokm: 'hmid', football: 'fmid', ludo: 'mid' }[g.id], a.dataset.id); }));
  };

  /* ---------- کارت بزرگ بالا: ادامهٔ بازی یا حکم ---------- */
  const KEY = { hokm: 'hmid', football: 'fmid', ludo: 'mid' };
  const heroBg = { hokm: () => `felt tbl-${style.table}`, football: () => 't-green', ludo: () => 't-violet' };
  function heroTable() {
    const playing = tables.filter(t => t.kind === 'playing');
    return playing.find(t => t.my_turn) || playing[0] || tables[0] || null;
  }
  function stateLine(t) {
    if (t.kind === 'queue') return { k: 'دنبال حریف', h: 'در صف بازی', p: `${FD(t.found)} از ${FD(t.need)} نفر پیدا شد` };
    if (t.kind === 'lobby') return { k: 'میز دوستانه', h: t.host ? 'منتظر دوستانت' : 'منتظر بقیه', p: `${FD(t.found)} از ${FD(t.need)} نفر نشسته‌اند` };
    const sc = t.score ? `ما ${FD(t.score[0])} – ${FD(t.score[1])} آنها · تا ${FD(t.target)}` : 'بازی در جریان است';
    return { k: 'بازی نیمه‌تمام', h: t.my_turn ? 'نوبت شماست!' : 'بازی در جریان است', p: sc };
  }
  function renderHero() {
    const h = $('hero'), t = heroTable();
    if (t) {
      const g = GC.GAMES.find(x => x.id === t.game) || GC.GAMES[2], st = stateLine(t);
      const href = t.kind === 'playing' ? g.id + '.html' : g.href;
      h.className = 'hero ' + (heroBg[g.id] || heroBg.ludo)();
      h.innerHTML = `<div class="art">${(REAL[g.id] || REAL.ludo)(1.2)}</div>
        <div class="txt"><span class="kick"><i></i>${st.k} · ${g.name}</span><h1>${st.h}</h1><p>${st.p}</p></div>
        <div class="acts"><a class="go" href="${href}" data-k="${t.kind}" data-g="${g.id}" data-id="${t.id || ''}">برگرد سر میز${icon('fwd')}</a></div>`;
      h.querySelector('.go').addEventListener('click', e => { const a = e.currentTarget; if (a.dataset.k === 'playing' && a.dataset.id) store.set(KEY[a.dataset.g], a.dataset.id); GC.haptic('light'); });
    } else {
      h.className = `hero felt tbl-${style.table}`;
      h.innerHTML = `<div class="art">${REAL.hokm(1.2)}</div>
        <div class="txt"><span class="kick"><i></i>بازی محبوب</span><h1>حکم چهارنفره</h1><p>با یارت در برابر دو حریف؛ آنلاین، با دوست یا ربات.</p></div>
        <div class="acts"><a class="go" href="hokm-lobby.html">بازی کن${icon('fwd')}</a><a class="glass" href="help.html#hokm">راهنما</a></div>`;
    }
    // هنر کارت بالا کمی بزرگ تر از کاشی است
    h.querySelectorAll('.art .ra').forEach(r => { r.style.height = '130px'; r.style.background = 'none'; });
  }

  /* ---------- میزهای دیگر ---------- */
  function tableHtml(t) {
    const g = GC.GAMES.find(x => x.id === t.game) || GC.GAMES[2], c = t.cfg || {}, st = stateLine(t);
    const tag = c.mode === 'stake' ? `ورودی ${fa(c.entry)}` : 'آزاد';
    const href = t.kind === 'playing' ? g.id + '.html' : g.href;
    return `<a class="tbl${t.my_turn ? ' turn' : ''}" href="${href}" data-g="${g.id}" data-id="${t.id || ''}" data-k="${t.kind}">
      <span class="g-art ${g.tint}">${GAME_ART[g.id]()}</span>
      <span class="tbl-txt"><b>${g.name}<span class="tbl-tag">${tag}</span></b><span class="tbl-st">${t.kind === 'playing' ? '<span class="live"></span>' : '<span class="spinner"></span>'}${t.my_turn ? `<span class="myturn">${st.h}</span>` : ''}${st.p}</span></span>
      <span class="tbl-go">${t.my_turn ? 'بازی کن' : 'برگرد'}<i data-ic="fwd"></i></span></a>`;
  }
  $('tables').addEventListener('click', e => {
    const a = e.target.closest('.tbl'); if (!a) return;
    if (a.dataset.k === 'playing' && a.dataset.id) store.set(KEY[a.dataset.g], a.dataset.id);
    GC.haptic('light');
  });

  /* ---------- کاشی بازی ها ---------- */
  function renderGames() {
    const open = new Set(tables.map(t => t.game));
    const badge = { hokm: '<span class="bdg hot">محبوب</span>', football: '<span class="bdg new">جدید</span>' };
    $('games').innerHTML = GC.GAMES.map(g => {
      const b = g.soon ? '' : open.has(g.id) ? '<span class="bdg open">میز باز داری</span>' : (badge[g.id] || '');
      const bg = g.id === 'hokm' ? `felt tbl-${style.table}` : '';
      return g.soon
        ? `<div class="gt soon">${b}${REAL[g.id]()}<b>${g.name}</b><small>به‌زودی می‌آید</small><button class="notify" data-notify="${g.id}"></button></div>`
        : `<a class="gt ${bg}" href="${g.href}">${b}${REAL[g.id]()}<b>${g.name}</b><small>${g.sub.split(' · ')[0]}</small></a>`;
    }).join('');
    document.querySelectorAll('[data-notify]').forEach(b => {
      const sync = () => { const on = notify.includes(b.dataset.notify); b.classList.toggle('on', on); b.innerHTML = on ? icon('check', 3) + 'خبرت می‌کنیم' : icon('bell', 2.6) + 'خبرم کن'; };
      sync();
      b.onclick = async () => {
        try { const r = await GC.data.notify(b.dataset.notify); notify = r.on ? [...notify, b.dataset.notify] : notify.filter(x => x !== b.dataset.notify); sync(); if (r.on) toast('وقتی آماده شد، ربات خبرت می‌کند'); }
        catch (e) { toast(errText(e)); }
      };
    });
  }

  function renderAll() {
    renderHero();
    const rest = tables.filter(t => t !== heroTable());
    $('tablesSec').hidden = !rest.length;
    $('tables').innerHTML = rest.map(tableHtml).join('');
    renderGames(); renderBell(); GC.mount();
  }
  let sig = '';
  function setTables(list) { const s = JSON.stringify(list); if (s === sig) return; sig = s; tables = list; renderAll(); }

  /* ---------- دعوت دوست ---------- */
  $('invite').onclick = () => {
    const bot = me && me.settings && me.settings.bot;
    if (!bot) { toast('لینک دعوت فقط داخل تلگرام ساخته می‌شود'); return; }
    GC.openLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/' + bot) + '&text=' + encodeURIComponent('بیا Game Club با هم حکم، فوتبال و منچ بازی کنیم!'));
  };

  renderAll();
  let polling = false;
  async function load() {
    try {
      me = await GC.refreshMe();
      style = Object.assign({ table: 'a', cards: 'a' }, me.style || {});
      notify = me.notify || [];
      renderHeader();
      sig = ''; setTables(me.tables || []);
      const note = me.banned ? 'حساب تو در Game Club مسدود شده است. برای پیگیری به پشتیبانی عبور پیام بده.'
        : me.maintenance ? 'در حال به‌روزرسانی هستیم؛ تا چند دقیقه دیگر میز تازه ساخته نمی‌شود.' : (me.notice || '');
      if (note) { $('noteTx').textContent = note; $('noteIc').innerHTML = icon(me.banned ? 'shield' : me.maintenance ? 'clock' : 'bell'); $('noteBar').hidden = false; $('noteBar').classList.toggle('bad', !!me.banned); }
      $('admLink').hidden = !me.is_admin;
      if (!polling) { polling = true; setInterval(async () => { if (document.hidden || !GC.isActive('home')) return; try { const m = await GC.data.me(); me = Object.assign(me, m); setTables(m.tables || []); } catch (e) {} }, 5000); }
    } catch (e) { toast(errText(e)); }
    try {
      const lb = await GC.data.leaderboard('top', 'week'), i = lb.rows.findIndex(r => r.me), mine = lb.mine || {};
      $('rankFaces').innerHTML = lb.rows.slice(0, 3).map(r => face(r)).join('');
      if (i >= 0) { $('rankPos').textContent = FD(i + 1); $('rankT').textContent = 'جایگاه تو این هفته'; $('rankS').innerHTML = `${fa(mine.wins || lb.rows[i].wins)} برد · ${amount(lb.rows[i].value)}`; }
      else { $('rankPos').innerHTML = icon('trophy'); $('rankT').textContent = 'رده‌بندی این هفته'; $('rankS').textContent = lb.rows.length ? 'با بردن بازی امتیازی وارد جدول شو' : 'هنوز کسی امتیازی نبرده؛ اولین نفر باش!'; }
    } catch (e) { $('rankS').textContent = errText(e); }
    if (GC.S.shopOn) try {
      const sh = await GC.data.shop();
      $('shopTeaser').innerHTML = sh.plans.slice(0, 2).map(p => `<li><a class="row" href="shop.html"><span class="ic-box" style="background:var(--obour-night);color:var(--obour-aqua)">${icon('globe')}</span><span class="name">${p.title}<span class="meta">${p.days ? FD(p.days) + ' روزه' : ''}</span></span>${amount(p.points)}</a></li>`).join('')
        || '<li class="hint">فعلا پلنی برای فروش نیست.</li>';
    } catch (e) { $('shopTeaser').innerHTML = `<li class="hint">${errText(e)}</li>`; }
    GC.mount();
  }
  GC.page(load);
  GC.nav('home'); GC.mount();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>Game Club · فوتبال</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/football.css">
</head>
<body class="football">
<header class="appbar" id="appbar">
  <div class="appbar-cap"><span>فوتبال</span></div>
  <div class="appbar-in">
    <button class="fb-ib" id="exit" aria-label="خروج از بازی"><i data-ic="exit"></i></button>
    <div class="fb-head" id="head" aria-live="polite"></div>
    <button class="fb-ib" id="help" aria-label="آموزش بازی"><i data-ic="help"></i></button>
    <button class="fb-ib" id="snd" aria-pressed="true"></button>
  </div>
</header>
<div class="fb-status"><span class="fb-pill" id="status">در حال وصل شدن…</span></div>
<main class="fb-arena" id="arena">
  <div class="fb-stadium" id="stadium">
    <div class="fb-crowd" aria-hidden="true"></div>
    <div class="fb-ads" aria-hidden="true"><span>GAME CLUB</span><span>OBOUR</span><span>GAME CLUB</span></div>
    <div class="fb-pitch" id="pitch" aria-label="زمین فوتبال"></div>
    <div class="fb-ads r" aria-hidden="true"><span>OBOUR</span><span>GAME CLUB</span><span>OBOUR</span></div>
    <div class="fb-crowd r" aria-hidden="true"></div>
  </div>
</main>
<div class="fb-hint"><span id="hint" hidden>مهره را بگیر، به عقب بکش و رها کن</span></div>
<footer class="fb-bar" id="chatbar"></footer>
<script src="static/gc.js"></script>
<script src="static/tour.js"></script>
<script src="static/demo.js"></script>
<script src="static/football-physics.js"></script>
<script src="static/demo-football.js"></script>
<script src="static/tchat.js"></script>
<script src="static/football.js"></script>
</body>
</html>

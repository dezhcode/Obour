<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · میز دیوار</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* لابی دیوار: دو نفره یا چهار نفره (کلاسیک یا ستاره)، آزاد یا با امتیاز. صف و دعوت در برگه */
.seatline{display:flex;justify-content:center;gap:var(--space-3);flex-wrap:wrap}
.seatw{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:800}
.seatw .avatar{--size:56px}
.wait{width:56px;height:56px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--ink-muted);font-weight:900;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vs{align-self:center;font-size:16px;font-weight:900}
.linkbox{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-sunk);border-radius:var(--radius-md);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:left;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.resume{display:grid;gap:4px;justify-items:start}
.resume b{font-size:18px;font-weight:900}
.count{font-size:44px;line-height:52px;font-weight:900;text-align:center;color:var(--acc-deep)}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>میز دیوار</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>دیوار</h1></div>
    <a class="pill" href="shop.html#wallet" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>…</span></a>
  </div>
</header>
<main class="page no-nav">
  <div class="gp" id="gp"></div>
  <a class="card card-link resume" id="resume" href="divar.html" hidden><span class="tag tag-live">بازی نیمه‌تمام</span><b>برگرد سر میز</b><span class="muted">بازی‌ات هنوز ادامه دارد؛ بقیه منتظر تواند.</span></a>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/divar-engine.js"></script>
<script src="static/demo-divar.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script src="static/gamepage.js"></script>
<script>
(() => {
  const { fa, FD, store, face, icon, sheet, sheetHead, toast, sfx, haptic, sleep, errText } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  let token = null, gp = null;
  const render = () => { if (gp) gp.refresh(); };

  // دو نفره: تو مقابل حریف؛ چهار نفره: هر کس برای خودش (یار ندارد)
  const one = (p, lab, me) => p ? `<div class="seatw">${face(p, me ? '#F5C451' : 'var(--sky)')}${p.name}<small class="muted" style="font-size:11.5px">${lab}</small></div>` : `<div class="seatw"><span class="wait">؟</span>${lab}</div>`;
  const seatsHtml = (list, n) => n === 4
    ? `<div class="seatline">${one(list[0], 'تو', true)}<b class="vs">مقابل</b>${one(list[1], 'حریف')}${one(list[2], 'حریف')}${one(list[3], 'حریف')}</div>`
    : `<div class="seatline">${one(list[0], 'تو', true)}<b class="vs">مقابل</b>${one(list[1], 'حریف')}</div>`;
  async function go(mid) {
    token = null; store.set('dmid', mid);
    for (let n = 3; n >= 1; n--) {
      sheet(`<h2 style="text-align:center;font-size:22px;font-weight:900">میز آماده است!</h2><div class="count">${FD(n)}</div><p class="hint">بازی شروع می‌شود…</p>`, { center: true, dismiss: false });
      sfx.tick(); haptic('light'); await sleep(650);
    }
    location.href = 'divar.html';
  }

  /* ---------- صف ناشناس ---------- */
  async function queueLoop(first) {
    const t = token = {};
    let st = first, shown = '';
    while (token === t) {
      if (st.state === 'matched') { sfx.turn(); haptic('success'); return go(st.match); }
      if (st.state !== 'waiting') { GC.close(); return; }
      const c = st.cfg, n = c.players === 4 ? 4 : 2;
      const list = [{ name: 'شما', av: 7 }, ...[...Array(n - 1)].map((_, i) => i + 1 < st.found ? { name: 'بازیکن', av: 4 + i } : null)];
      const line = `${FD(st.found)} از ${FD(st.need)} نفر · ${FD(st.waited)} ثانیه`;
      if (shown === String(st.found)) { const el = document.getElementById('ql'); if (el) el.textContent = line; }
      else {
        shown = String(st.found);
        const prize = c.mode === 'stake' ? `برنده ${fa(c.entry * n)}` : '';
        const sh = sheet(`${sheetHead(n === 4 ? 'پیدا کردن سه حریف' : 'پیدا کردن حریف')}${seatsHtml(list, n)}
          <div class="wait-line"><span class="spinner"></span><span id="ql">${line}</span></div>
          <p class="hint">${c.mode === 'stake' ? `ورودی ${fa(c.entry)} · ${prize} امتیاز · فقط با بازیکن واقعی` : st.bots_in != null && st.bots_in > 0 ? `اگر تا ${FD(st.bots_in)} ثانیهٔ دیگر کسی نیاید، جای خالی را ربات پر می‌کند` : 'بازی وقتی شروع می‌شود که میز کامل شود'} · ناشناس می‌مانی</p>
          ${st.can_bots ? '<button class="btn btn-block" id="qb">منتظر نمی‌مانم؛ جای خالی را ربات پر کند</button>' : ''}
          <button class="btn btn-light btn-block" id="qc">انصراف${c.mode === 'stake' ? ' و برگشت ورودی' : ''}</button>`, { dismiss: false });
        const qb = sh.querySelector('#qb');
        if (qb) qb.onclick = async () => { qb.disabled = true; try { const r = await GC.divar.queueBots(); if (r.state === 'matched') { token = null; sfx.turn(); haptic('success'); return go(r.match); } } catch (e) { toast(errText(e)); } qb.disabled = false; };
        sh.querySelector('#qc').onclick = async () => { token = null; try { await GC.divar.queueLeave(); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      }
      await sleep(1500); if (token !== t) return;
      try { st = await GC.divar.queueStatus(); } catch (e) { toast(errText(e)); }
    }
  }

  /* ---------- میز دعوت ---------- */
  async function lobbyLoop(mid) {
    const t = token = {};
    let shown = '';
    while (token === t) {
      let v;
      try { v = await GC.divar.match(mid, 0); } catch (e) { toast(errText(e)); GC.close(); return; }
      if (v.status === 'playing') return go(mid);
      if (v.status === 'cancelled') { GC.close(); toast('سازنده میز را بست؛ ورودی‌ات برگشت'); await GC.refreshMe(); render(); return; }
      const L = v.lobby, c = v.cfg, n = c.players === 4 ? 4 : 2, full = L.seats.length === n, link = L.link;
      const sig = L.seats.map(s => s.color + s.name).join('|');
      if (sig === shown) { await sleep(1500); continue; }
      shown = sig; if (L.seats.length > 1) { sfx.turn(); haptic('light'); }
      const mine = L.seats.find(s => s.me), opp = L.seats.filter(s => !s.me);
      const list = [Object.assign({}, mine || {}, { name: 'شما' }), ...[...Array(n - 1)].map((_, i) => opp[i] || null)];
      const msg = c.mode === 'stake' ? `بیا دیوار بازی کنیم! ورودی ${c.entry} امتیاز.` : n === 4 ? 'بیا چهار نفره دیوار بازی کنیم؛ ببینیم کی زودتر می‌رسه!' : 'بیا یه دست دیوار بزنیم؛ راهتو می‌بندم 😄';
      const share = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(msg);
      const sh = sheet(`${sheetHead(L.host ? (n === 4 ? 'بازی با یار' : 'بازی با دوست') : 'سر میز دوستت')}
        ${L.host ? `<p>این لینک را بفرست.${n === 4 ? ' سه نفر که بازش کنند بازی شروع می‌شود.' : ' تا دوستت بازش کند بازی شروع می‌شود.'}${c.mode === 'stake' ? ' ' + fa(c.entry) + ' امتیاز ورودی از کیف هر نفر کم می‌شود.' : ''}</p>
        <div class="linkbox"><code>${link || 'لینک دعوت فقط داخل تلگرام ساخته می‌شود'}</code><button class="btn btn-sm" id="cp">${icon('copy')}کپی</button></div>
        <button class="btn btn-block" id="shr">${icon('send')}ارسال در تلگرام</button>` : '<p>منتظر بقیه و شروع بازی…</p>'}
        ${seatsHtml(list, n)}
        <div class="wait-line"><span class="spinner"></span>${full ? 'میز پر شد؛ بازی شروع می‌شود…' : `${FD(L.seats.length)} از ${FD(n)} نفر سر میزند…`}</div>
        ${L.host && c.mode === 'free' && !full ? '<button class="btn btn-light btn-block" id="solo">منتظر نمی‌مانم؛ جای خالی با ربات</button>' : ''}
        <button class="btn btn-light btn-block" id="lv">${L.host ? 'بستن میز' : 'بلند شدن از میز'}</button>`, { dismiss: false });
      const cp = sh.querySelector('#cp');
      if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(link).then(() => toast('لینک دعوت کپی شد'), () => toast('کپی نشد؛ لینک را دستی بفرست')); } catch (e) { toast('کپی نشد؛ لینک را دستی بفرست'); } };
      const shr = sh.querySelector('#shr'); if (shr) shr.onclick = () => link ? GC.openLink(share) : toast('لینک فقط داخل تلگرام ساخته می‌شود');
      const solo = sh.querySelector('#solo'); if (solo) solo.onclick = async () => { try { await GC.divar.start(mid); } catch (e) { toast(errText(e)); } };
      sh.querySelector('#lv').onclick = async () => { token = null; try { await GC.divar.leave(mid); await GC.refreshMe(); } catch (e) { toast(errText(e)); } GC.close(); render(); };
      await sleep(1500);
    }
  }

  /* ---------- صفحهٔ بازی ---------- */
  async function play(how, cfg, btn) {
    const c = Object.assign({ game: 'divar' }, cfg);
    // انتخاب «حالت» میز خصوصی (۲، ۴ کلاسیک، ۴ ستاره) به players و variant
    if (c.kind != null) { c.players = c.kind === 2 ? 2 : 4; c.variant = c.kind === 5 ? 'star' : 'classic'; delete c.kind; }
    if (how === 'bot') { c.mode = 'free'; c.entry = 0; c.solo = true; }
    if (c.mode === 'stake' && GC.points < c.entry) { sfx.error(); haptic('error'); toast(errText({ code: 'insufficient' })); return; }
    if (btn) btn.disabled = true;
    try {
      if (how === 'invite') { const r = await GC.divar.invite(c); await GC.refreshMe(); lobbyLoop(r.match); }
      else { const r = await GC.divar.queueJoin(c); await GC.refreshMe(); queueLoop(r); }
    } catch (err) { sfx.error(); haptic('error'); toast(errText(err)); }
    if (btn) btn.disabled = false; render();
  }
  gp = GCGame.build({
    game: 'divar', title: 'دیوار', help: 'help.html#hDivar',
    privateSub: 'دو نفره، چهار نفره یا چهار نفرهٔ ستاره',
    privateFields: [{ key: 'kind', label: 'حالت بازی', opts: [[2, '۲ نفره', '۹×۹ · ۱۰ دیوار'], [4, '۴ نفره', 'کلاسیک · ۵ دیوار'], [5, '۴ نفره ستاره', '۱۱×۱۱ · ۷ دیوار']] }],
    privateDefaults: () => Object.assign({ kind: 2 }, store.get('dvPriv', {})),
    queues: s => [
      { title: 'بازی سریع', sub: 'آزاد · ۲ نفره · ۹×۹ · ۱۰ دیوار', ic: icon('bolt'), hot: true, how: 'online', cfg: { mode: 'free', entry: 0, players: 2, variant: 'classic' } },
      { title: 'چهار نفره', sub: 'آزاد · هر کس به ضلع روبه‌رو · ۵ دیوار', ic: icon('users'), how: 'online', cfg: { mode: 'free', entry: 0, players: 4, variant: 'classic' } },
      { title: 'چهار نفرهٔ ستاره', sub: 'آزاد · ۱۱×۱۱ · همه به ستارهٔ وسط', ic: icon('users'), how: 'online', cfg: { mode: 'free', entry: 0, players: 4, variant: 'star' } },
      ...(s.stake ? s.entries.map(v => ({ title: `ورودی ${fa(v)}`, sub: `با امتیاز · ۲ نفره · برنده ${fa(v * 2)} می‌برد`, ic: GC.coin(), coin: true, how: 'online', cfg: { mode: 'stake', entry: v, players: 2, variant: 'classic' } })) : []),
      { title: 'تمرین با ربات', sub: 'همیشه آزاد، بدون انتظار · ۲ نفره', ic: icon('bot'), how: 'bot', cfg: { mode: 'free', entry: 0, players: 2, variant: 'classic' } },
      { title: 'چهار نفره با ربات‌ها', sub: 'تو مقابل سه ربات · ستارهٔ وسط', ic: icon('bot'), how: 'bot', cfg: { mode: 'free', entry: 0, players: 4, variant: 'star' } },
    ],
    rules: [['هدف:', 'زودتر از بقیه مهره‌ات را به ضلع روبه‌رو برسان (در «ستاره» به خانهٔ ستارهٔ وسط صفحه). اولین کسی که برسد برنده است و بازی همان لحظه تمام می‌شود.'],
      ['هر نوبت یکی از این دو:', 'یک خانه بالا، پایین، چپ یا راست برو (خانه‌های روشن)، یا یک دیوار را از سینی پایین بگیر و روی شیار بین خانه‌ها رها کن.'],
      ['دیوار:', 'هر دیوار دو خانه را می‌پوشاند و برداشته نمی‌شود. دیوارها روی هم نمی‌افتند و ضربدری از هم رد نمی‌شوند. دیواری که راه کسی را کامل ببندد مجاز نیست؛ جای غیرمجاز قرمز می‌شود.'],
      ['پرش:', 'اگر مهره‌ای درست کنارت باشد و بینتان دیوار نباشد، از رویش می‌پری. اگر پشتش دیوار یا مهرهٔ دیگری باشد، کج به چپ یا راستِ همان مهره می‌روی.'],
      ['تعداد دیوار:', '۲ نفره هر نفر ۱۰ دیوار، ۴ نفره ۵ دیوار و ۴ نفرهٔ ستاره ۷ دیوار.'],
      ['وقت:', 'اگر وقت نوبتت تمام شود، یک قدم در کوتاه‌ترین راه به جایت برداشته می‌شود. در بازی امتیازی سه نوبت غیبت پشت‌سرهم یعنی باخت.'],
      ['ترفند:', 'دیوارهایت را زود خرج نکن؛ وقتی حریف نزدیک مقصد است دیوار بگذار و قبل از هر دیوار راه خودت را هم نگاه کن.']],
    play: (how, cfg, btn) => { if (how === 'invite') store.set('dvPriv', { kind: cfg.kind }); play(how, cfg, btn); },
  });

  (async () => {
    try {
      const me = await GC.refreshMe();
      gp.load(me);
      const url = new URL(location.href);
      const code = (url.searchParams.get('join') || '').trim() || (GC.startParam().startsWith('divar_') ? GC.startParam().slice(6) : '');
      const OTHER = { ludo: ['منچ', 'ludo.html'], hokm: ['حکم', 'hokm.html'], football: ['فوتبال', 'football.html'], billiard: ['بیلیارد', 'billiard.html'], divar: ['دیوار', 'divar.html'] };
      if (me.active_match && (me.active_game || 'divar') === 'divar' && GC.live) {
        const v = await GC.divar.match(me.active_match, 0).catch(() => null);
        if (v && v.status === 'lobby') lobbyLoop(v.id);
        else if (v && v.status === 'playing') { store.set('dmid', v.id); if (code) { location.replace('divar.html'); return; } $('resume').hidden = false; }
      } else if (me.active_match && GC.live) { const o = OTHER[me.active_game] || OTHER.ludo; $('resume').hidden = false; $('resume').href = o[1]; $('resume').querySelector('.muted').textContent = `یک بازی ${o[0]} نیمه‌تمام داری؛ اول آن را تمام کن.`; }
      else if (!GC.live && store.get('dmid', null)) {
        const v = await GC.divar.match(store.get('dmid', null), 0).catch(() => null);
        if (v && v.status === 'playing') $('resume').hidden = false;
      } else if (me.queue) queueLoop(await GC.divar.queueStatus());
      else if (code) {
        try { const r = await GC.divar.join(code); await GC.refreshMe(); lobbyLoop(r.match); }
        catch (err) { toast(errText(err)); }
      }
    } catch (e) { toast(errText(e)); }
    render();
  })();
  render();
})();
</script>
</body>
</html>

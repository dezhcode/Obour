<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · بازی‌ها</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* بازی ها: دسته ها، بازی ویژه و کاشی ها؛ تصویر هر کاشی همان اجزای خود بازی است که حرکت می کند */
.gm-cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--space-4) * -1);padding-inline:var(--space-4)}
.gm-cats::-webkit-scrollbar{display:none}
.gm-cat{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:14px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:700}
.gm-cat svg{width:18px;height:18px}
.gm-cat[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:900}
.gm-hero{position:relative;display:block;height:210px;border-radius:24px;overflow:hidden;color:#fff;--cs:52px;--es:30px}
.gm-hero:active,.gm-tile:active{transform:scale(.985)}
.gm-shade{position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(180deg,rgba(6,14,11,0),rgba(6,14,11,.86));pointer-events:none}
.gm-hero .gm-tag{position:absolute;top:14px;right:14px}
.gm-tag{height:26px;padding:0 10px;border-radius:13px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:900;display:inline-grid;place-items:center}
.gm-tag.new{background:var(--success);color:#0B2A1C}
.gm-hero .gm-txt{position:absolute;right:18px;bottom:14px;left:18px;display:grid}
.gm-hero b{font-family:var(--font-rokh);font-size:30px;line-height:40px;font-weight:900}
.gm-txt small{font-size:13px;line-height:20px;color:rgba(255,255,255,.85)}
.gm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gm-tile{position:relative;display:block;height:160px;border-radius:20px;overflow:hidden;color:#fff;--cs:30px}
.gm-tile .gm-tag{position:absolute;top:10px;right:10px}
.gm-tile .gm-txt{position:absolute;right:14px;bottom:10px;left:14px;display:grid}
.gm-tile b{font-family:var(--font-rokh);font-size:19px;line-height:26px;font-weight:900}
.gm-tile small{font-size:12px;line-height:17px}
.gm-soon{display:flex;align-items:center;gap:14px;min-height:84px;padding:10px 12px 10px 14px;border-radius:20px;background:var(--surface)}
.gm-soon .art{width:84px;height:64px;flex:none;border-radius:14px;overflow:hidden;--es:13px}
.gm-soon .t{flex:1;display:grid;min-width:0}
.gm-soon b{font-family:var(--font-rokh);font-size:17px;font-weight:900}
.gm-soon small{font-size:12.5px;color:var(--ink-muted)}
.gm-empty{padding:28px 16px;text-align:center;color:var(--ink-muted);font-size:14px}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>بازی‌ها</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>بازی‌ها</h1></div>
    <a class="pill" href="shop.html#wallet" aria-label="کیف امتیاز"><span data-coin></span><span class="num" data-bal>…</span></a>
  </div>
</header>
<main class="page">
  <div class="gm-cats" role="group" aria-label="دسته‌بندی بازی‌ها" id="gmCats"></div>
  <div id="gmList" class="stack" style="gap:12px"></div>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script>
(() => {
  const { icon, toast, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  const CATS = [['all', 'همه', 'pad'], ['card', 'کارتی', 'cards'], ['board', 'تخته‌ای', 'dice'], ['sport', 'ورزشی', 'ball']];
  let cat = 'all', style = { table: 'a', cards: 'a' }, notify = [];

  function render() {
    $('gmCats').innerHTML = CATS.map(([id, label, ic]) => `<button class="gm-cat" data-c="${id}" aria-pressed="${cat === id}">${icon(ic)}${label}</button>`).join('');
    const list = GC.GAMES.filter(g => cat === 'all' || g.cat === cat);
    const live = list.filter(g => !g.soon), soon = list.filter(g => g.soon);
    const [hero, ...rest] = live;
    const pv = (g, o) => GCPreview.html(g.id, o);
    let html = '';
    if (hero) html += `<a class="gm-hero" href="${hero.href}">${pv(hero, { style })}<span class="gm-shade"></span>
      ${hero.tag ? `<span class="gm-tag${hero.tag === 'تازه' ? ' new' : ''}">${hero.tag}</span>` : ''}
      <span class="gm-txt"><b>${hero.name}</b><small>${hero.sub}</small></span></a>`;
    if (rest.length) html += `<div class="gm-grid">${rest.map(g => `<a class="gm-tile" href="${g.href}">${pv(g, { style })}<span class="gm-shade"></span>
      ${g.tag ? `<span class="gm-tag${g.tag === 'تازه' ? ' new' : ''}">${g.tag}</span>` : ''}
      <span class="gm-txt"><b>${g.name}</b><small>${g.sub}</small></span></a>`).join('')}</div>`;
    html += soon.map(g => `<div class="gm-soon"><span class="art">${pv(g)}</span><span class="t"><b>${g.name}</b><small>به‌زودی می‌آید</small></span>
      <button class="notify${notify.includes(g.id) ? ' on' : ''}" data-notify="${g.id}" aria-pressed="${notify.includes(g.id)}">${icon(notify.includes(g.id) ? 'check' : 'bell')}${notify.includes(g.id) ? 'خبرت می‌کنیم' : 'خبرم کن'}</button></div>`).join('');
    $('gmList').innerHTML = html || '<p class="gm-empty">بازی‌ای در این دسته نیست</p>';
    GCPreview.watch($('gmList'));
    mount();
  }
  $('gmCats').onclick = e => { const b = e.target.closest('[data-c]'); if (b && b.dataset.c !== cat) { cat = b.dataset.c; GC.sfx.tap(); render(); } };
  $('gmList').onclick = async e => {
    const b = e.target.closest('[data-notify]'); if (!b) return;
    b.disabled = true;
    try { const r = await GC.data.notify(b.dataset.notify); notify = r.on ? [...notify, b.dataset.notify] : notify.filter(x => x !== b.dataset.notify); toast(r.on ? 'وقتی آمد خبرت می‌کنیم' : 'دیگر خبرت نمی‌کنیم'); render(); }
    catch (err) { toast(errText(err)); b.disabled = false; }
  };
  async function load() {
    try {
      const me = await GC.refreshMe();
      style = Object.assign({ table: 'a', cards: 'a' }, me.style || {}); notify = me.notify || [];
    } catch (e) { toast(errText(e)); }
    render();
  }
  render();
  GC.page(load);
  GC.nav('games'); mount();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="static/theme.js"></script>
<title>آس و تاس · بازی‌ها</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<link rel="stylesheet" href="static/cards.css">
<link rel="stylesheet" href="static/preview.css">
<style>
/* بازی ها (تاس وسط ناوبری): دسته ها و یک کاشی پهن برای هر بازی در دنیای خود همان بازی، با جزئیات بیشتر
   از خانه (چند نفره، مدت یا اندازه) و اجزایی که از قاب بیرون زده اند. */
.gm-cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--space-4) * -1);padding-inline:var(--space-4)}
.gm-cats::-webkit-scrollbar{display:none}
.gm-cat{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:13.5px;font-weight:700}
.gm-cat svg{width:17px;height:17px;color:var(--ink-muted)}
.gm-cat[aria-pressed="true"]{background:var(--ink);color:var(--ground);box-shadow:var(--depth-sm);font-weight:800}
.gm-cat[aria-pressed="true"] svg{color:currentColor}
/* کاشی کاشی (بنتو): هر بازی اندازهٔ خودش را دارد و دنیایش از قاب بیرون می‌زند */
.gm-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:118px;grid-auto-flow:dense;gap:12px;margin-top:26px}
.gm-ct{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0;padding:12px 14px;border-radius:24px;color:#fff;
  box-shadow:0 0 0 1px rgba(23,22,29,.05),0 16px 24px -16px var(--sh,rgba(15,63,29,.75));transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.gm-ct.w2{grid-column:span 2}
.gm-ct.t2{grid-row:span 2}
.gm-ct.w2.t2{padding:16px 18px}
.gm-ct:active{transform:scale(.97)}
.gm-ct>.bg{position:absolute;inset:0;z-index:-1;border-radius:inherit;overflow:hidden}
.gm-ct>.bg>.pv,.gm-ct>.bg>.ra{position:absolute;inset:0}
.gm-ct>.bg::before{content:"";position:absolute;inset:0;z-index:1;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.6px);background-size:12px 12px;opacity:.45;pointer-events:none}
.gm-ct>.bg::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.66),rgba(0,0,0,.22) 52%,rgba(0,0,0,0) 78%);pointer-events:none}
.gm-ct.w2:not(.t2)>.bg::after{background:linear-gradient(to left,rgba(0,0,0,.66),rgba(0,0,0,.28) 55%,rgba(0,0,0,0) 82%)}
.gm-ct.w2:not(.t2){justify-content:center}
.gm-ct>b{position:relative;font-family:var(--font-rokh);font-size:20px;line-height:28px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.gm-ct.w2>b,.gm-ct.t2>b{font-size:24px;line-height:32px}
.gm-ct.w2.t2>b{font-size:32px;line-height:40px}
.gm-ct>small{position:relative;font-size:11.5px;line-height:17px;opacity:.94;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gm-ct.w2:not(.t2)>small{max-width:62%}
.gm-ct:not(.w2):not(.t2)>small{display:none}
.gm-ct .gm-facts{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.gm-ct:not(.w2):not(.t2) .gm-facts span+span,.gm-ct.t2:not(.w2) .gm-facts span+span{display:none}
.gm-ct .gm-facts span{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 7px;border-radius:8px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);font-size:11.5px;font-weight:700}
.gm-ct .gm-facts svg{width:13px;height:13px}
.gm-ct .gm-tag{position:absolute;top:12px;right:12px;z-index:4;height:24px;padding:0 9px;border-radius:12px;font-size:11px;line-height:24px;font-weight:800;background:#F5C451;color:#3A2A00;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.16),0 3px 8px -3px rgba(0,0,0,.4);transform:rotate(4deg)}
.gm-ct.w2:not(.t2) .gm-tag{top:auto;right:auto;bottom:12px;left:12px;transform:none}
.gm-ct .gm-tag.new{background:rgba(255,255,255,.95);color:#161922;transform:none}
.gm-ct .gm-out{position:absolute;z-index:3;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));transition:transform .3s cubic-bezier(.3,.7,.3,1)}
.gm-ct .gm-out img,.gm-ct .gm-out svg{display:block;width:100%;height:auto;overflow:visible}
@media (hover:hover){.gm-ct:hover{transform:translateY(-3px)}.gm-ct:hover .gm-out{transform:translateY(-5px) rotate(-3deg)}}
.gm-ct .gm-fan{position:absolute;inset:0;z-index:3;pointer-events:none}
.gm-ct .gm-fan .hk-card{font-size:54px;filter:drop-shadow(0 8px 9px rgba(0,0,0,.3))}
.gm-ct .gm-ludo{position:absolute;left:10px;top:-12px;width:78px;transform:rotate(-8deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.gm-ct .gm-ludo svg{display:block;width:100%;height:auto;border-radius:10px}
.gm-help{margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--depth-sm)}
.gm-help .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface-sunk);color:var(--ink-muted)}
.gm-help .ic svg{width:20px;height:20px}
.gm-help span:nth-child(2){flex:1;display:grid}
.gm-help b{font-size:14px;font-weight:800}
.gm-help small{font-size:12px;color:var(--ink-muted)}
.gm-dvw{display:block;width:100px;height:9px;border-radius:99px;background:linear-gradient(180deg,#FFC9CF,#FF5A6A 42%,#A82B3B);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.gm-soon{grid-column:span 2;display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;border:1.5px dashed color-mix(in srgb,var(--ink-muted) 40%,transparent)}
.gm-soon .lt{display:flex;gap:3px}
.gm-soon .lt span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-rokh);font-size:13px;font-weight:900}
.gm-soon .t{flex:1;display:grid;min-width:0}
.gm-soon b{font-family:var(--font-rokh);font-size:17px;font-weight:900}
.gm-soon small{font-size:12px;color:var(--ink-muted)}
.gm-notify{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding-inline:12px;position:relative;border-radius:var(--radius-pill);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:12px;font-weight:800;white-space:nowrap}
.gm-notify::after{content:"";position:absolute;inset:-4px -2px}
.gm-notify svg{width:14px;height:14px}
.gm-notify.on{background:var(--success-tint);color:var(--success);box-shadow:none}
.gm-empty{grid-column:span 2;padding:28px 16px;text-align:center;color:var(--ink-muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.gm-ct,.gm-ct .gm-out{transition:none}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>بازی‌ها</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" aria-label="برگشت"><i data-ic="back"></i></a><h1>بازی‌ها</h1></div>
    <a class="pill" href="shop.html" aria-label="کیف سکه"><span data-coin></span><span class="num" data-bal>…</span></a>
  </div>
</header>
<main class="page">
  <div class="gm-cats" role="group" aria-label="دسته‌بندی بازی‌ها" id="gmCats"></div>
  <div id="gmList" class="gm-list"></div>
  <a class="gm-help" href="help.html"><span class="ic"><i data-ic="help"></i></span><span><b>قانون بازی‌ها</b><small>هر بازی چطوریه و امتیاز چطور حساب می‌شه</small></span><i data-ic="fwd"></i></a>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script src="static/cards.js"></script>
<script src="static/preview.js"></script>
<script>
(() => {
  const { icon, toast, errText, mount } = GC;
  const $ = id => document.getElementById(id);
  GC.back('index.html');
  const CATS = [['all', 'همه', 'pad'], ['card', 'کارتی', 'cards'], ['board', 'تخته‌ای', 'dice'], ['sport', 'ورزشی', 'ball']];
  let cat = 'all', style = { table: 'a', cards: 'a' }, notify = [];

  const C = window.GCCards, PV = 'static/previews/';
  // هر بازی: توضیح کوتاه، دو واقعیت (چند نفره و مدت یا اندازه)، دنیای خودش و اجزایی که بیرون زده
  const INFO = {
    hokm: { d: 'با یارت جلوی دو تا حریف', f: [['users', '۴ نفره'], ['clock', '۱۰ تا ۲۵ دقیقه']], sh: 'rgba(15,63,29,.75)',
      bg: () => `<span class="ra felt tbl-${style.table}"></span>`,
      out: () => `<span class="gm-fan cards-${style.cards}" aria-hidden="true">${C.face(10 + 13 * 2, '', 'left:22px;top:-26px;transform:rotate(-14deg)')}${C.face(11 + 13, '', 'left:72px;top:-38px;transform:rotate(-1deg)')}${C.face(12, '', 'left:122px;top:-26px;transform:rotate(13deg)')}</span>` },
    football: { d: 'نوبتی شوت بزن و گل بزن ⚽', f: [['users', '۲ نفره'], ['ball', 'تا دو یا سه یا پنج گل']], sh: 'rgba(29,90,37,.8)',
      bg: () => GCPreview.html('football'), out: () => `<span class="gm-out" style="left:20px;top:-14px;width:34px"><img src="${PV}fb-ball.webp" alt=""></span>` },
    ludo: { d: 'مهره‌هاتو دور صفحه ببر و برسون خونه', f: [['users', '۲ یا ۴ نفره'], ['clock', '۵ تا ۱۵ دقیقه']], sh: 'rgba(11,36,28,.8)',
      bg: () => '<span class="ra" style="background:radial-gradient(90% 120% at 30% 40%,#1F4A37,#0F2A22)"></span>',
      out: () => `<span class="gm-ludo" aria-hidden="true">${GC.boardArt()}</span><span class="gm-out" style="left:76px;top:-20px;width:28px">${GC.pawn('red')}</span>` },
    billiard: { d: 'توپاتو بنداز و آخر از همه توپ ۸', f: [['users', '۲ یا ۴ نفره'], ['spark', '۸ توپ']], sh: 'rgba(74,42,24,.8)',
      bg: () => GCPreview.html('billiard'), out: () => `<span class="gm-out" style="left:26px;top:-14px;width:32px"><img src="${PV}bl-ball-8.webp" alt=""></span>` },
    divar: { d: 'راه حریفو ببند و زودتر برس', f: [['users', '۲ یا ۴ نفره'], ['grid', '۹×۹ یا ۱۱×۱۱']], sh: 'rgba(10,42,28,.8)',
      bg: () => GCPreview.html('divar'), out: () => '<span class="gm-out" style="left:18px;top:-8px"><i class="gm-dvw"></i></span>' },
    esmfamil: { d: 'یه حرف و نُه تا ستون با داور هوش مصنوعی', f: [['users', '۲ تا ۱۰ نفر'], ['send', 'گروه یا کانال']], sh: 'rgba(62,41,18,.8)',
      bg: () => GCPreview.html('esmfamil'), out: () => '<span class="gm-out" style="left:-10px;top:-10px;width:100px;transform:rotate(-14deg)"><svg viewBox="0 0 120 20"><rect x="14" y="5" width="92" height="10" rx="5" fill="#C8323C"/><rect x="84" y="5" width="22" height="10" rx="4" fill="#8E1B26"/><path d="M14 5L1 10l13 5z" fill="#F2D8B0"/><path d="M5 8.4L1 10l4 1.6z" fill="#2A2F3A"/><rect x="40" y="3" width="3" height="14" rx="1.5" fill="#E8C76A"/></svg></span>' },
    snakes: { d: 'تاس بریز و از نردبون برو بالا و از مار فرار کن', f: [['users', '۲ تا ۴ نفره'], ['dice', 'دقیقاً تا ۱۰۰']], sh: 'rgba(7,13,28,.8)',
      bg: () => GCPreview.html('snakes'), out: () => '<span class="gm-out" style="left:46%;top:-18px;width:30px"><svg viewBox="0 0 40 40"><path d="M8 34Q8 20 20 20T32 34Z" fill="#E0A800"/><path d="M10 33Q10 22 20 22T30 33Z" fill="#FFC531"/><circle cx="20" cy="13" r="9" fill="#FFC531" stroke="#fff" stroke-width="1.6"/></svg></span>' },
    lashgar: { d: 'ارتشتو بکش و برگه رو تا کن و شلیک کن', f: [['users', '۲ نفره'], ['send', 'گروه یا کانال']], sh: 'rgba(78,48,22,.8)',
      bg: () => GCPreview.html('lashgar'), out: () => '<span class="gm-out" style="left:-10px;bottom:-10px;width:100px;transform:rotate(12deg)"><svg viewBox="0 0 120 20"><path d="M2 10L22 3.5V16.5Z" fill="#E9C9A0"/><path d="M2 10L8.6 7.9V12.1Z" fill="#1A4FB0"/><rect x="22" y="3.5" width="88" height="13" fill="#1F5FC8"/><rect x="22" y="5.5" width="88" height="3" fill="#fff" opacity=".24"/><rect x="104" y="3.5" width="12" height="13" rx="2" fill="#E8B4B8"/><rect x="100" y="3.5" width="4" height="13" fill="#C9A15A"/></svg></span>' },
  };
  // اندازهٔ هر کاشی در بنتو: پهن (w2)، بلند (t2) یا هر دو
  const SPAN = { hokm: 'w2 t2', football: 't2', billiard: '', snakes: '', divar: 'w2', ludo: '', esmfamil: '', lashgar: 'w2' };
  const ORDER = ['hokm', 'football', 'billiard', 'snakes', 'divar', 'ludo', 'esmfamil', 'lashgar'];
  const ESM = '<span class="lt" aria-hidden="true"><span style="background:#FFA552;color:#3A2000;transform:rotate(-8deg)">ب</span><span style="background:#FF7A85;color:#3A0A10;transform:rotate(6deg)">م</span><span style="background:#8E7CF8;color:#fff;transform:rotate(-3deg)">الف</span></span>';

  function render() {
    $('gmCats').innerHTML = CATS.map(([id, label, ic]) => `<button class="gm-cat" data-c="${id}" aria-pressed="${cat === id}">${icon(ic)}${label}</button>`).join('');
    const list = GC.GAMES.filter(g => cat === 'all' || g.cat === cat);
    const rank = g => { const i = ORDER.indexOf(g.id); return i < 0 ? 99 : i; };
    const live = list.filter(g => !g.soon).sort((a, b) => rank(a) - rank(b)), soon = list.filter(g => g.soon);
    let html = live.map(g => {
      const I = INFO[g.id] || INFO.divar;
      return `<a class="gm-ct ${SPAN[g.id] ?? ''}" href="${g.href}" style="--sh:${I.sh}"><span class="bg" aria-hidden="true">${I.bg()}</span>${I.out()}
        ${g.tag ? `<span class="gm-tag${g.tag === 'تازه' ? ' new' : ''}">${g.tag}</span>` : ''}
        <b>${g.name}</b><small>${I.d}</small><span class="gm-facts">${I.f.map(([i, t]) => `<span>${icon(i)}${t}</span>`).join('')}</span></a>`;
    }).join('');
    html += soon.map(g => `<div class="gm-soon">${ESM}<span class="t"><b>${g.name}</b><small>به‌زودی میاد</small></span>
      <button class="gm-notify${notify.includes(g.id) ? ' on' : ''}" data-notify="${g.id}" aria-pressed="${notify.includes(g.id)}">${icon(notify.includes(g.id) ? 'check' : 'bell')}${notify.includes(g.id) ? 'خبرت می‌کنیم' : 'خبرم کن'}</button></div>`).join('');
    $('gmList').innerHTML = html || '<p class="gm-empty">تو این دسته فعلاً بازی‌ای نیست</p>';
    GCPreview.watch($('gmList'));
    mount();
  }
  $('gmCats').onclick = e => { const b = e.target.closest('[data-c]'); if (b && b.dataset.c !== cat) { cat = b.dataset.c; GC.sfx.tap(); render(); } };
  $('gmList').onclick = async e => {
    const b = e.target.closest('[data-notify]'); if (!b) return;
    b.disabled = true;
    try { const r = await GC.data.notify(b.dataset.notify); notify = r.on ? [...notify, b.dataset.notify] : notify.filter(x => x !== b.dataset.notify); toast(r.on ? 'اومد خبرت می‌کنیم' : 'باشه دیگه خبرت نمی‌کنیم'); render(); }
    catch (err) { toast(errText(err)); b.disabled = false; }
  };
  async function load() {
    try {
      const me = await GC.refreshMe();
      style = Object.assign({ table: 'a', cards: 'a' }, me.style || {}); notify = me.notify || [];
    } catch (e) { toast(errText(e)); }
    render();
  }
  render();
  GC.page(load);
  GC.nav('games'); mount();
})();
</script>
</body>
</html>

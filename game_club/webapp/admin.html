<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Game Club · پنل مدیریت</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/gc.css">
<style>
/* پنل مدیریت: تب های بالا، کارت های آمار، فهرست ها و برگه های کار */
.page{gap:var(--space-4);padding-block-end:calc(48px + var(--sa-b,0px))}
.tabs{position:sticky;top:calc(var(--sa-t,0px) + var(--csa-t,0px) + 56px);z-index:5;display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;
  margin-inline:calc(-1 * var(--space-4));padding:var(--space-2) var(--space-4);background:linear-gradient(var(--ground) 80%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none;min-height:36px;font-size:13.5px}
.tabs .chip svg{width:16px;height:16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.kpi{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--depth-sm);padding:var(--space-3);display:grid;gap:2px;min-width:0}
.kpi span{font-size:12px;line-height:18px;color:var(--ink-muted);font-weight:700}
.kpi b{font-size:22px;line-height:30px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi small{font-size:11.5px;color:var(--ink-muted)}
.kpi.hot{background:linear-gradient(135deg,var(--sky),var(--violet));color:var(--on-fill)}
.kpi.hot span,.kpi.hot small{color:rgba(255,255,255,.82)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3DD08E;margin-inline-end:6px}
.money{display:grid;gap:var(--space-2)}
.money .r{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--line)}
.money .r:last-child{border-bottom:0}
.money .r span{color:var(--ink-muted);font-weight:700;font-size:13.5px}
.money .r b{font-weight:900}
.money .r b{text-align:end}
.money .r em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--ink-muted)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:var(--space-2);direction:ltr}
.chart i{flex:1;min-width:0;border-radius:6px 6px 2px 2px;background:var(--sky);position:relative;min-height:3px}
.chart i.z{background:var(--line)}
.chart i:last-child{background:var(--violet)}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted);direction:ltr;margin-top:4px}
.games3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.games3 div{background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-2);text-align:center}
.games3 b{display:block;font-size:18px;font-weight:900}
.games3 span{font-size:12px;color:var(--ink-muted)}
.search{display:flex;align-items:center;gap:var(--space-2);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--depth-sm);padding:0 var(--space-3)}
.search svg{width:18px;height:18px;color:var(--ink-muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-weight:700;padding:12px 0;color:var(--ink);outline:none}
.row{cursor:pointer}
.row .end{display:grid;justify-items:end;gap:2px;font-weight:900;font-size:14px}
.row .end small{font-size:11.5px;font-weight:600;color:var(--ink-muted)}
.row .avatar{width:42px;height:42px}
.ban{background:var(--danger);color:#fff}
.t-ok{background:var(--success-tint);color:var(--success)}
.t-off{background:var(--surface-sunk);color:var(--ink-muted)}
.t-live{background:var(--sky-tint);color:var(--sky-deep)}
.prof{display:grid;justify-items:center;gap:var(--space-1);text-align:center}
.prof .avatar{width:76px;height:76px;font-size:30px}
.prof h2{font-size:20px;font-weight:900;margin:var(--space-1) 0 0}
.prof .id{font-size:12.5px;color:var(--ink-muted);direction:ltr;cursor:pointer}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);width:100%;margin-top:var(--space-2)}
.facts div{background:var(--surface-sunk);border-radius:var(--radius-md);padding:var(--space-2) 2px}
.facts b{display:block;font-weight:900;font-size:16px}
.facts span{font-size:11.5px;color:var(--ink-muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);width:100%;margin-top:var(--space-3)}
.acts .btn{min-height:46px;font-size:14px}
.plus-a{color:var(--success)}
.minus-a{color:var(--danger)}
textarea,.in{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:var(--radius-md);background:var(--surface);font:inherit;font-weight:600;color:var(--ink);padding:10px 12px;outline:none}
textarea:focus,.in:focus{border-color:var(--sky)}
textarea{min-height:130px;resize:vertical;line-height:24px}
.fld{display:grid;gap:6px}
.fld>label{font-weight:800;font-size:13.5px}
.fld .hint{margin:0;text-align:start}
.bar{height:8px;border-radius:99px;background:var(--surface-sunk);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--violet));border-radius:inherit;transition:width .4s}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{display:block;font-weight:900}
.set small{display:block;font-size:12px;line-height:18px;color:var(--ink-muted)}
.set .reset{color:var(--sky-deep);font-weight:800;font-size:12px;cursor:pointer}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--surface-sunk);font-size:18px;font-weight:900}
.step b{min-width:34px;text-align:center}
.warn{background:#FFF1E0;color:#8A4B00;border-radius:var(--radius-lg);padding:var(--space-3);font-weight:800;font-size:13.5px;display:flex;gap:var(--space-2);align-items:center}
.warn svg{width:20px;height:20px;flex:none}
.more{justify-self:center}
.empty{padding:var(--space-5) var(--space-3);text-align:center;color:var(--ink-muted);font-weight:700}
.sk{height:58px;border-radius:var(--radius-lg);background:linear-gradient(90deg,var(--surface-sunk),var(--surface) 50%,var(--surface-sunk));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--space-3);font-size:14px}
.kv span{color:var(--ink-muted);font-weight:700}
.kv b{font-weight:800;overflow-wrap:anywhere}
.demo-tag{position:fixed;inset-inline-start:12px;bottom:calc(12px + var(--sa-b,0px));z-index:30}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-cap"><span>پنل مدیریت</span></div>
  <div class="appbar-in">
    <div class="top-l"><a class="icon-btn back" href="index.html" id="backBtn" aria-label="برگشت"><i data-ic="back"></i></a><h1 id="title">پنل مدیریت</h1></div>
    <button class="icon-btn" id="reload" aria-label="تازه کردن"><i data-ic="clock"></i></button>
  </div>
</header>
<main class="page">
  <nav class="tabs" id="tabs" aria-label="بخش ها"></nav>
  <div id="view" class="stack"></div>
</main>
<script src="static/gc.js"></script>
<script src="static/demo.js"></script>
<script>
(() => {
const { fa, FD, icon, toast, sheet, sheetHead, close, haptic, errText, face, idem, mount } = GC;
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// چند آیکن اضافه که فقط در پنل لازم است
const XP = {
  dash: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  mega: '<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a3 3 0 0 1 0 6M18 6a7 7 0 0 1 0 12"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  minus: '<path d="M5 12h14"/>',
  warn: '<path d="M12 3l9.5 17h-19zM12 10v4M12 17h.01"/>',
};
const ic = (n, w) => XP[n] ? icon('x', w).replace('</svg>', XP[n] + '</svg>') : icon(n, w);
const when = t => { if (!t) return '—'; const d = Math.round((Date.now() / 1000 - t) / 60); return d < 1 ? 'همین حالا' : d < 60 ? FD(d) + ' دقیقه پیش' : d < 1440 ? FD(Math.round(d / 60)) + ' ساعت پیش' : FD(Math.round(d / 1440)) + ' روز پیش'; };
const date = t => t ? new Date(t * 1000).toLocaleDateString('fa-IR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const GAME = { ludo: ['منچ', 'dice'], hokm: ['حکم', 'card'], football: ['فوتبال', 'bolt'] };
const KIND = { charge: 'شارژ', entry: 'ورودی', refund: 'بازگشت', prize: 'جایزه', admin: 'پشتیبانی', transfer: 'انتقال به عبور', shop: 'خرید', gift: 'هدیه', style: 'میز و ورق' };
const ACT = { points: 'تغییر امتیاز', ban: 'مسدود کردن', unban: 'رفع مسدودی', message: 'پیام مستقیم', close: 'بستن میز', broadcast: 'پیام همگانی', broadcast_cancel: 'توقف پیام همگانی', setting: 'تنظیمات' };
const SET = {
  maintenance: ['حالت تعمیرات', 'میز تازه ساخته نمی‌شود؛ بازی‌های در جریان ادامه دارند. ادمین‌ها مستثنا هستند.'],
  stake_enabled: ['بازی با امتیاز', 'خاموش = فقط بازی آزاد (بدون ورودی و جایزه).'],
  turn_seconds: ['زمان هر نوبت (ثانیه)', 'برای میزهای تازه.'],
  bot_fill_seconds: ['پر کردن صف با ربات (ثانیه)', '۰ = صف آزاد هیچ‌وقت خودکار با ربات پر نمی‌شود.'],
  rake_percent: ['سهم عبور از جایزه (٪)', 'از جمع ورودی‌ها کم می‌شود.'],
  notice: ['اطلاعیهٔ صفحهٔ خانه', 'یک خط بالای صفحهٔ خانه برای همه؛ خالی = بدون اطلاعیه.'],
};
const TABS = [['dash', 'داشبورد', 'dash'], ['users', 'کاربران', 'users'], ['tables', 'میزها', 'table'], ['ledger', 'تراکنش‌ها', 'wallet'], ['bc', 'پیام همگانی', 'mega'], ['settings', 'تنظیمات', 'gear'], ['log', 'گزارش', 'list']];

/* ---------- ارتباط با سرور (بیرون از تلگرام: داده نمونه برای دیدن ظاهر) ---------- */
const call = (name, opt = {}) => GC.live ? GC.api(name, opt) : Promise.resolve(MOCK(name, opt));
const get = (name, q) => call(name, q ? { q } : {});
const post = (name, body) => call(name, { body });
async function act(name, body, ok) {
  try { const r = await post(name, body); haptic('success'); if (ok) toast(ok); return r; }
  catch (e) { haptic('error'); toast(ERR[e.code] || errText(e)); throw e; }
}
const ERR = { not_found: 'پیدا نشد (یا دسترسی ادمین نداری)', bad_amount: 'مقدار درست نیست', done_before: 'این کار قبلا انجام شده', insufficient: 'امتیاز کاربر کافی نیست',
  bad_text: 'تلگرام متن را نپذیرفت؛ برچسب‌های HTML را بررسی کن', send_blocked: 'کاربر ربات را بسته است', send_failed: 'پیام نرسید', not_open: 'این میز دیگر باز نیست', bad_input: 'ورودی درست نیست' };

/* ---------- مسیر و تب ها ---------- */
let route = '', poll = null;
function go(r, replace) { if (replace) history.replaceState(null, '', '#' + r); else location.hash = r; }
function renderTabs(cur) {
  $('tabs').innerHTML = TABS.map(([k, t, i]) => `<button class="chip sm" data-tab="${k}" aria-pressed="${cur === k}">${ic(i, 2.2)}${t}</button>`).join('');
  const on = $('tabs').querySelector('[aria-pressed="true"]'); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
$('reload').onclick = () => { haptic('light'); show(); };
const view = html => { $('view').innerHTML = html; mount(); };
const loading = () => view(`<div class="sk"></div><div class="sk"></div><div class="sk"></div>`);
async function show() {
  clearInterval(poll); poll = null;
  route = location.hash.slice(1) || 'dash';
  const [r, arg] = route.split('=');
  renderTabs(r === 'user' ? 'users' : r);
  GC.back(r === 'user' ? () => history.back() : 'index.html');
  $('title').textContent = r === 'user' ? 'کاربر' : (TABS.find(t => t[0] === r) || TABS[0])[1];
  loading();
  try { await (PAGES[r] || PAGES.dash)(arg); }
  catch (e) { view(`<div class="card empty">${esc(ERR[e.code] || errText(e))}</div>`); }
}
window.addEventListener('hashchange', show);

/* ---------- داشبورد ---------- */
let span = 'day', chartKey = 'games', dash = null;
const PAGES = {};
PAGES.dash = async () => {
  dash = await get('admin');
  drawDash();
  poll = setInterval(async () => { if (route !== 'dash' || document.hidden) return; try { dash = await get('admin'); drawDash(); } catch (e) {} }, 15000);
};
function drawDash() {
  const s = dash.stats, a = s.all, p = s[span], rate = dash.rate;
  const max = Math.max(1, ...dash.daily.map(d => d[chartKey]));
  const live = s.live_by_game || {}, week = s.by_game || {};
  view(`
    ${dash.maintenance ? `<div class="warn">${ic('warn')}حالت تعمیرات روشن است؛ میز تازه ساخته نمی‌شود.</div>` : ''}
    <div class="kpis">
      <div class="kpi hot"><span><i class="dot"></i>آنلاین الان</span><b>${fa(s.online)}</b><small>${fa(a.playing)} میز در بازی · ${fa(a.queue)} در صف</small></div>
      <div class="kpi"><span>بازیکن‌ها</span><b>${fa(a.players)}</b><small>+${fa(s.new_day)} امروز · +${fa(s.new_week)} این هفته</small></div>
      <div class="kpi"><span>فعال</span><b>${fa(s.active_day)}</b><small>۲۴ ساعت · ${fa(s.active_week)} در ۷ روز</small></div>
      <div class="kpi"><span>امتیاز در گردش</span><b>${fa(a.points)}</b><small>${fa(a.points * rate)} تومان</small></div>
    </div>
    <section class="card stack">
      <div class="seg" id="span"><button data-v="day" aria-pressed="${span === 'day'}">۲۴ ساعت</button><button data-v="week" aria-pressed="${span === 'week'}">۷ روز</button><button data-v="all" aria-pressed="${span === 'all'}">کل</button></div>
      <div class="money">
        <div class="r"><span>بازی تمام‌شده</span><b>${fa(p.games)}</b></div>
        <div class="r"><span>شارژ از عبور</span><b>${fa(p.charge)}<em>${fa(p.charge * rate)} تومان</em></b></div>
        <div class="r"><span>ورودی بازی‌ها</span><b>${fa(p.entry)}</b></div>
        <div class="r"><span>جایزه داده‌شده</span><b>${fa(p.prize)}</b></div>
        <div class="r"><span>خرج و انتقال به عبور</span><b>${fa(p.shop)}</b></div>
      </div>
    </section>
    <section class="card stack">
      <div class="sec-head" style="margin:0"><h2>۱۴ روز اخیر</h2></div>
      <div class="seg" id="chartK"><button data-v="games" aria-pressed="${chartKey === 'games'}">بازی</button><button data-v="new" aria-pressed="${chartKey === 'new'}">بازیکن تازه</button><button data-v="charge" aria-pressed="${chartKey === 'charge'}">شارژ</button></div>
      <div class="chart" role="img" aria-label="نمودار روزانه">${dash.daily.map(d => `<i class="${d[chartKey] ? '' : 'z'}" style="height:${Math.max(3, d[chartKey] / max * 100)}%" title="${fa(d[chartKey])}"></i>`).join('')}</div>
      <div class="chart-x"><span>${date(dash.daily[0].t).split('،')[0]}</span><span>امروز: ${fa(dash.daily[dash.daily.length - 1][chartKey])}</span></div>
    </section>
    <section class="card stack">
      <div class="sec-head" style="margin:0"><h2>بازی‌ها</h2><span class="aside">در بازی الان · ۷ روز</span></div>
      <div class="games3">${Object.entries(GAME).map(([k, [t]]) => `<div><b>${fa(live[k] || 0)}</b><span>${t} · ${fa(week[k] || 0)} بازی</span></div>`).join('')}</div>
    </section>
    ${(dash.bc || []).map(b => bcCard(b)).join('')}
    <section class="card stack">
      <div class="sec-head" style="margin:0"><h2>کارهای سریع</h2></div>
      <div class="acts" style="margin:0">
        <button class="btn btn-soft" data-go="bc">${ic('mega')}پیام همگانی</button>
        <button class="btn btn-soft" data-go="users">${ic('search')}پیدا کردن کاربر</button>
        <button class="btn btn-soft" data-go="tables">${ic('table')}میزهای باز</button>
        <button class="btn btn-soft" data-go="settings">${ic('gear')}تنظیمات</button>
      </div>
    </section>`);
  $('span').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { span = b.dataset.v; drawDash(); } };
  $('chartK').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { chartKey = b.dataset.v; drawDash(); } };
}
$('view').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const u = e.target.closest('[data-user]'); if (u) { go('user=' + u.dataset.user); return; }
  const t = e.target.closest('[data-table]'); if (t) openTable(t.dataset.table);
});

/* ---------- کاربران ---------- */
let uq = { q: '', f: 'all', sort: 'recent' }, uPage = 0, uList = [], uMore = false, uTimer = 0;
const userRow = u => `<li class="row" data-user="${u.id}">${face(u, u.banned ? 'var(--danger)' : 'var(--sky)')}<span class="name">${esc(u.name || 'بی‌نام')}${u.banned ? ' <span class="tag ban">مسدود</span>' : ''}<span class="meta" dir="auto">${u.username ? '@' + esc(u.username) + ' · ' : ''}${when(u.seen)}</span></span><span class="end">${fa(u.points)}<small>${fa(u.games)} بازی</small></span></li>`;
PAGES.users = async () => {
  view(`
    <label class="search">${ic('search')}<input id="uq" type="search" placeholder="نام، @یوزرنیم یا آیدی عددی" value="${esc(uq.q)}" enterkeyhint="search" autocomplete="off"></label>
    <div class="chips" id="uf">${[['all', 'همه'], ['active', 'فعال ۷ روز'], ['rich', 'دارای امتیاز'], ['banned', 'مسدود']].map(([k, t]) => `<button class="chip sm" data-f="${k}" aria-pressed="${uq.f === k}">${t}</button>`).join('')}</div>
    <div class="seg" id="us">${[['recent', 'آخرین بازدید'], ['new', 'تازه‌ها'], ['points', 'امتیاز'], ['games', 'بازی']].map(([k, t]) => `<button data-v="${k}" aria-pressed="${uq.sort === k}">${t}</button>`).join('')}</div>
    <ul class="list" id="ul"><li class="sk"></li></ul>
    <button class="btn btn-light more" id="umore" hidden>بیشتر</button>`);

    const [t, d] = SET[s.key] || [s.key, ''];
    const ctl = s.kind === 'bool' ? `<button class="switch" role="switch" aria-checked="${!!s.value}" data-k="${s.key}" aria-label="${t}"></button>`
      : s.kind === 'int' ? `<span class="step"><button data-k="${s.key}" data-d="-1" aria-label="کم">−</button><b>${fa(s.value)}</b><button data-k="${s.key}" data-d="1" aria-label="زیاد">+</button></span>` : '';
    return `<div class="set"><span><b>${t}</b><small>${d}</small><small>${s.custom ? `از پنل تنظیم شده · پیش‌فرض: ${esc(envTxt(s))} · <span class="reset" data-reset="${s.key}">برگرداندن</span>` : 'پیش‌فرض (.env)'}</small>
      ${s.kind === 'text' ? `<input class="in" data-txt="${s.key}" maxlength="${s.max}" value="${esc(s.value)}" placeholder="مثلا: جام هفتگی حکم، جمعه ساعت ۲۱" style="margin-top:8px">` : ''}</span>${ctl}</div>`;
  }).join('')}</section>
  <p class="hint">تغییرها حداکثر ظرف ۱۰ ثانیه روی همهٔ بخش‌ها اعمال می‌شود و بر مقدار فایل ‎.env مقدم است.</p>`);
  const save = async (key, value) => { try { const x = await act('admin/setting', { key, value }, 'ذخیره شد'); drawSettings(x.settings); } catch (e) {} };
  $('view').querySelectorAll('.switch[data-k]').forEach(b => { b.onclick = () => save(b.dataset.k, b.getAttribute('aria-checked') !== 'true'); });
  $('view').querySelectorAll('.step button').forEach(b => {
    b.onclick = () => { const s = list.find(x => x.key === b.dataset.k), step = s.key === 'turn_seconds' ? 1 : s.key === 'bot_fill_seconds' ? 5 : 1; save(s.key, Math.min(s.max, Math.max(s.min, s.value + step * +b.dataset.d))); };
  });
  $('view').querySelectorAll('[data-reset]').forEach(b => { b.onclick = () => save(b.dataset.reset, null); });
  $('view').querySelectorAll('[data-txt]').forEach(i => { i.onchange = () => save(i.dataset.txt, i.value.trim() || null); });
}

  if (name === 'admin/users') { let l = MU.filter(u => !q.q || u.name.includes(q.q) || String(u.id).includes(q.q) || (u.username || '').includes(q.q)); if (q.f === 'banned') l = l.filter(u => u.banned); if (q.f === 'rich') l = l.filter(u => u.points > 0);

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Obour | عبور</title>
<link rel="preload" href="__BASE__static/fonts/peyda-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="__BASE__static/fonts/peyda-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="__BASE__static/peyda.css">
<link rel="stylesheet" href="__BASE__static/custom-font.css">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
/* ═══════════════════════════════════════════════
   عبور — کارت عبور · نسخه 6
   از روی سیستم طراحی «عبور — کارت عبور». فقط تم روشن.

   اصول (از کتاب برند):
   - رنگ یعنی معنا: فیروزه ای اینترنت، کهربایی پول، بنفش AI،
     مرجانی پشتیبانی. آبی brand فقط اقدام اصلی — یکی در هر صفحه.
   - یک قهرمان در هر صفحه.
   - سطح تخت با خط مو؛ سایه فقط زیر کارت عبور، ناوبری و شیت.
     بدون بلور، بدون هاله، بدون گرادیان پس زمینه.
   ═══════════════════════════════════════════════ */
:root{
  --ground:#EDF1F8; --surface:#FFFFFF; --sunk:#E3E9F3; --line:#D5DDEA;
  --ink:#0A1633; --ink-2:#3E4B69; --ink-3:#56637F;
  --brand:#1D55F0; --on-brand:#FFFFFF;
  --navy:#0A2572; --deep:#071B55; --ocean:#0B5F74; --indigo:#3F2FA0; --ember:#8C3A17;
  --on-pass:#F1F6FF; --on-pass-2:#A9C4F5; --tunnel:#46E1F4;
  --net:#0E8FAE; --net-t:#D8F1F7; --net-i:#06505F;
  /* دکمه خرید اینترنت. --net زیر متن سفید 3.78:1 بود؛ این پله تیره تر 4.96:1 */
  --net-btn:#0A7A96; --net-btn-d:#086A83;
  --cash:#E09A1F; --cash-t:#FCEFD3; --cash-i:#7A4A00;
  --ai:#6A55E0; --ai-t:#E7E3FC; --ai-i:#3F2DA6;
  --help:#E0573E; --help-t:#FCE4DE; --help-i:#9B2F1B;
  --ok:#0B7A55; --warn:#8A5D00; --bad:#C0392B;
  --nav-bg:#0A1633; --nav-icon:#9AAACB; --nav-on:#EDF1F8;
  --shadow-pass:0 18px 34px -18px rgba(10,37,114,.55);
  --shadow-sheet:0 -12px 40px -12px rgba(10,22,51,.28);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
  --pad:22px;
  --ease:cubic-bezier(.22,.9,.3,1); --spring:cubic-bezier(.34,1.3,.5,1);

  /* فاصله های امن تلگرام (Bot API 8.0): safe = دستگاه، csafe = دکمه های تلگرام */
  --safe-t:max(env(safe-area-inset-top,0px), var(--tg-sa-t,0px));
  --safe-b:max(env(safe-area-inset-bottom,0px), calc(var(--tg-sa-b,0px) + var(--tg-csa-b,0px)));
  --safe-l:max(env(safe-area-inset-left,0px), var(--tg-sa-l,0px));
  --safe-r:max(env(safe-area-inset-right,0px), var(--tg-sa-r,0px));
  --top:calc(var(--safe-t) + var(--tg-csa-t,0px));
  --vh:100vh;
  --nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ground)}
body{
  font-family:var(--font-custom,'Peyda'),'Peyda',system-ui,sans-serif;
  color:var(--ink);font-size:15px;line-height:1.6;overflow:hidden;
  display:flex;justify-content:center;
}
button,a{font-family:inherit;color:inherit;text-decoration:none;cursor:pointer}
button{border:none;background:none}
::-webkit-scrollbar{display:none}

/* تور ایمنی SVG. آیکنی که اندازه صریح ندارد کل عرض پدرش را می گیرد -
   همان فلش غول پیکر روی کارت لینک دعوت در 6.0.0، و شکل سفید بزرگ در
   5.10.0. این قاعده اول فایل است تا هر قاعده خاص تر بعدی بر آن غالب
   شود؛ فقط SVG هایی را می گیرد که هیچ کس اندازه شان را تعیین نکرده. */
svg:not([width]){width:1.2em;height:1.2em;flex-shrink:0}

/* عدد: رقم لاتین، ۸۰۰، عرض ثابت */
.n{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ═══ قاب ═══ */
#app{position:relative;width:100%;max-width:480px;height:var(--vh);overflow:hidden;background:var(--ground)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 6px) var(--safe-r) calc(var(--nav-h) + 40px + var(--safe-b)) var(--safe-l)}
#app.no-nav .scroll{padding-bottom:calc(96px + var(--safe-b))}
.page{animation:rise .32s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sub{position:absolute;inset:0;z-index:30;pointer-events:none}
#sub .scroll{background:var(--ground);pointer-events:auto;animation:slide .3s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* ═══ سربرگ صفحه ═══ */
.topbar{display:flex;align-items:center;gap:12px;padding:14px var(--pad) 8px}
.topbar-t{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.35}
.topbar-s{font-size:12px;color:var(--ink-3)}
.back{width:42px;height:42px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* برگشت بومی تلگرام که هست، دکمه داخل صفحه تکراری است */
html.tg-back .back{display:none}
.hello{display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad) 2px}
.hello-s{font-size:13px;color:var(--ink-3)}
.hello-t{font-size:22px;font-weight:800;letter-spacing:-.3px}
.logo{width:40px;height:40px;border-radius:12px;display:block}

.sec{display:flex;align-items:center;justify-content:space-between;padding:24px var(--pad) 10px}
.sec-t{font-size:17px;font-weight:800}
.sec-e{font-size:12px;color:var(--ink-3)}
.gap{height:12px}
.mx{margin:0 var(--pad)}

/* ═══ کارت عبور ═══ */
.pass{
  --p:var(--navy); --p2:var(--on-pass-2); --pd:var(--deep);
  position:relative;height:214px;border-radius:var(--r-xl);background:var(--p);color:var(--on-pass);
  padding:20px 20px 18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-pass);
}
/* رنگ ثانویه سیستم روی اقیانوسی (4.1:1) و آجری (4.4:1) زیر حد بود */
.pass.ocean{--p:var(--ocean);--p2:#D3E4EE;--pd:rgba(0,0,0,.24)}
.pass.indigo{--p:var(--indigo);--p2:#D3E4EE;--pd:rgba(0,0,0,.24)}
.pass.ember{--p:var(--ember);--p2:#D3E4EE;--pd:rgba(0,0,0,.24)}
.pass.dim{filter:saturate(.55)}
.pass > *{position:relative}
.pass-art{position:absolute !important;left:-40px;bottom:-60px;opacity:.18;pointer-events:none}
.pass-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pass-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-st{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--pd);font-size:12px;font-weight:600;flex-shrink:0}
.pass-st i{width:7px;height:7px;border-radius:4px;background:var(--tunnel)}
.pass-st.warn i{background:#FBBF24} .pass-st.bad i{background:#F87171}
.pass-big{display:flex;align-items:baseline;gap:6px;margin-top:18px}
.pass-num{font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.pass-unit{font-size:15px;font-weight:600;color:var(--p2)}
.pass-rail{height:5px;border-radius:3px;background:var(--pd);margin-top:16px;overflow:hidden}
.pass-rail span{display:block;height:5px;border-radius:3px;background:var(--tunnel);transition:width .8s var(--ease)}
.pass-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:10px}
.pass-meta{font-size:12px;color:var(--p2)}
.pass-meta .n{color:var(--on-pass)}
.pass-btn{height:34px;padding:0 14px;border-radius:17px;background:var(--on-pass);color:var(--p);font-size:13px;font-weight:800;display:flex;align-items:center;flex-shrink:0}
.pass-btn:active{transform:scale(.95)}
.pass-btn svg{width:17px;height:17px}

/* ═══ اسلایدر کارت عبور ═══
   هر سرویس یک کارت؛ با انگشت ورق می خورند. scroll-snap جای کارت را
   تضمین می کند (بومی، روان حتی روی گوشی ضعیف)، و جاوااسکریپت فقط حالت
   کارت های کناری را با فاصله شان از مرکز تنظیم می کند: کمی عقب تر،
   کمی چرخیده، کمی کم رنگ تر - حس ورق زدن یک دسته کارت. */
.slider{position:relative}
.slides{display:flex;gap:12px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;
  padding:6px var(--pad) 26px;scroll-padding-inline:var(--pad);scrollbar-width:none;perspective:900px;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.slide{flex:0 0 84%;scroll-snap-align:center;scroll-snap-stop:always;transform-origin:50% 100%;
  will-change:transform;transition:opacity .2s}
.slide:only-child{flex-basis:100%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-10px}
.dot{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .3s var(--spring),background .3s}
.dot.on{width:20px;background:var(--navy)}
html.perf-low .slide{transform:none !important;opacity:1 !important}

/* ═══ کارت لینک دعوت ═══
   نسخه 6.0.0 لینک و دو دکمه را در یک ردیف فشرده بود؛ دکمه اشتراک متن
   دوخطی شد و آیکن های بی اندازه روی همه چیز افتادند. حالا سه طبقه:
   عنوان، لینک با دکمه کپی کنارش، و اشتراک تمام عرض. */
.invite{height:auto;gap:14px;cursor:default}
.invite-h{display:flex;align-items:center;gap:12px}
.invite-link{display:flex;align-items:center;gap:8px;background:var(--deep);border-radius:var(--r-md);padding:6px 6px 6px 12px}
.invite-url{flex-grow:1;min-width:0;direction:ltr;text-align:left;font-size:12.5px;font-weight:600;color:var(--on-pass-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline-start:6px}
.invite-copy{flex-shrink:0;height:38px;padding:0 12px;border-radius:11px;background:rgba(255,255,255,.12);color:var(--on-pass);
  display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800}
.invite-copy svg{width:16px;height:16px}
.invite-copy:active,.invite-share:active{transform:scale(.96)}
.invite-share{height:50px;border-radius:var(--r-md);background:var(--on-pass);color:var(--navy);font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.invite-share svg{width:18px;height:18px}

/* ═══ سطح ها ═══ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px}
.group{margin:0 var(--pad);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;text-align:right;background:var(--surface)}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--ground)}
.row-t{font-size:15px;font-weight:600;display:block}
.row-s{font-size:12px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m{flex-grow:1;min-width:0}
.row-e{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.ic{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--sunk);color:var(--ink-2)}
.ic.lg{width:46px;height:46px}
.ic svg{width:19px;height:19px}
.ic.net{background:var(--net-t);color:var(--net-i)} .ic.cash{background:var(--cash-t);color:var(--cash-i)}
.ic.ai{background:var(--ai-t);color:var(--ai-i)} .ic.help{background:var(--help-t);color:var(--help-i)}
.ic.navy{background:var(--navy);color:var(--tunnel)}
.chev{width:16px;height:16px;color:var(--ink-3);flex-shrink:0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--surface)}
.kv + .kv{border-top:1px solid var(--line)}
.kv-k{font-size:13px;color:var(--ink-3)} .kv-v{font-size:14px;font-weight:600;text-align:left}

/* نوار کیف پول */
.wallet{display:flex;align-items:center;gap:12px;padding:14px 16px}
.wallet-l{font-size:12px;color:var(--ink-3)}
.wallet-a{font-size:20px}

/* کاشی دسته */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 var(--pad)}
.tile{height:112px;border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:right}
.tile svg{width:24px;height:24px}
.tile-t{font-size:15px;font-weight:800;display:block}
.tile-s{font-size:11px;display:block}
.tile.net{background:var(--net-t);color:var(--net-i)} .tile.ai{background:var(--ai-t);color:var(--ai-i)}
.tile:active{transform:scale(.97)}

/* ═══ دکمه ها ═══ */
.btn{height:52px;border-radius:var(--r-md);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-s{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn-d{background:var(--ink);color:var(--ground)}
.btn-sm{height:38px;font-size:13px;padding:0 16px;border-radius:12px}
.btn-sq{width:52px;padding:0}
.btn-block{width:100%}
.btn[disabled]{opacity:.55}

/* ═══ برچسب ═══ */
.badge{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;flex-shrink:0}
.badge i{width:7px;height:7px;border-radius:4px;background:var(--ink-3)}
.badge.ok i{background:var(--ok)} .badge.warn i{background:#E0A000} .badge.bad i{background:var(--bad)} .badge.ai i{background:var(--ai)}

/* ═══ ریل تب ═══ */
.tabs{--n:3;--i:0;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:4px;border-radius:var(--r-md);background:var(--sunk);margin:0 var(--pad)}
.tabs-ind{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px) / var(--n));inset-inline-start:calc(4px + var(--i) * (100% - 8px) / var(--n));
  border-radius:11px;background:var(--surface);box-shadow:0 1px 3px rgba(10,22,51,.12);transition:inset-inline-start .36s var(--spring)}
.tab{position:relative;z-index:1;padding:7px 2px;display:flex;flex-direction:column;align-items:center;color:var(--ink-3);transition:color .2s}
.tab-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.tab-t svg{width:14px;height:14px}
.tab-s{font-size:10px}
.tab.on{color:var(--ink)} .tab.on .tab-t{font-weight:800}
.tabs.scroll{display:flex;overflow-x:auto;gap:2px} .tabs.scroll .tabs-ind{display:none}
.tabs.scroll .tab{flex:0 0 auto;padding:7px 14px} .tabs.scroll .tab.on{background:var(--surface);border-radius:11px}

/* ═══ انتخاب نوع محصول ═══ */
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px var(--pad) 14px}
.kind{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:right;transition:border-color .2s}
.kind.on{border:2px solid var(--brand);padding:13px}
.kind-t{font-size:14px;font-weight:800;display:block} .kind-s{font-size:11px;color:var(--ink-3);display:block}
.kind-ok{position:absolute;top:11px;left:11px;width:20px;height:20px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:none;align-items:center;justify-content:center}
.kind-ok svg{width:12px;height:12px}
.kind.on .kind-ok{display:flex}

/* ═══ پلن ═══ */
.plan{padding:16px;display:flex;flex-direction:column;gap:14px}
.plan-name{font-size:16px;font-weight:800}
.short{font-size:12px;color:var(--ink-3);text-align:center}

/* ═══ زبان های چپ به راست ═══
   مینی اپ فارسی و انگلیسی دارد (ربات چهار زبان). چیدمان با
   ویژگی های منطقی (inset-inline، gap) نوشته شده و خودش برمی گردد؛ این
   چند قاعده فقط جاهایی است که سمت راست صریح بود. */
html[dir=ltr] .row, html[dir=ltr] .tile, html[dir=ltr] .kind, html[dir=ltr] .loc-top{text-align:left}
html[dir=ltr] .kv-v{text-align:right}
html[dir=ltr] [style*="text-align:right"]{text-align:left !important}
html[dir=ltr] .chev svg, html[dir=ltr] .back svg, html[dir=ltr] .loc-all svg{transform:scaleX(-1)}
html[dir=ltr] .bubble-row.mine{justify-content:flex-end}
html[dir=ltr] .bubble-row.theirs{justify-content:flex-start}
html[dir=ltr] .bubble-time{float:right;margin:7px 0 0 10px}
/* پیدا برای فارسی ساخته شده و فاصله لاتین و سیریلیک را خیلی باریک
   می کشد (کلمه ها به هم می چسبیدند). انگلیسی با فونت سیستم. */
html:not([lang=fa]) body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.lang-o{height:56px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;font-weight:700}
.lang-o.on{border:2px solid var(--brand);padding:0 13px}
.lang-o span{font-size:20px}

/* ═══ پروفایل (صفحه حساب): سربرگ سرمه ای ═══
   نوار سرمه ای با نقش تونل تا لبه بالای صفحه می رود (حاشیه بالای
   اسکرول را با حاشیه منفی پس می گیرد) و عکس روی لبه پایینش می نشیند.
   اطلاعات بیرون نوار، یک ردیف متن با آیکن کوچک، بدون جعبه. */
.band{position:relative;overflow:hidden;background:var(--navy);color:var(--on-pass);border-radius:0 0 28px 28px;
  margin-top:calc(-6px - var(--top));padding:calc(20px + var(--top)) var(--pad) 0;height:calc(128px + var(--top))}
.band .pass-art{left:-20px;bottom:-80px;top:auto;opacity:.2}
.band-t{position:relative;font-size:22px;font-weight:800;letter-spacing:-.3px}
.me{position:relative;padding:0 var(--pad);margin-top:-46px}
.me-av{position:relative;width:92px;height:92px;border-radius:30px;background:var(--navy);color:var(--tunnel);display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:800;overflow:hidden;box-shadow:0 0 0 5px var(--ground)}
.me-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.me-name{font-size:23px;font-weight:800;line-height:1.35;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-user{font-size:13px;font-weight:600;color:var(--ink-3)}
.me-line{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.me-line > span{display:inline-flex;align-items:center;gap:5px}
.me-line svg{width:15px;height:15px;color:var(--net-i)}
.me-st{color:var(--ok);font-weight:600}
.me-st i{width:6px;height:6px;border-radius:3px;background:currentColor}
.me-st.new{color:var(--ink-3)}

/* ═══ کارت لوکیشن بالای فروشگاه ═══
   همان صفحه «سرورها و لوکیشن ها»ی ربات، کوتاه: تعداد، ردیف کشورها،
   و دو قول مهم (قیمت هر گیگ و تعداد دستگاه). بقیه در شیت. */
.loc{margin:0 var(--pad) 14px;padding:0;overflow:hidden}
.loc-top{display:flex;flex-direction:column;gap:10px;width:100%;padding:14px 16px 12px;text-align:right}
.loc-h{display:flex;align-items:center;gap:12px}
.loc-t{font-size:15px;font-weight:800;display:block}
.loc-s{font-size:12px;color:var(--ink-3);display:block}
.loc-cs{display:flex;flex-wrap:wrap;gap:6px}
.loc-c{height:26px;padding:0 10px;border-radius:13px;background:var(--net-t);color:var(--net-i);font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.loc-c.more{background:var(--sunk);color:var(--ink-2)}
.loc-all{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--net-i);margin-inline-start:auto}
.loc-all svg{width:14px;height:14px}
.loc-f{display:flex;flex-direction:column;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.loc-f div{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.loc-f svg{width:16px;height:16px;color:var(--net-i);margin-top:2px}
.loc-g{padding:12px 0}
.loc-g + .loc-g{border-top:1px solid var(--line)}
.loc-g-t{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.loc-g-n{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ═══ بلیت پلن ═══
   هر پلن یک بلیت ایستاده، دوتا کنار هم. بالای خط برش حجم و مدت،
   پایینش قیمت و خرید. به صرفه ترین پلن بلیت سرمه ای است و اول می آید.
   نیم دایره های دو سر برش هم رنگ زمینه صفحه اند تا بریده به نظر برسند. */
.tickets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;padding:10px var(--pad) 0}
.tickets > :only-child{grid-column:1 / -1}
.tk{position:relative;display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.tk-top{display:flex;flex-direction:column;gap:3px;padding:14px 12px 12px;min-height:100px}
.tk-vol{display:flex;align-items:baseline;gap:4px;color:var(--net-i)}
.tk-vol .n{font-size:32px;letter-spacing:-.9px;line-height:1.05}
.tk-vol small{font-size:12px;font-weight:700}
.tk-s{font-size:11.5px;color:var(--ink-3)}
.tk-cut{height:0;border-top:2px dashed var(--line);margin:0 12px;position:relative}
.tk-cut::before,.tk-cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:9px;background:var(--ground);border:1px solid var(--line)}
.tk-cut::before{right:-22px;clip-path:inset(0 50% 0 0)}
.tk-cut::after{left:-22px;clip-path:inset(0 0 0 50%)}
.tk-bot{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.tk-p{font-size:15px}
.tk-p small{font-size:10.5px;font-weight:600;color:var(--ink-3);margin-inline-start:3px}
.tk-buy{height:38px;border-radius:12px;background:var(--net-btn);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;transition:transform .15s var(--ease)}
.tk-buy svg{width:15px;height:15px}
.tk-buy:active{transform:scale(.97);background:var(--net-btn-d)}
.tk-buy.low{background:var(--cash-t);color:var(--cash-i)}
.tk-tag{position:absolute;top:-10px;inset-inline-start:10px;height:22px;padding:0 9px;border-radius:11px;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tk-tag svg{width:11px;height:11px}
.tk-tag.best{background:var(--tunnel);color:var(--deep)}
.tk-tag.plain{background:var(--ai-t);color:var(--ai-i)}
.tk.best{background:var(--navy);border-color:var(--navy);color:var(--on-pass);box-shadow:var(--shadow-pass)}
.tk.best .tk-vol{color:var(--on-pass)}
.tk.best .tk-s,.tk.best .tk-p small{color:var(--on-pass-2)}
.tk.best .tk-cut{border-color:rgba(169,196,245,.35)}
.tk.best .tk-cut::before,.tk.best .tk-cut::after{border-color:transparent}
.tk.best .tk-buy:not(.short){background:var(--on-pass);color:var(--navy)}

/* بنر ۱۶:۹ */
.banner{margin:0 var(--pad);aspect-ratio:16/9;border-radius:var(--r-xl);overflow:hidden;background:var(--indigo);position:relative}
.banner img{width:100%;height:100%;object-fit:cover;display:block}

/* ═══ نمودار ═══ */
:root{--uc-a:var(--brand);--uc-b:var(--brand)}
.uc{display:block;overflow:visible}
.uc-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.uc-base{stroke:var(--line);stroke-width:1}
.uc-y{font-size:9px;font-weight:600;fill:var(--ink-3);font-family:inherit}
.uc-x{font-size:10px;font-weight:700;fill:var(--ink-2);font-family:inherit}
.uc-line{filter:none;stroke-dasharray:1;stroke-dashoffset:1;animation:ucDraw 1s var(--ease) .1s forwards}
.uc-area{opacity:0;animation:ucFade .7s ease .45s forwards}
.uc-stem{stroke:var(--brand);stroke-width:1.2}
.uc-pill{fill:var(--brand)} .uc-pill-min{fill:var(--net)}
.uc-pill-t{font-size:10px;font-weight:800;fill:#fff;font-family:inherit}
.uc-dot{fill:var(--surface);stroke:var(--brand);stroke-width:2.2}
.uc-halo{display:none}
.uc-pill,.uc-pill-t,.uc-stem,.uc-dot{opacity:0;animation:ucFade .35s ease .9s forwards}
@keyframes ucDraw{to{stroke-dashoffset:0}} @keyframes ucFade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.uc-line{animation:none;stroke-dashoffset:0}.uc-area,.uc-pill,.uc-pill-t,.uc-stem,.uc-dot{animation:none;opacity:1}}
.chart{padding:16px 14px 10px}
.chart-h{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 6px}
.lbl{font-size:11px;font-weight:600;color:var(--ink-3)}

/* ═══ گفتگو ═══ */
.chat{display:flex;flex-direction:column;gap:3px;padding:0 18px}
.bubble-row{display:flex} .bubble-row.mine{justify-content:flex-start} .bubble-row.theirs{justify-content:flex-end}
.bubble-row.turn{margin-top:10px}
.bubble{display:flow-root;max-width:78%;min-width:64px;padding:8px 12px 6px;border-radius:18px;font-size:14px;line-height:1.75}
.bubble-text{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.bubble-time{float:left;margin:7px 10px 0 0;font-size:10px;font-weight:600;opacity:.7;direction:ltr;font-variant-numeric:tabular-nums}
.bubble-mine{background:var(--brand);color:var(--on-brand)}
.bubble-theirs{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.bubble-row.tail.mine .bubble{border-bottom-right-radius:6px}
.bubble-row.tail.theirs .bubble{border-bottom-left-radius:6px}
.bubble-who{display:block;font-size:11px;font-weight:800;color:var(--help-i);margin-bottom:2px}
.bubble-photo{display:flex;align-items:center;gap:7px;padding:8px 10px;margin:2px 0 4px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(0,0,0,.08)}
.bubble-photo svg{width:15px;height:15px}
.day-sep{display:flex;justify-content:center;margin:14px 0 6px}
.day-sep span{padding:4px 12px;border-radius:12px;background:var(--sunk);font-size:11px;font-weight:800;color:var(--ink-2)}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:35;pointer-events:auto;padding:12px var(--pad) calc(18px + var(--safe-b));background:var(--ground);border-top:1px solid var(--line)}

/* ═══ شارژ ═══ */
.amt-in{display:flex;align-items:baseline;gap:8px;margin:6px 0 14px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amt-in:focus-within{border-color:var(--brand)}
.amt-in input{flex-grow:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-weight:800;font-size:36px;line-height:1.2;color:var(--ink);
  letter-spacing:-1px;text-align:left;font-variant-numeric:tabular-nums}
.amt-in span{font-size:15px;font-weight:600;color:var(--ink-3)}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.preset{height:44px;border-radius:12px;background:var(--sunk);color:var(--ink-2);font-size:14px;border:2px solid transparent}
.preset.on{background:var(--cash-t);color:var(--cash-i);border-color:var(--cash)}
.upload{min-height:150px;border:2px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;
  cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.upload.has{border-style:solid;border-color:var(--ok)}
.upload.has::before{content:"";position:absolute;inset:0;background:rgba(10,22,51,.55)}
.upload.has > *{position:relative;color:#fff}
.upload.has .ic{background:var(--ok);color:#fff}
.upload-t{font-size:14px;font-weight:800}

/* ═══ پرداخت کارت به کارت ═══
   بالا مبلغ دقیق با حلقه مهلت، بعد کارت مقصد به شکل کارت بانکی، بعد
   جای عکس رسید و چهار قدم کار. سه رقم آخر مبلغ زیرخط کهربایی دارد تا معلوم باشد چرا
   عدد رند نیست. */
.pay{display:flex;align-items:center;gap:14px;padding:16px}
.pay-m{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pay-v{font-size:30px;letter-spacing:-.8px;line-height:1.15}
.pay-v u{color:var(--cash);text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:6px}
.pay-r{font-size:11.5px;color:var(--ink-3)}
.pay .btn-sm{align-self:flex-start;margin-top:8px;height:34px;padding:0 12px;gap:6px}
.pay .btn-sm svg{width:15px;height:15px}
.clock{position:relative;width:78px;height:78px;flex-shrink:0}
.clock svg{position:absolute;inset:0;width:78px;height:78px;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:6}
.clock .trk{stroke:var(--sunk)}
.clock .arc{stroke:var(--cash);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.clock.low .arc{stroke:var(--help)} .clock.over .arc{stroke:var(--bad)}
.clock-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.clock-in b{font-size:16px}
.clock-in span{font-size:9.5px;font-weight:600;color:var(--ink-3)}
.clock.over .clock-in b{font-size:12px;color:var(--bad)}
.expired{display:flex;gap:10px;align-items:center;margin:10px var(--pad) 0;padding:10px 12px;border-radius:var(--r-md);background:var(--help-t);color:var(--help-i);font-size:12.5px;line-height:1.7}
.expired svg{width:16px;height:16px;flex-shrink:0}
.expired button{margin-inline-start:auto;flex-shrink:0;height:32px;padding:0 12px;border-radius:10px;background:var(--help-i);color:#fff;font-size:12px;font-weight:800}
.bank{position:relative;margin:12px var(--pad) 0;aspect-ratio:1.586;max-height:230px;border-radius:18px;padding:18px;color:var(--on-pass);overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,#1D3F9E 0%,var(--navy) 55%,var(--deep) 100%);box-shadow:var(--shadow-pass);display:flex;flex-direction:column}
.bank > *{position:relative}
.bank .pass-art{left:-30px;bottom:-60px}
.bank-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--on-pass-2)}
.emv{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#E9C77B,#B8893A);margin-top:14px;position:relative}
.emv::after{content:"";position:absolute;inset:7px 9px;border:1.5px solid rgba(90,60,10,.35);border-radius:3px}
.bank-no{margin-top:auto;direction:ltr;text-align:left;font-size:21px;letter-spacing:2.5px;font-weight:800;white-space:nowrap}
.bank-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;font-size:12px;color:var(--on-pass-2)}
.bank-bot b{display:block;font-size:13px;color:var(--on-pass)}
.steps{list-style:none;margin:0;padding:16px}
.steps li{position:relative;display:flex;gap:12px;padding-bottom:14px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;inset-inline-start:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .d{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--net-t);color:var(--net-i)}
.steps li:first-child .d{background:var(--cash-t);color:var(--cash-i)}
.steps li:last-child .d{background:var(--ok);color:#fff}
.steps .d svg{width:14px;height:14px}
.steps b{display:block;font-size:14px;font-weight:800}
.steps p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.8}
.steps-warn{display:flex;gap:8px;align-items:flex-start;margin:0 16px 16px;padding:10px 12px;border-radius:var(--r-md);background:var(--cash-t);color:var(--cash-i);font-size:12.5px;line-height:1.8}
.steps-warn svg{width:16px;height:16px;flex-shrink:0;margin-top:3px}

/* ═══ قوانین و نوشتن ═══ */
.rules{padding:18px;font-size:14px;line-height:2;white-space:pre-wrap;color:var(--ink-2)}
.compose{width:100%;border:none;outline:none;resize:none;background:none;font-family:inherit;font-weight:400;font-size:15px;line-height:1.9;color:var(--ink)}
.compose::placeholder{color:var(--ink-3)}
.foot.reply{display:flex;align-items:flex-end;gap:10px}
.reply-in{flex-grow:1;min-height:48px;max-height:120px;background:var(--surface);border:1px solid var(--line);
  border-radius:24px;padding:11px 16px;line-height:1.6}
.reply-in:focus{border-color:var(--brand)}
.reply-go{width:48px;height:48px;border-radius:24px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reply-go svg{width:20px;height:20px}
.reply-go[disabled]{opacity:.5}

/* ═══ ناوبری شناور ═══ */
#nav{position:absolute;z-index:40;left:var(--pad);right:var(--pad);bottom:calc(18px + var(--safe-b));height:var(--nav-h);
  border-radius:var(--r-xl);background:var(--nav-bg);box-shadow:var(--shadow-pass);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 6px;transition:transform .3s var(--ease)}
#app.no-nav #nav{transform:translateY(140%)}
.nav-i{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:var(--nav-icon)}
.nav-i svg{width:22px;height:22px}
.nav-i:active svg{transform:scale(.88)}
.nav-pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:16px;color:var(--ink);font-size:12px;font-weight:800}
.nav-pill svg{width:18px;height:18px}
.nav-l{animation:navIn .3s var(--ease) .06s both}
@keyframes navIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
/* قرص روشن تب فعال یک عنصر ثابت است که زیر تب ها سر می خورد؛ دکمه ها
   هر بار از نو ساخته می شوند ولی این نه، تا جای قبلی اش را یادش بماند.
   جا و پهنایش را App.placeNav از روی قرص تب فعال اندازه می گیرد. */
.nav-ind{position:absolute;z-index:0;top:calc((var(--nav-h) - 40px) / 2);height:40px;left:0;width:0;border-radius:16px;background:var(--nav-on);
  pointer-events:none;transition:left .45s var(--spring),width .45s var(--spring)}
.nav-ind.still{transition:none}
html.perf-low .nav-ind{transition:left .2s var(--ease),width .2s var(--ease)}
html.perf-low .nav-l{animation:none}
@media (prefers-reduced-motion:reduce){.nav-ind{transition:none}.nav-l{animation:none}}

/* ═══ شیت ═══ */
#scrim{position:absolute;inset:0;z-index:50;background:rgba(10,22,51,.42);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-sheet);padding:10px var(--pad) calc(26px + var(--safe-b));transform:translateY(105%);transition:transform .38s var(--ease)}
#sheet.on{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet-t{font-size:17px;font-weight:800}
.qr{background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);padding:14px;display:flex;justify-content:center}
.qr svg{width:100%;max-width:240px;height:auto;display:block}

/* ═══ توست، اسکلت، خالی ═══ */
#toast{position:absolute;z-index:60;top:calc(var(--top) + 14px);left:50%;transform:translate(-50%,-16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:22px;background:var(--ink);color:var(--ground);font-size:13px;font-weight:600;
  white-space:nowrap;max-width:90%;transition:all .3s var(--spring)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:16px;height:16px}
.sk{background:var(--sunk);border-radius:var(--r-lg);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 22px;text-align:center}
.empty-t{font-size:15px;font-weight:800} .empty-s{font-size:13px;color:var(--ink-3);max-width:260px}
.newpass{margin:0 var(--pad);min-height:236px;border-radius:var(--r-xl);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.stale{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--warn);margin:10px var(--pad) 0}
.stale svg{width:13px;height:13px}
.linkbox{direction:ltr;text-align:left;background:var(--sunk);border-radius:12px;padding:11px 12px;font-size:12.5px;font-weight:600;word-break:break-all;color:var(--ink-2)}
.pass .linkbox{background:var(--deep);color:var(--on-pass-2)}

/* ═══ اسپلش ═══ */
#splash{position:absolute;inset:0;z-index:100;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s,visibility .4s}
#splash.off{opacity:0;visibility:hidden}
#splash .logo{width:72px;height:72px;border-radius:22px;box-shadow:var(--shadow-pass)}
.bar{width:110px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--brand);border-radius:2px;animation:ld 1.1s var(--ease) infinite}
@keyframes ld{from{transform:translateX(260%)}to{transform:translateX(-260%)}}

/* اندروید ضعیف (کلاس عملکرد تلگرام): انیمیشن های تزئینی خاموش */

/* مینی اپ فقط فارسی و انگلیسی دارد؛ ربات چهار زبان. کاربری که در ربات
   روسی یا چینی است، اینجا انگلیسی می بیند. */
const LANG_NAMES = { fa:['🇮🇷','فارسی'], en:['🇬🇧','English'] };
const I18N = {
  lang:'fa', dict:null, busy:false,
  FA:/[؀-ۿ]/,
  guess(){
    const c = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || '').toLowerCase().split('-')[0];
    return c === 'fa' || c === 'ps' || c === 'tg' ? 'fa' : c ? 'en' : 'fa';
  },
  use(lang){
    this.lang = lang === 'fa' ? 'fa' : L10N[lang] ? lang : 'en';
    this.dict = this.lang === 'fa' ? null : L10N[this.lang];
    const root = document.documentElement;
    root.lang = this.lang;
    root.dir = this.lang === 'fa' ? 'rtl' : 'ltr';
    setDateFormats(this.lang);
    this.all();
  },
  /* کلید بدون نیم فاصله و فاصله اضافه. اگر خود عبارت نبود، عددهایش
     {n} می شوند (مثل «4 پلن» → «{n} پلن») و بعد سر جایشان برمی گردند. */
  norm(s){ return s.replace(/\u200c/g, '').replace(/\s+/g, ' ').trim(); },
  text(s){
    const d = this.dict; if (!d || !s || !this.FA.test(s)) return s;
    const k = this.norm(s);
    let v = d[k];
    if (v == null) {
      const nums = k.match(/\d[\d,./]*/g);
      if (nums) { const tpl = d[k.replace(/\d[\d,./]*/g, '{n}')]; if (tpl != null) { let i = 0; v = tpl.replace(/\{n\}/g, () => nums[i++] || ''); } }
    }
    if (v == null) return s;
    const lead = s.match(/^\s*/)[0], tail = s.match(/\s*$/)[0];
    return lead + v + tail;
  },
  node(n){
    if (n.nodeType === 3) { const v = this.text(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; return; }
    if (n.nodeType !== 1) return;
    for (const a of ['placeholder','aria-label','title']) {
      const v = n.getAttribute && n.getAttribute(a);
      if (v && this.FA.test(v)) n.setAttribute(a, this.text(v));
    }
    const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    for (let c = w.nextNode(); c; c = w.nextNode()) {
      if (c.nodeType === 3) { const v = this.text(c.nodeValue); if (v !== c.nodeValue) c.nodeValue = v; }
      else for (const a of ['placeholder','aria-label','title']) {
        const v = c.getAttribute(a); if (v && this.FA.test(v)) c.setAttribute(a, this.text(v));
      }
    }
  },
  all(){ if (this.dict) this.node(document.body); },
  watch(){
    new MutationObserver(ms => {
      if (!this.dict) return;
      for (const m of ms) {
        if (m.type === 'characterData') this.node(m.target);
        else m.addedNodes.forEach(n => this.node(n));
      }
    }).observe(document.body, { childList:true, subtree:true, characterData:true });
  },
  t(s){ return this.text(s); }
};

const GB = 1024 ** 3;
function gb(n){
  if (n == null) return 'نامحدود';
  if (n >= GB) return fa((n / GB).toFixed(n >= 10 * GB ? 0 : 1)) + ' گیگ';
  return fa(Math.round(n / 1048576)) + ' مگ';
}
/* تقویم شمسی با رقم لاتین: nu-latn */
/* فارسی: تقویم شمسی؛ بقیه: میلادی به شکل 2026-09-25. رقم ها همیشه لاتین. */
let JD = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});
let JT = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{hour:'2-digit',minute:'2-digit',hour12:false});
let WD = ['ی','د','س','چ','پ','ج','ش'];
function setDateFormats(lang){
  if (lang === 'fa') {
    JD = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});
    JT = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{hour:'2-digit',minute:'2-digit',hour12:false});
    WD = ['ی','د','س','چ','پ','ج','ش'];
    return;
  }
  JD = new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'});
  JT = new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
  const f = new Intl.DateTimeFormat(lang, { weekday:'narrow' });
  WD = [0,1,2,3,4,5,6].map(i => f.format(new Date(Date.UTC(2024, 0, 7 + i, 12))));
}
const jdate = iso => { if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':JD.format(d); };
const jtime = iso => { if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':JT.format(d); };
const jfull  = iso => { if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':JD.format(d)+' · '+JT.format(d); };

/* مسیر پایه را سرور تزریق می کند. حدس زدن از روی location.pathname
   شکننده است: با و بدون اسلش پایانی دو جواب متفاوت می دهد. */
const BASE = '__BASE__' + 'api/';
const STATIC = '__BASE__' + 'static/';
const INIT = tg ? (tg.initData || '') : '';

async function api(path, body){
  const opt = { headers:{ 'X-Init-Data': INIT }, cache:'no-store' };
  if (body) {
    opt.method = 'POST';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(BASE + path, opt);
  let payload = null;
  try { payload = await res.json(); } catch(e){}
  if (!res.ok) {
    const err = new Error((payload && payload.error) || 'خطای ارتباط');
    err.code = payload && payload.code; err.status = res.status;
    throw err;
  }
  return payload;
}

   - اگر تلگرام قدیمی تر از ۸.۰ باشد، همه چیز مثل قبل می ماند: فاصله ها
     صفر و مینی اپ در همان برگه معمولی. */
const Viewport = {
  MOBILE: ['android', 'android_x', 'ios'],

  init(){
    const root = document.documentElement;

    /* برگشت بومی تلگرام از ۶.۱ هست؛ وقتی هست، دکمه برگشت داخل صفحه
       پنهان می شود تا دو دکمه برگشت کنار هم دیده نشوند. */
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) root.classList.add('tg-back');

    this.detectPerf();
    this.apply();

    ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged']
      .forEach(ev => { try { tg.onEvent(ev, () => this.apply()); } catch(e){} });
    /* شکست تمام صفحه (مثلا UNSUPPORTED) خطا نیست؛ فقط در همان برگه می مانیم */
    try { tg.onEvent('fullscreenFailed', () => this.apply()); } catch(e){}

    const mobile = this.MOBILE.indexOf(tg.platform) !== -1;
    if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && !tg.isFullscreen) {
      try { tg.requestFullscreen(); } catch(e){}
    }
  },

  /* اعداد تلگرام را در متغیرهای CSS می ریزد. محاسبه فاصله ها کار CSS
     است (--top = safe + content)؛ اینجا فقط منبع عدد عوض می شود. */
  apply(){
    const root = document.documentElement;
    const sa = tg.safeAreaInset || {};
    const ca = tg.contentSafeAreaInset || {};
    const px = v => (Number(v) > 0 ? Math.round(Number(v)) : 0) + 'px';
    root.style.setProperty('--tg-sa-t', px(sa.top));
    root.style.setProperty('--tg-sa-b', px(sa.bottom));
    root.style.setProperty('--tg-sa-l', px(sa.left));
    root.style.setProperty('--tg-sa-r', px(sa.right));
    root.style.setProperty('--tg-csa-t', px(ca.top));
    root.style.setProperty('--tg-csa-b', px(ca.bottom));
    root.classList.toggle('is-fs', !!tg.isFullscreen);
    App.syncHeight();
  },

  /* کلاس عملکرد اندروید از User-Agent، مثل:
     Telegram-Android/11.4.2 (Samsung SM-A125F; Android 12; SDK 31; LOW)
     فقط LOW را جدی می گیریم؛ AVERAGE و HIGH همان ظاهر کامل را دارند. */
  detectPerf(){
    const m = /Telegram-Android\/[\d.]+\s*\([^)]*;\s*(LOW|AVERAGE|HIGH)\s*\)/i
      .exec(navigator.userAgent || '');
    if (m && m[1].toUpperCase() === 'LOW') document.documentElement.classList.add('perf-low');
  }
};



/* ═════════ APP ═════════ */
const App = {
  tabName:'home', boot:null, stack:[],

  async start(){

      tg.ready(); tg.expand();

         و صفحه یک درز تیره می افتد. */
      try { tg.setHeaderColor('#EDF1F8'); tg.setBackgroundColor('#EDF1F8'); } catch(e){}
      try { tg.setBottomBarColor && tg.setBottomBarColor('#EDF1F8'); } catch(e){}

      try { tg.BackButton.onClick(() => App.back()); } catch(e){}
      Viewport.init();
    }
    this.syncHeight();
    window.addEventListener('resize', () => { this.syncHeight(); this.placeNav(); });
    try { document.fonts.ready.then(() => this.placeNav()); } catch(e){}
    this.watchFoot();
    this.renderNav();
    let err = null;
    I18N.watch();
    I18N.use(I18N.guess());
    try { this.boot = await api('bootstrap'); } catch(e) { err = e; }
    if (this.boot && this.boot.user && this.boot.user.lang) I18N.use(this.boot.user.lang);
    $('splash').classList.add('off');
    if (err) return this.fatal(err);
    this.tab('home');
  },

  syncHeight(){
    const fs = tg && tg.isFullscreen;
    const h = !fs && tg && tg.viewportStableHeight ? tg.viewportStableHeight : window.innerHeight;
    document.documentElement.style.setProperty('--vh', h + 'px');
  },

  haptic(k){ try { tg.HapticFeedback.impactOccurred(k || 'light'); } catch(e){} },
  notify(k){ try { tg.HapticFeedback.notificationOccurred(k); } catch(e){} },

  TABS: [['home','خانه'],['store','فروشگاه'],['wallet','کیف پول'],['account','حساب']],
  NAV_ICON: { home:'home', store:'store', wallet:'wallet', account:'user' },

  renderNav(){
    const nav = $('nav');
    let ind = $('nav-ind');
    if (!ind) { nav.innerHTML = '<span class="nav-ind still" id="nav-ind" aria-hidden="true"></span>'; ind = $('nav-ind'); }
    nav.querySelectorAll('.nav-i').forEach(b => b.remove());
    nav.insertAdjacentHTML('beforeend', this.TABS.map(([k, l]) => k === this.tabName
      ? `<button class="nav-i" onclick="App.tab('${k}')" aria-current="page"><span class="nav-pill">${ic(this.NAV_ICON[k],2)}<span class="nav-l">${l}</span></span></button>`
      : `<button class="nav-i" onclick="App.tab('${k}')" aria-label="${l}">${ic(this.NAV_ICON[k])}</button>`).join(''));
    this.placeNav();
  },

  /* قرص را زیر تب فعال می برد. بار اول (کلاس still) بی انیمیشن می نشیند.
     پهنای قرص به طول نام تب بستگی دارد، پس بعد از رسیدن فونت هم دوباره
     اندازه گرفته می شود. */
  placeNav(){
    const nav = $('nav'), ind = $('nav-ind'), pill = nav && nav.querySelector('.nav-pill');
    if (!ind || !pill || !pill.getBoundingClientRect) return;
    const n = nav.getBoundingClientRect(), r = pill.getBoundingClientRect();
    if (!r.width) return;
    ind.style.left = (r.left - n.left) + 'px';
    ind.style.width = r.width + 'px';
    if (ind.classList.contains('still')) requestAnimationFrame(() => requestAnimationFrame(() => ind.classList.remove('still')));
  },

  tab(name){
    this.tabName = name;
    this.closeAll(); this.closeSheet(); this.renderNav(); this.haptic();
    const v = $('view'); v.scrollTop = 0;
    v.innerHTML = '<div class="page"></div>';
    Pages[name](v.firstElementChild);
  },

  /* پشته زیرصفحه ها: برگشت از گفتگو به فهرست تیکت ها، نه به تب */
  go(name, param){ this.stack.push([name, param]); this.renderSub(); },
  back(){ this.stack.pop(); this.renderSub(); },
  closeAll(){ this.stack = []; this.renderSub(); },
  renderSub(){
    const box = $('sub'); box.innerHTML = '';
    const top = this.stack[this.stack.length - 1];
    $('app').classList.toggle('no-nav', !!(top && SubPages[top[0]].noNav));
    if (!top) { try { tg.BackButton.hide(); } catch(e){} return; }
    try { tg.BackButton.show(); } catch(e){}
    box.innerHTML = '<div class="scroll"><div class="page"></div></div>';
    SubPages[top[0]](box.firstElementChild.firstElementChild, top[1]);
  },

  /* نوار پایین زیرصفحه (.foot) باید مستقیم زیر #sub باشد. داخل .page که
     بماند، انیمیشن ورود صفحه (transform) آن را نسبت به خود صفحه جا می دهد
     و دکمه وسط صفحه، زیر محتوا می افتد؛ داخل .scroll هم با محتوا اسکرول
     می شود. صفحه ها .foot را همان جای همیشگی می سازند، این ناظر هر بار
     آن را بیرون می آورد. */
  watchFoot(){
    const sub = $('sub');
    new MutationObserver(() => {
      const f = sub.querySelector('.page .foot'); if (!f) return;
      [...sub.children].forEach(x => { if (x.classList.contains('foot')) x.remove(); });
      sub.appendChild(f);
    }).observe(sub, { childList:true, subtree:true });
  },

  sheet(html){ $('sheet').innerHTML = '<div class="grip"></div>' + html; $('sheet').classList.add('on'); $('scrim').classList.add('on'); this.haptic(); },
  closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); },

  toast(msg, bad){
    const t = $('toast');
    t.innerHTML = ic(bad ? 'warn' : 'check', 2.2) + '<span>' + esc(msg) + '</span>';
    t.classList.add('on'); clearTimeout(this._t);
    this._t = setTimeout(() => t.classList.remove('on'), 2200);
  },

  /* موجودی یک منبع دارد. هر جا عددش نشان داده می شود data-bal دارد. */
  setBalance(v){
    if (this.boot) this.boot.user.balance = v;
    document.querySelectorAll && document.querySelectorAll('[data-bal]').forEach(e => e.textContent = fa(v));
  },

  /* کپی در وب ویو تلگرام.

     navigator.clipboard در وب ویو تلگرام (مخصوصا iOS) اغلب رد می شود
     یا بی صدا هیچ کاری نمی کند. بدتر اینکه Promise است: وقتی reject
     می شود، «ژست کاربر» تمام شده و راه جایگزین هم دیگر مجاز نیست.

     پس ترتیب برعکس است: اول روش قدیمی execCommand که همزمان است و
     داخل همان کلیک اجرا می شود؛ فقط اگر آن شکست خورد سراغ روش مدرن
     می رویم. textarea هم باید واقعا در صفحه و قابل انتخاب باشد -
     display:none یا opacity صفر روی iOS انتخاب نمی شود. */
  copy(text){
    const value = String(text == null ? '' : text);
    const done = () => { this.haptic('medium'); this.toast('کپی شد'); };

    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText =
        'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;' +
        'outline:0;opacity:0.01;z-index:-1;font-size:16px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, value.length);   /* iOS بدون این کپی نمی کند */
      ok = document.execCommand('copy');
      ta.remove();
    } catch(e) { ok = false; }

    if (ok) return done();

    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(value)
        .then(done)
        .catch(() => this.copyFallback(value));
    }
    this.copyFallback(value);
  },

  /* آخرین راه: متن را نشان بده تا کاربر خودش دست بگیرد. بدتر از
     کپی خودکار است ولی خیلی بهتر از دکمه ای که بی صدا هیچ نمی کند. */
  copyFallback(value){
    this.sheet(`<div class="sheet-t" style="margin-bottom:6px">دستی کپی کن</div>
      <div class="topbar-s" style="margin-bottom:12px">مرورگر اجازه کپی خودکار نداد. روی متن نگه دار و کپی کن:</div>
      <textarea readonly onclick="this.select()" class="linkbox" style="width:100%;min-height:110px;border:none;resize:none;font-family:inherit">${esc(value)}</textarea>
      <button class="btn btn-s btn-block" style="margin-top:12px" onclick="App.closeSheet()">بستن</button>`);
  },



  openBot(start){
    const u = (this.boot && this.boot.bot && this.boot.bot.username) || '';
    if (!u) return this.toast('لینک ربات در دسترس نیست', true);
    const link = 'https://t.me/' + u + (start ? '?start=' + encodeURIComponent(start) : '');
    this.haptic('medium');
    if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); setTimeout(() => { try { tg.close(); } catch(e){} }, 150); }
    else location.href = link;
  },

  /* اشتراک با پنجره بومی تلگرام: کاربر مستقیم مخاطب را انتخاب می کند */
  share(url, text){
    const link = 'https://t.me/share/url?url=' + encodeURIComponent(url) + (text ? '&text=' + encodeURIComponent(text) : '');
    if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else this.copy(url);
  },

  fatal(err){
    const noAcc = err.code === 'no_account';
    $('nav').style.display = 'none';
    $('view').innerHTML = `<div class="page empty" style="min-height:70%;justify-content:center">
      <img class="logo" src="${logoSrc()}" alt="" style="width:64px;height:64px;border-radius:20px">
      <div class="empty-t">${noAcc ? 'اول در ربات ثبت نام کن' : 'باز نشد'}</div>
      <div class="empty-s">${esc(noAcc ? 'در ربات /start بزن و قوانین را بپذیر، بعد برگرد.' : (err.message || 'ارتباط برقرار نشد.'))}</div>
      <button class="btn btn-p" style="margin-top:6px" onclick="${noAcc ? 'App.openBot()' : 'location.reload()'}">${noAcc ? 'رفتن به ربات' : 'تلاش دوباره'}</button>
    </div>`;
  }
};

/* ── کارت عبور ── */
const PASS_COLORS = ['navy', 'ocean', 'indigo', 'ember'];
const TUNNEL = `<svg class="pass-art" width="190" height="190" viewBox="0 0 190 190" fill="none" aria-hidden="true"><path d="M20 190V95a75 75 0 0 1 150 0v95" stroke="var(--tunnel)" stroke-width="16"/><path d="M55 190V95a40 40 0 0 1 80 0v95" stroke="var(--tunnel)" stroke-width="10"/></svg>`;
const STATUS = {
  active:  { t:'فعال',        c:'' },
  warn:    { t:'رو به اتمام', c:'warn' },
  finished:{ t:'حجم تمام شد', c:'bad' },
  expired: { t:'منقضی',       c:'bad' },
};
function Pass(s, color, btn){
  const st = STATUS[s.status] || STATUS.active;
  const left = s.limit_bytes ? Math.max(0, s.limit_bytes - s.used_bytes) : null;
  const pct = s.limit_bytes ? Math.max(0, 100 - Math.min(100, s.percent)) : 100;
  const dead = s.expired || s.status === 'finished';
  const b = btn || (dead
    ? `<button class="pass-btn" onclick="event.stopPropagation();App.tab('store')">تمدید</button>`
    : `<button class="pass-btn" onclick="event.stopPropagation();App.go('detail',${s.id})">اتصال</button>`);
  return `<div class="pass ${color}${dead ? ' dim' : ''}" onclick="App.go('detail',${s.id})" role="button" aria-label="${esc(s.title)}">${TUNNEL}
    <div class="pass-head"><span class="pass-name">${esc(s.title)}</span><span class="pass-st ${st.c}"><i></i>${st.t}</span></div>
    <div class="pass-big"><span class="pass-num n">${left == null ? '∞' : esc(gbShort(left).replace(/[GM]$/, ''))}</span><span class="pass-unit">${left == null ? 'نامحدود' : (left >= GB ? 'گیگ مانده' : 'مگ مانده')}</span></div>
    <div class="pass-rail"><span style="width:${pct}%"></span></div>
    <div class="pass-foot"><span class="pass-meta">${dead ? 'منقضی شده' : `${N(s.days_left)} روز · تا ${N(jdate(s.expire_at))}`}</span>${b}</div>
  </div>`;
}
/* اسلایدر کارت های عبور. رنگ هر کارت از جایگاهش می آید: اول سرمه ای،
   بعد اقیانوسی، نیلی، آجری. */
function Slider(items){
  return `<div class="slider"><div class="slides" id="slides" onscroll="SliderFx.tick()">${
    items.map((s, i) => `<div class="slide">${Pass(s, PASS_COLORS[i % 4])}</div>`).join('')}</div>
    ${items.length > 1 ? `<div class="dots" id="dots">${items.map((_, i) => `<span class="dot${i ? '' : ' on'}"></span>`).join('')}</div>` : ''}</div>`;
}
const SliderFx = {
  idx:0, raf:0,
  tick(){
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => { this.raf = 0; this.apply(); });
  },
  apply(){
    const box = $('slides'); if (!box || !box.getBoundingClientRect) return;
    const c = box.getBoundingClientRect(), mid = c.left + c.width / 2;
    let best = 0, bestD = 1e9;
    [...box.children].forEach((el, i) => {
      const r = el.getBoundingClientRect();
      /* d: فاصله از مرکز به اندازه عرض یک کارت؛ جهت مستقل از RTL */
      const d = Math.max(-1, Math.min(1, (r.left + r.width / 2 - mid) / r.width));
      const a = Math.abs(d);
      if (!document.documentElement.classList.contains('perf-low')) {
        el.style.transform = `translateY(${a * 14}px) scale(${1 - a * .07}) rotateY(${-d * 14}deg) rotateZ(${d * 2.5}deg)`;
        el.style.opacity = String(1 - a * .35);
      }
      if (a < bestD) { bestD = a; best = i; }
    });
    if (best !== this.idx) {
      this.idx = best;
      try { tg.HapticFeedback.selectionChanged(); } catch(e){}
      const dots = $('dots');
      if (dots) [...dots.children].forEach((d, i) => d.classList.toggle('on', i === best));
    }
  }
};

/* ═════════ CHART ═════════
   نمودار خطی مصرف. SVG خالص، بدون کتابخانه.

   منحنی با درون یابی یکنوا (Fritsch–Carlson) ساخته می شود، نه
   منحنی های نرم معمولی مثل Catmull-Rom. منحنی معمولی بین دو نقطه
   «بیش جهش» دارد: روزی که مصرف صفر بوده، منحنی زیر صفر می رود و مصرف
   منفی نشان می دهد - که از نظر داده دروغ است. درون یابی یکنوا هرگز از
   بازه دو نقطه کنارش بیرون نمی زند و همچنان نرم است.

   محور زمان از چپ به راست است، مثل همه نمودارهای زمانی، حتی در
   رابط راست به چپ. */
let CHART_SEQ = 0;

function monotonePath(pts){
  const n = pts.length;
  if (n < 2) return '';
  if (n === 2) return `M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}`;
  const dx = [], dy = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx[i] = pts[i+1][0] - pts[i][0];
    dy[i] = pts[i+1][1] - pts[i][1];
    m[i]  = dx[i] ? dy[i] / dx[i] : 0;
  }
  // شیب هر نقطه: میانگین شیب دو طرف، صفر اگر جهت عوض شده
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) t[i] = (m[i-1] * m[i] <= 0) ? 0 : (m[i-1] + m[i]) / 2;
  t[n-1] = m[n-2];
  // اصلاح Fritsch–Carlson: جلوی بیش جهش را می گیرد
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i] / m[i], b = t[i+1] / m[i], h = a*a + b*b;
    if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i+1] = k * b * m[i]; }
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + t[i]*h).toFixed(1)} `
       + `${(pts[i+1][0] - h).toFixed(1)},${(pts[i+1][1] - t[i+1]*h).toFixed(1)} `
       + `${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;
  }
  return d;
}

/* گام های «گرد» محور عمودی: ۱، ۲ یا ۵ برابر توانی از ده */
function niceStep(max, ticks){
  const raw = max / ticks;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / pow;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow;
}

function gbShort(b){
  const g = b / GB;
  if (g >= 10) return Math.round(g) + 'G';
  if (g >= 1)  return g.toFixed(1).replace(/\.0$/, '') + 'G';
  return Math.round(b / 1048576) + 'M';
}

/* days: [{day:'2026-09-14', bytes:123}] */
function UsageChart(days){
  if (!days || days.length < 2)
    return `<div class="short" style="padding:26px 0">
      برای نمودار دست کم دو روز آمار لازم است</div>`;

  const id = 'uc' + (++CHART_SEQ);
  const W = 320, H = 168;
  const L = 30, R = 12, T = 30, B = 26;          // جا برای محور و برچسب ها
  const iw = W - L - R, ih = H - T - B;

  const vals = days.map(d => Math.max(0, d.bytes || 0));
  const maxV = Math.max(...vals);
  /* گام محور در واحد خودش (گیگ یا مگ) گرد می شود، نه در بایت. گرد
     کردن در بایت گام ۲ میلیارد بایت می داد = ۱.۸۶ گیگ، و محور برچسب
     های بی معنی مثل 1.9G و 3.7G می گرفت. */
  const unit = maxV >= GB ? GB : 1048576;
  const step = niceStep(Math.max(maxV / unit, 1), 3) * unit;
  const top  = step * Math.max(1, Math.ceil(maxV / step));
  const axis = v => {
    const n = v / unit;
    return (Number.isInteger(n) ? n : +n.toFixed(1)) + (unit === GB ? 'G' : 'M');
  };

  const x = i => L + (vals.length === 1 ? iw / 2 : i * iw / (vals.length - 1));
  const y = v => T + ih - (v / top) * ih;
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const line = monotonePath(pts);
  const area = `${line}L${pts[pts.length-1][0]},${T + ih}L${pts[0][0]},${T + ih}Z`;

  const grid = [];
  for (let v = step; v <= top + 1; v += step) {
    grid.push(`<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="uc-grid"/>
      <text x="${L - 6}" y="${y(v) + 3}" class="uc-y" text-anchor="end">${axis(v)}</text>`);
  }

  const xl = days.map((d, i) => `<text x="${x(i)}" y="${H - 6}" class="uc-x" text-anchor="middle">${
    WD[new Date(d.day).getDay()] || ''}</text>`).join('');

  /* برچسب بیشینه بالای نقطه، کمینه زیر آن. اگر همه روزها برابر
     باشند فقط یکی نشان داده می شود. */
  const iMax = vals.indexOf(maxV);
  const minV = Math.min(...vals);
  const iMin = vals.lastIndexOf(minV);
  const marker = (i, up) => {
    const [px, py] = pts[i];
    const label = gbShort(vals[i]);
    const w = 12 + label.length * 6.4;
    // قرص نباید از لبه ها بیرون بزند
    const cx = Math.min(W - R - w / 2, Math.max(L + w / 2, px));
    const ly = up ? Math.max(4, py - 30) : Math.min(H - B - 18, py + 12);
    const stemTo = up ? ly + 18 : ly;
    return `<line x1="${px}" x2="${px}" y1="${py}" y2="${stemTo}" class="uc-stem"/>
      <g transform="translate(${cx - w / 2},${ly})">
        <rect width="${w}" height="18" rx="9" class="${up ? 'uc-pill' : 'uc-pill uc-pill-min'}"/>
        <text x="${w / 2}" y="12.5" text-anchor="middle" class="uc-pill-t">${label}</text>
      </g>
      <circle cx="${px}" cy="${py}" r="7" class="uc-halo"/>
      <circle cx="${px}" cy="${py}" r="3.6" class="uc-dot"/>`;
  };
  /* مقدار مقایسه می شود نه اندیس: وقتی همه روزها برابرند، indexOf و
     lastIndexOf دو اندیس متفاوت می دهند و دو برچسب با عدد یکسان
     نشان داده می شد. */
  const marks = (maxV !== minV && maxV > 0)
    ? marker(iMin, false) + marker(iMax, true)
    : marker(iMax, true);

  return `<svg class="uc" viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="نمودار مصرف ${days.length} روز اخیر">
    <defs>
      <linearGradient id="${id}s" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" style="stop-color:var(--uc-a)"/><stop offset="1" style="stop-color:var(--uc-b)"/>
      </linearGradient>
      <linearGradient id="${id}f" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" style="stop-color:var(--uc-b);stop-opacity:.32"/>
        <stop offset=".7" style="stop-color:var(--uc-b);stop-opacity:.06"/>
        <stop offset="1" style="stop-color:var(--uc-b);stop-opacity:0"/>
      </linearGradient>
      <filter id="${id}g" x="-10%" y="-40%" width="120%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    ${grid.join('')}
    <line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" class="uc-base"/>
    <path d="${area}" fill="url(#${id}f)" class="uc-area"/>
    <path d="${line}" fill="none" stroke="url(#${id}s)" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round" filter="url(#${id}g)"
      pathLength="1" class="uc-line"/>
    ${marks}
    ${xl}
  </svg>`;
}

const TX = { charge:['cash','down','شارژ کیف پول'], purchase:['net','up','خرید سرویس'], referral:['cash','gift','پاداش هم‌سفر'] };
const TXS = { pending:['warn','در انتظار'], approved:['ok','تایید شده'], rejected:['bad','رد شده'], failed:['bad','ناموفق'] };
function TxRow(t){
  const m = TX[t.type] || ['', 'list', t.type];
  const st = TXS[t.status];
  const pos = t.amount > 0, dead = t.status === 'rejected' || t.status === 'failed' || t.status === 'pending';
  const color = dead ? 'var(--ink-3)' : pos ? 'var(--ok)' : 'var(--ink)';
  return Row({ kind:m[0], icon:m[1], title:m[2], sub:`${jdate(t.created_at)} · ${t.code}`, fn:`Sheets.tx(${t.id})`,
    end:`<span class="n" style="font-size:14px;color:${color}">${pos ? '+' : '−'}${money(t.amount)}</span>${st && t.status !== 'approved' ? Badge(st[0], st[1]) : ''}` });

SubPages.topup = async function(p){
  p.innerHTML = Top('شارژ کیف پول') + skel(1, 220);

    const d = await api('topup');

    Topup.step1(p);
  } catch (err) { p.innerHTML = Top('شارژ کیف پول') + emptyBox('خوانده نشد', err.message); }
};
SubPages.topup.noNav = true;

const Topup = {
  info:null, req:null, amount:0, img:null, busy:false,
  step1(p){
    p = p || $('sub').querySelector('.page');
    const d = this.info, pick = this.amount || d.presets[1] || d.presets[0];
    this.amount = pick;
    p.innerHTML = Top('شارژ کیف پول', 'قدم 1 از 2 · مبلغ') + `
      <div class="hero mx" style="margin-top:8px">
        <div class="lbl">مبلغ شارژ</div>
        <div class="amt-in"><input id="amt" inputmode="numeric" dir="ltr" value="${fa(pick)}" oninput="Topup.typed(this)" aria-label="مبلغ به تومان"><span>تومان</span></div>
        <div class="presets">${d.presets.map(v => `<button class="preset${v === pick ? ' on' : ''}" onclick="Topup.set(${v})"><span class="n">${fa(v)}</span></button>`).join('')}</div>
        <div class="short" style="text-align:right;margin-top:10px">حداقل ${N(fa(d.min))} تومان · پرداخت کارت به کارت، تایید در چند دقیقه</div>
      </div>
      <div class="foot"><button class="btn btn-p btn-block" id="amt-go" onclick="Topup.start()">ادامه و دیدن شماره کارت</button></div>`;
  },
  set(v){
    this.amount = v; App.haptic();
    const i = $('amt'); if (i) i.value = fa(v);
    document.querySelectorAll && document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b.textContent.replace(/,/g,'') == String(v)));
  },
  typed(el){
    const v = parseInt(String(el.value).replace(/[^\d]/g, '').replace(/^0+/, '') || '0', 10);
    this.amount = v;
    el.value = v ? fa(v) : '';
    document.querySelectorAll && document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b.textContent.replace(/,/g,'') == String(v)));
  },
  async start(){
    if (this.busy) return;
    if (this.amount < this.info.min) return App.toast('حداقل شارژ ' + fa(this.info.min) + ' تومان است', true);
    this.busy = true; const b = $('amt-go'); if (b) { b.disabled = true; b.textContent = 'در حال رزرو مبلغ…'; }
    try {
      this.req = await api('topup/start', { amount:this.amount });
      App.haptic('medium'); this.step2();
    } catch (err) { App.toast(err.message, true); if (b) { b.disabled = false; b.textContent = 'ادامه و دیدن شماره کارت'; } }
    finally { this.busy = false; }
  },
  step2(p){
    p = p || $('sub').querySelector('.page');
    const r = this.req, c = r.card || {};
    const num = String(c.number || '').replace(/[^\d]/g, '');
    const pretty = num.replace(/(\d{4})(?=\d)/g, '$1 ');
    const amt = fa(r.amount), cut = amt.length - 3;
    this.img = null;
    p.innerHTML = Top('شارژ کیف پول', 'قدم 2 از 2 · پرداخت و رسید') + `
      <div class="card pay mx" style="margin-top:8px">
        <div class="pay-m">
          <span class="lbl">مبلغ دقیق واریز</span>
          <span class="pay-v n">${amt.slice(0, cut)}<u>${amt.slice(cut)}</u></span>
          <span class="pay-r">تومان · ${N(fa(r.amount * 10))} ریال</span>
          <button class="btn btn-sm btn-s" onclick="App.copy('${r.amount * 10}')">${ic('copy')}کپی مبلغ (ریال)</button>
        </div>
        ${r.expires_at ? `<div class="clock" id="clock" role="timer" aria-label="مهلت پرداخت">
          <svg viewBox="0 0 78 78"><circle class="trk" cx="39" cy="39" r="34"/><circle class="arc" id="clock-arc" cx="39" cy="39" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg>
          <div class="clock-in"><b class="n" id="clock-t">--:--</b><span>مهلت پرداخت</span></div></div>` : ''}
      </div>
      <div id="expired"></div>
      <div class="bank">${TUNNEL}
        <div class="bank-top"><span>کارت مقصد</span><span>${c.bank ? 'بانک ' + esc(c.bank) : ''}</span></div>
        <div class="emv" aria-hidden="true"></div>
        <div class="bank-no n">${esc(pretty)}</div>
        <div class="bank-bot"><div>به نام<b>${esc(c.holder || '—')}</b></div>
          <button class="invite-copy" onclick="App.copy('${esc(num)}')" aria-label="کپی شماره کارت">${ic('copy')}<span>کپی</span></button></div>
      </div>
      ${Sec('عکس رسید')}
      <label class="upload mx" id="up">
        <input type="file" accept="image/*" onchange="Topup.pick(this)" hidden>

        <span class="upload-t" id="up-t">عکس رسید را انتخاب کن</span>

      </label>
      <div class="gap" style="height:6px"></div>${Sec('چطور شارژ می‌شود؟')}
      <div class="card mx"><ol class="steps">
        <li><span class="d n">1</span><div><b>مبلغ را دقیقا کپی کن</b><p>سه رقم آخر (${N(amt.slice(cut))}) شناسه توست و رسیدت با آن شناخته می‌شود. رندش نکن.</p></div></li>
        <li><span class="d n">2</span><div><b>کارت به کارت کن</b><p>از اپ بانکت همین مبلغ را به کارت بالا بزن${r.ttl_minutes ? `، ظرف ${N(r.ttl_minutes)} دقیقه` : ''}.</p></div></li>
        <li><span class="d n">3</span><div><b>عکس رسید را بفرست</b><p>اسکرین‌شات رسید بانکی را همین بالا انتخاب کن و «ارسال رسید» را بزن.</p></div></li>
        <li><span class="d">${ic('check',2.6)}</span><div><b>کیفت شارژ می‌شود</b><p>معمولا چند دقیقه طول می‌کشد. بعد از تایید، مبلغ به کیف پولت اضافه می‌شود و در ربات خبر می‌گیری.</p></div></li>
      </ol><div class="steps-warn">${ic('warn',2)}<span>اگر کمتر یا بیشتر واریز کنی، رسیدت خودکار شناخته نمی‌شود و تاییدش طول می‌کشد.</span></div></div>
      <div class="foot"><button class="btn btn-p btn-block" id="rc-go" disabled onclick="Topup.send()">ارسال رسید</button></div>`;
    this.tick();
  },

  /* شمارش معکوس مهلت مبلغ رزرو شده، از روی زمان پایان سرور. وقتی صفحه
     عوض شود (حلقه دیگر نیست) خودش می ایستد. مهلت که تمام شود رسید
     همچنان فرستادنی است - شاید کاربر واریز کرده - ولی پیشنهاد مبلغ تازه
     هم می آید. */
  tick(){
    clearInterval(this._clock);
    const end = this.req && this.req.expires_at ? new Date(this.req.expires_at).getTime() : NaN;
    if (isNaN(end)) return;
    const TOTAL = (this.req.ttl_minutes || 30) * 60 * 1000, LEN = 213.6;
    const draw = () => {
      const box = $('clock'); if (!box) return clearInterval(this._clock);
      const left = Math.max(0, end - Date.now()), sec = Math.ceil(left / 1000);
      $('clock-arc').setAttribute('stroke-dashoffset', String(LEN * (1 - Math.min(1, left / TOTAL))));
      box.classList.toggle('low', left > 0 && left < Math.min(5 * 60 * 1000, TOTAL / 4));
      box.classList.toggle('over', left <= 0);
      $('clock-t').textContent = left > 0 ? String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0') : 'تمام شد';
      if (left <= 0) {
        clearInterval(this._clock);
        $('expired').innerHTML = `<div class="expired">${ic('warn',2)}<span>مهلت تمام شد. اگر واریز کرده‌ای رسید را بفرست، وگرنه مبلغ تازه بگیر.</span>
          <button onclick="Topup.req=null;Topup.step1()">مبلغ تازه</button></div>`;
      }
    };
    draw();
    this._clock = setInterval(draw, 1000);
  },
  /* عکس روی گوشی کوچک می شود (حداکثر ۱۶۰۰ پیکسل، JPEG). هم آپلود روی
     اینترنت کند سریع تر می شود و هم اطلاعات جانبی عکس (مثل موقعیت
     مکانی در EXIF) پاک می شود. */
  pick(input){
    const f = input.files && input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        this.img = cv.toDataURL('image/jpeg', .85);
        const up = $('up');
        up.classList.add('has'); up.style.backgroundImage = `url(${this.img})`;
        $('up-t').textContent = 'رسید انتخاب شد · برای عوض کردن بزن';
        const b = $('rc-go'); if (b) b.disabled = false;
        App.haptic();
      };
      img.onerror = () => App.toast('این فایل عکس نیست', true);
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  },
  async send(){
    if (this.busy || !this.img) return;
    this.busy = true; const b = $('rc-go'); if (b) { b.disabled = true; b.textContent = 'در حال ارسال…'; }
    try {
      const r = await api('topup/receipt', { txn_id:this.req.txn_id, image:this.img });

        <div class="empty-t" style="font-size:19px">رسیدت رسید</div>
        <div class="empty-s">شارژ ${N(fa(r.amount))} تومان در حال بررسی است. بعد از تایید، در ربات خبر می‌گیری.</div>
        ${r.code ? `<div class="badge" style="margin-top:6px">کد پیگیری ${N(r.code)}</div>` : ''}
      </div><div class="foot"><button class="btn btn-p btn-block" onclick="App.tab('wallet')">برگشت به کیف پول</button></div>`;
      this.req = null; this.amount = 0;
    } catch (err) { App.toast(err.message, true); if (b) { b.disabled = false; b.textContent = 'ارسال رسید'; } }
    finally { this.busy = false; }
  }
};

/* گفتگو تمام صفحه است: نوار ناوبری کنار می رود و جایش دکمه پاسخ می نشیند */
SubPages.thread.noNav = true;

function Thread(messages){
  let out = '', lastDay = '', prevSide = null;
  messages.forEach((m, i) => {
    const day = jdate(m.created_at);
    if (day !== lastDay) {
      out += `<div class="day-sep"><span>${esc(day)}</span></div>`;
      lastDay = day; prevSide = null;
    }
    const next = messages[i + 1];
    const tail = !next || next.side !== m.side || jdate(next.created_at) !== day;
    const first = prevSide !== m.side;
    out += Bubble(m, first, tail, prevSide !== null && first);
    prevSide = m.side;
  });
  return `<div class="chat">${out}</div>`;
}

function Bubble(m, first, tail, turn){
  const mine = m.side === 'user';
  const cls = ['bubble-row', mine ? 'mine' : 'theirs'];
  if (tail) cls.push('tail');
  if (turn) cls.push('turn');
  return `<div class="${cls.join(' ')}"><div class="bubble ${mine ? 'bubble-mine' : 'bubble-theirs'}">`
    + (!mine && first ? `<span class="bubble-who">پشتیبانی</span>` : '')
    + (m.has_photo ? `<div class="bubble-photo">${ic('image')}تصویر — در ربات ببین</div>` : '')
    + (m.body ? `<span class="bubble-text">${esc(m.body)}</span>` : '')
    /* ساعت بعد از متن: شناوری که بعد از متن بیاید، اگر جا باشد روی
       همان خط آخر می نشیند و اگر نباشد به خط بعد می رود. */
    + `<span class="bubble-time">${jtime(m.created_at)}</span>`
    + `</div></div>`;
}

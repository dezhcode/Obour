[package]
name = "asotas-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "asotas_core"

[dependencies]
uniffi = { workspace = true }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
